<script>
const digitalModules=[
{d:0,title:'Crase: regras, exceções e armadilhas',time:35,parts:[
['A lógica da crase',`Crase é o encontro de dois “a”: a preposição exigida por uma palavra anterior e o artigo feminino que acompanha o termo seguinte. Compare: “Entreguei o documento a Pedro” (sem artigo feminino) e “Entreguei o documento à diretora” (o verbo entregar exige preposição a; diretora admite artigo a). Não basta existir uma palavra feminina: é necessário verificar as duas condições.\n\nPergunte primeiro: quem entrega, entrega algo A alguém? Sim. Depois: é natural dizer “a diretora recebeu o documento”? Sim. Portanto: a + a = à.`],
['O teste do masculino',`Substitua o termo feminino por um masculino equivalente. Se surgir “ao”, normalmente há crase na construção feminina: “Vou à escola” → “Vou ao colégio”. Se aparecer apenas “a”, não se justifica a crase: “Começou a estudar” → “Começou a trabalhar”.\n\nO teste é um auxílio, não substitui a análise da regência. Ele exige trocar o substantivo sem alterar o sentido e a estrutura da frase.`],
['Casos obrigatórios',`Use crase em locuções adverbiais femininas: à noite, à tarde, às vezes, à direita, à medida que, à proporção que. Use antes de horas determinadas: “A reunião começa às 14 horas”. Atenção: “desde as 14 horas” não recebe crase porque a preposição é desde, não a.\n\nAntes de aquele, aquela e aquilo, pode ocorrer crase quando o termo anterior exige a preposição a: “Refiro-me àquele processo”. A contração é a + aquele.`],
['Casos proibidos e facultativos',`Em regra, não use crase antes de verbo (“começou a ler”), de palavra masculina (“pagamento a prazo”), de pronome pessoal (“entreguei a ela”) ou entre palavras repetidas (“frente a frente”).\n\nO uso pode ser facultativo antes de possessivo feminino singular (“entreguei a/à minha colega”), antes de nome próprio feminino que admita artigo (“escrevi a/à Ana”) e após até (“fui até a/à escola”), observadas as condições de regência e artigo.`],
['Questão resolvida',`Analise: I. Cheguei à repartição cedo. II. Ficamos frente à frente. III. A reunião será às 9 horas.\n\nI está correta: chegar a + a repartição. II está incorreta: não há crase entre palavras repetidas; o correto é “frente a frente”. III está correta: às indica hora determinada. Resultado: apenas I e III estão corretas.`],
['Resumo e autoverificação',`Checklist: (1) a palavra anterior exige preposição a? (2) o termo seguinte admite artigo a? (3) é locução feminina ou hora determinada? (4) existe proibição específica?\n\nTeste sua memória: explique por que “a prazo” não tem crase e por que “à medida que” tem. Respostas: “prazo” é masculino; “à medida que” é locução conjuntiva feminina.`]]},
{d:0,title:'Concordância verbal: casos que confundem',time:30,parts:[
['Regra central',`O verbo concorda em número e pessoa com o núcleo do sujeito. “Os servidores chegaram”; “O servidor chegou”. Expressões entre vírgulas ou preposicionadas podem distrair: “A relação de documentos foi enviada”. O núcleo é relação (singular), não documentos.`],
['Sujeito posposto e composto',`“Chegaram os documentos” está correto: o sujeito vem depois do verbo, mas continua plural. Com sujeito composto anteposto, em regra o verbo vai ao plural: “O juiz e o escrevente analisaram os autos”. Com sujeito composto posposto, admite-se em certos contextos concordância com o núcleo mais próximo ou com o conjunto, conforme a norma e a construção.`],
['Verbos impessoais',`Haver no sentido de existir é impessoal e fica na terceira pessoa do singular: “Havia muitos processos”; “Deve haver recursos”. Já existir é pessoal: “Existiam muitos processos”; “Devem existir recursos”. Fazer indicando tempo decorrido também é impessoal: “Faz três anos”; “Vai fazer dois meses”.`],
['Porcentagens e expressões partitivas',`Com porcentagens, observe o numeral e a expressão que o acompanha: “1% dos candidatos faltou” e “20% dos candidatos faltaram” são construções usuais. Em expressões como “a maioria dos candidatos”, pode haver concordância com o núcleo singular ou com o termo plural, dependendo do contexto e da norma adotada. Em prova, analise a frase completa.`],
['Exemplo comentado',`Qual está correta? A) Haviam dúvidas. B) Fazem dois meses. C) Existem dúvidas. D) Deve existirem vagas.\n\nResposta: C. “Existir” concorda com dúvidas. A erra porque haver existencial é impessoal; B erra porque fazer temporal é impessoal; D erra porque, na locução “deve existir”, o verbo principal permanece no infinitivo.`]]},
{d:0,title:'Interpretação de textos: inferência e argumento',time:30,parts:[
['Informação explícita e inferência',`Informação explícita aparece diretamente no texto. Inferência é uma conclusão sustentada por pistas textuais, sem extrapolar o que foi escrito. Se o texto diz “Apesar da chuva, o evento ocorreu”, é possível inferir que a chuva representou um obstáculo, mas não que houve poucos participantes.`],
['Tema, tese e argumento',`Tema é o assunto geral. Tese é a posição defendida pelo autor. Argumentos são razões ou evidências usadas para sustentar a tese. Em um texto sobre digitalização da Justiça, o tema pode ser a tecnologia; a tese, que ela amplia o acesso quando acompanhada de inclusão digital; os argumentos, economia de tempo e redução de barreiras.`],
['Conectivos mudam a lógica',`“Embora” e “apesar de” indicam concessão; “portanto” indica conclusão; “porque” pode indicar causa ou explicação; “contudo” indica oposição. Compare: “O serviço é rápido, mas exige cadastro” e “O serviço é rápido, portanto exige cadastro”. A segunda frase altera indevidamente a relação lógica.`],
['Pegadinhas frequentes',`Desconfie de alternativas com “sempre”, “nunca”, “somente” ou “todos” quando o texto faz afirmações limitadas. Separe a opinião do autor de fatos relatados e de hipóteses. Não use conhecimentos externos para contrariar o que a questão pede sobre a posição do texto.`],
['Exercício resolvido',`Texto: “A adoção de sistemas digitais reduziu deslocamentos, mas ainda exige medidas de acessibilidade.” Pergunta: o autor defende que a digitalização resolveu todos os obstáculos? Não. A conjunção “mas” introduz uma ressalva: persistem necessidades de acessibilidade.`]]},
{d:9,title:'Excel: referências e cópia de fórmulas',time:35,parts:[
['Referências relativas',`Em Excel, A1 é referência relativa: ao copiar a fórmula uma coluna à direita e duas linhas abaixo, A1 passa a B3. O deslocamento é aplicado à coluna e à linha. Uma fórmula =A1+B1 copiada de C1 para D3 vira =B3+C3.`],
['Referências absolutas e mistas',`$A$1 fixa coluna e linha; $A1 fixa apenas a coluna; A$1 fixa apenas a linha. Se =$A5+B$2+$D$4 for copiada de C5 para E8, o deslocamento é +2 colunas e +3 linhas. Resultado: =$A8+D$2+$D$4. Observe cada parcela separadamente.`],
['Intervalos em funções',`SOMA(A1:B3) soma as seis células do retângulo formado pelas colunas A e B e linhas 1 a 3. MÉDIA calcula a média aritmética dos valores numéricos; CONT.NÚM conta células numéricas; CONT.VALORES conta células não vazias. A função SE testa uma condição: =SE(A1>=7;"Aprovado";"Revisar").`],
['Erros e cuidados',`#DIV/0! indica divisão por zero; #REF! indica referência inválida; #NOME? costuma surgir quando o Excel não reconhece o nome de uma função ou referência. Não confunda a fixação pelo cifrão com o valor da célula: o símbolo $ altera como a referência se desloca, não transforma o conteúdo em moeda.`],
['Questão comentada',`A fórmula =SOMA(A$1:$B2), na célula C1, é copiada para D2. O deslocamento é +1 coluna e +1 linha: A$1 vira B$1 e $B2 vira $B3. Portanto a nova fórmula é =SOMA(B$1:$B3). Se B1=5, B2=15 e B3 estiver vazia, o resultado será 20.`]]},
{d:8,title:'Porcentagem: cálculo rápido e variações',time:25,parts:[
['Parte sobre o total',`Para descobrir quanto uma parte representa do total, calcule (parte ÷ total) × 100. Exemplo: 10 unidades em um estoque de 250 correspondem a (10 ÷ 250) × 100 = 4%. Um atalho é perceber que 1% de 250 é 2,5; portanto 10 unidades representam 4%.`],
['Variação percentual',`A variação sempre usa como base o valor inicial: (novo − inicial) ÷ inicial × 100. Se a previsão era 8.000 e o resultado foi 9.200, a variação é 1.200 ÷ 8.000 × 100 = 15% acima da previsão.`],
['Aumentos sucessivos',`Dois aumentos de 10% não equivalem a 20% sobre o valor original. Começando com 100: após o primeiro aumento, 110; após o segundo, 121. A variação acumulada é 21%. Em fatores: 1,10 × 1,10 = 1,21.`],
['Desconto e recuperação',`Um desconto de 20% em R$ 200 resulta em R$ 160. Para voltar de R$ 160 a R$ 200, o aumento necessário é 40 ÷ 160 = 25%, não 20%. O denominador muda porque a base da comparação mudou.`],
['Questão resolvida',`Um setor tinha 80 processos pendentes e passou a 68. Redução absoluta: 12. Redução percentual: 12 ÷ 80 × 100 = 15%. A alternativa correta é “redução de 15%”.`]]},
{d:1,title:'Direito Penal: princípios e aplicação da lei',time:30,parts:[
['Legalidade e anterioridade',`O art. 1º do Código Penal estabelece que não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal. O princípio impede que uma conduta seja punida criminalmente apenas porque alguém a considera reprovável. Também exige previsão legal anterior ao fato.`],
['Lei penal no tempo',`A regra é aplicar a lei vigente no momento do fato. Pelo art. 2º do Código Penal, lei posterior que deixa de considerar o fato crime faz cessar a execução e os efeitos penais da sentença condenatória. Lei posterior mais benéfica aplica-se a fatos anteriores, mesmo decididos por sentença transitada em julgado.`],
['Tempo do crime',`O art. 4º adota a teoria da atividade: considera-se praticado o crime no momento da ação ou omissão, ainda que o resultado ocorra depois. Isso pode ser relevante para determinar qual lei penal se aplica ao fato.`],
['Territorialidade',`Como regra, a lei penal brasileira aplica-se ao crime cometido no território nacional (art. 5º), sem prejuízo de convenções, tratados e regras de direito internacional. Há hipóteses específicas de extraterritorialidade no art. 7º, que exigem leitura cuidadosa das condições legais.`],
['Exemplo de prova',`Uma lei nova reduz a pena de determinado crime após a condenação definitiva. A lei mais benéfica pode retroagir? Sim, nos termos do art. 2º, parágrafo único, do Código Penal. Isso não significa que toda lei posterior retroage: a lei mais gravosa, em regra, não retroage.`]]},
{d:4,title:'Constitucional: direitos fundamentais',time:30,parts:[
['Direitos e garantias',`O art. 5º da Constituição reúne direitos e garantias fundamentais. Direitos são posições jurídicas protegidas, como liberdade e igualdade; garantias são instrumentos de proteção desses direitos, como habeas corpus e mandado de segurança. A distinção é útil, mas não elimina a relação entre ambos.`],
['Igualdade e legalidade',`O caput do art. 5º assegura igualdade perante a lei, sem distinção de qualquer natureza. O inciso II determina que ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de lei. Em provas, atenção à diferença entre a liberdade do particular e a atuação da Administração Pública, vinculada ao ordenamento jurídico.`],
['Contraditório e ampla defesa',`O art. 5º, LV, assegura contraditório e ampla defesa aos litigantes, em processo judicial ou administrativo, e aos acusados em geral, com os meios e recursos a ela inerentes. Contraditório envolve ciência e possibilidade de reação; ampla defesa, os meios adequados para defender interesses.`],
['Remédios constitucionais',`Habeas corpus protege a liberdade de locomoção diante de ilegalidade ou abuso de poder. Mandado de segurança protege direito líquido e certo não amparado por habeas corpus ou habeas data, observadas as condições constitucionais e legais. Habeas data envolve conhecimento e retificação de informações pessoais em registros nas hipóteses previstas.`],
['Questão resolvida',`Um candidato afirma que a ampla defesa só existe em processo judicial. A afirmação está errada: o art. 5º, LV, menciona expressamente processo judicial ou administrativo. A banca pode explorar exatamente essa extensão da garantia.`]]}
];
let librarySearch='';
function renderDigitalLibrary(){tab='Biblioteca';const root=document.getElementById('main');const saved=JSON.parse(localStorage.getItem('aprovatj_digital_read')||'{}');root.innerHTML=`<h2>Biblioteca digital de aulas</h2><p class="muted">Aulas autorais em desenvolvimento. Material complementar: ainda não cobre o edital integral.</p><input class="library-search" placeholder="Buscar disciplina ou capítulo..." value="${esc(librarySearch)}" oninput="librarySearch=this.value;renderDigitalLibrary()"><p class="muted tiny">${Object.keys(saved).length} de ${digitalModules.length} capítulos marcados como lidos</p><div class="library-grid">${digitalModules.map((x,i)=>({x,i})).filter(({x})=>(subjects[x.d]+' '+x.title).toLowerCase().includes(librarySearch.toLowerCase())).map(({x,i})=>`<div class="card"><span class="pill">${esc(subjects[x.d])}</span><h3>${esc(x.title)}</h3><p class="muted">${x.parts.length} seções • ${x.time} min estimados</p><button class="btn primary" onclick="openDigitalLesson(${i})">${saved[i]?'Revisar capítulo':'Ler capítulo'}</button></div>`).join('')}</div>`;}
function openDigitalLesson(i){tab='BibliotecaAula';const x=digitalModules[i];if(!x)return;const saved=JSON.parse(localStorage.getItem('aprovatj_digital_read')||'{}');document.getElementById('main').innerHTML=`<button class="btn" onclick="renderDigitalLibrary()">← Biblioteca digital</button><div class="card" style="margin-top:14px"><span class="pill">${esc(subjects[x.d])}</span><h2>${esc(x.title)}</h2><p class="muted">${x.parts.length} seções • leitura estimada ${x.time} min • material autoral</p><div class="lesson-progress"><div style="width:${saved[i]?'100':'0'}%"></div></div>${x.parts.map(([h,t],j)=>`<div class="lesson-block"><h3>${j+1}. ${esc(h)}</h3><div class="lesson-text">${esc(t)}</div></div>`).join('')}<div class="notice"><b>Prática de recuperação</b><p>Feche o texto e tente explicar as regras, os exemplos e as exceções sem consultar. Depois faça exercícios da disciplina.</p></div><button class="btn primary" onclick="markDigitalRead(${i})">${saved[i]?'✓ Marcado como lido':'Marcar como lido'}</button> <button class="btn" onclick="start(${x.d})">Treinar disciplina</button><p class="muted tiny">A leitura marcada não significa domínio. A seleção de artigos deve ser conferida com o edital consolidado e a legislação atualizada.</p></div>`;window.scrollTo(0,0);}
function markDigitalRead(i){const key='aprovatj_digital_read';const saved=JSON.parse(localStorage.getItem(key)||'{}');saved[i]=new Date().toISOString();localStorage.setItem(key,JSON.stringify(saved));openDigitalLesson(i);}
const originalDrawDigital=draw;draw=function(){if(tab==='Biblioteca'){renderDigitalLibrary();return;}if(tab==='BibliotecaAula')return;originalDrawDigital();if(tab==='Estudar'){const root=document.getElementById('main');const el=document.createElement('div');el.className='card';el.innerHTML='<h3>📖 Biblioteca digital aprofundada</h3><p>Capítulos com teoria, exemplos resolvidos, exceções e revisão. O material está sendo ampliado por assunto.</p><button class="btn primary" onclick="renderDigitalLibrary()">Abrir biblioteca digital</button>';root.prepend(el);}};

// Expansão editorial v1.4 — capítulos autorais adicionais
digitalModules.push(...[{"d": 0, "title": "Interpretação de textos: inferências e pressupostos", "time": 35, "parts": [["Compreender não é adivinhar", "A resposta deve ser sustentada por marcas do texto. Informação explícita é afirmada diretamente; inferência é conclusão autorizada por pistas textuais. Exemplo: “Embora estivesse cansada, Ana revisou os autos”. É possível inferir que o cansaço não impediu a revisão, mas não que Ana trabalhava até tarde."], ["Tema, tese e argumento", "Tema é o assunto geral; tese é a posição defendida; argumento é a razão apresentada. Num texto sobre atendimento digital, o tema pode ser tecnologia no serviço público; a tese, que a digitalização exige inclusão; e o argumento, que parte dos cidadãos tem dificuldade de acesso."], ["Pressupostos e subentendidos", "Em “João voltou a estudar”, pressupõe-se que João estudava anteriormente. Em “Até a diretora compareceu”, o termo até sugere surpresa ou expectativa de ausência. A banca pode pedir qual informação é pressuposta sem estar declarada literalmente."], ["Coesão e conectores", "“Entretanto” introduz contraste; “portanto”, conclusão; “porque”, causa ou explicação conforme o contexto; “embora”, concessão. Trocar um conector pode alterar a relação lógica e o sentido do período."], ["Exemplo resolvido", "Texto: “O sistema agilizou o protocolo; contudo, alguns usuários ainda necessitam de atendimento presencial.” Pergunta: o conectivo indica quê? Resposta: oposição ou ressalva. O texto não afirma que o sistema falhou, mas que a melhoria não elimina todas as necessidades."], ["Pratique sem olhar", "Explique a diferença entre tema e tese; identifique o pressuposto de “Maria deixou de faltar”; substitua “contudo” por um conector de mesmo valor. Respostas: assunto versus posição; Maria faltava antes; porém/entretanto."]]}, {"d": 0, "title": "Pontuação: vírgula, oração e sentido", "time": 35, "parts": [["Separar não é respirar", "Vírgula organiza relações sintáticas. Não se separa sujeito do predicado: “Os servidores da unidade, concluíram o relatório” está incorreto. Também não se separa o verbo de seu complemento direto por vírgula sem motivo sintático."], ["Adjuntos adverbiais", "Adjuntos deslocados podem ser isolados: “Na manhã seguinte, o cartório abriu”. A obrigatoriedade da vírgula depende da estrutura e da extensão; evite decorar regras absolutas para todos os adjuntos curtos."], ["Orações explicativas e restritivas", "“Os servidores, que fizeram o curso, receberam certificado” apresenta oração explicativa, sugerindo todos os servidores do conjunto. “Os servidores que fizeram o curso receberam certificado” restringe o grupo aos que fizeram o curso."], ["Conectivos e termos intercalados", "Em “O processo, portanto, prosseguirá”, o conectivo intercalado aparece isolado. Vocativos também são separados: “Colegas, iniciem a reunião”. Apostos explicativos: “A capital paulista, São Paulo, concentra muitos órgãos”."], ["Exemplo resolvido", "Compare “Os candidatos que estudaram passaram” com “Os candidatos, que estudaram, passaram”. A primeira restringe quais candidatos passaram; a segunda apresenta o estudo como explicação relativa a todo o conjunto referido."], ["Revisão ativa", "Reescreva corretamente: “A equipe de apoio, encaminhou os documentos”. Resposta: “A equipe de apoio encaminhou os documentos”. Explique por que não se deve separar sujeito e verbo."]]}, {"d": 1, "title": "Direito Penal: dolo, culpa e tentativa", "time": 35, "parts": [["Fato típico e elementos", "Para estudar a estrutura analítica do crime, diferencie conduta, resultado quando exigido, nexo causal e tipicidade. A configuração concreta também depende de ilicitude e culpabilidade, conforme a análise jurídica."], ["Dolo e culpa", "O art. 18 do Código Penal distingue crime doloso, quando o agente quis o resultado ou assumiu o risco de produzi-lo, e culposo, quando deu causa por imprudência, negligência ou imperícia. A modalidade culposa só é punível quando prevista em lei."], ["Tentativa e consumação", "Pelo art. 14, I, o crime é consumado quando reúne todos os elementos de sua definição legal. Há tentativa quando, iniciada a execução, a consumação não ocorre por circunstâncias alheias à vontade do agente. Em regra, a pena da tentativa é diminuída de um a dois terços, ressalvada disposição contrária."], ["Desistência voluntária e arrependimento eficaz", "Art. 15: se o agente voluntariamente desiste de prosseguir na execução ou impede que o resultado se produza, responde somente pelos atos já praticados. Isso difere da tentativa, em que a não consumação decorre de fatores externos."], ["Caso resolvido", "Uma pessoa inicia a execução de um furto, mas é impedida por segurança antes de consumá-lo. Em tese, pode haver tentativa, desde que estejam presentes os demais requisitos. Se ela decide parar por vontade própria, analisa-se a desistência voluntária."], ["Lei e revisão", "Leia os arts. 14, 15 e 18 do Código Penal em fonte oficial atualizada. Pergunta: toda conduta descuidada é crime culposo? Não; exige previsão legal da modalidade culposa e demais requisitos."]]}, {"d": 2, "title": "Processo Penal: inquérito e ação penal", "time": 35, "parts": [["Finalidade do inquérito", "O inquérito policial é procedimento administrativo de investigação para apurar infração penal e autoria. Não equivale a processo judicial nem, por si, produz condenação."], ["Características e limites", "Em regra, é escrito, sigiloso na medida necessária à investigação e inquisitivo; não significa ausência de direitos fundamentais. A defesa tem prerrogativas de acesso aos elementos já documentados que interessem ao exercício defensivo, conforme legislação e jurisprudência."], ["Ação penal pública e privada", "Na ação penal pública, a titularidade é do Ministério Público, podendo depender de representação ou requisição nos casos previstos. Na privada, em regra, a iniciativa cabe ao ofendido ou representante legal, por queixa."], ["Denúncia versus queixa", "Denúncia é a peça inicial típica da ação penal pública; queixa-crime, da privada. Representação não é sinônimo de denúncia: é condição de procedibilidade em hipóteses legalmente previstas."], ["Exemplo comentado", "A vítima comparece à delegacia e comunica o fato. Isso não significa que já foi ajuizada ação penal. É necessário distinguir notícia-crime, investigação e ato formal de propositura da ação."], ["Revisão", "Compare titularidade, peça inicial e necessidade de manifestação da vítima nas diferentes modalidades. Consulte os arts. 4º a 23 e 24 a 62 do CPP conforme o recorte efetivo do edital."]]}, {"d": 3, "title": "Processo Civil: prazos e atos processuais", "time": 35, "parts": [["Contagem em dias úteis", "O art. 219 do CPC prevê que, na contagem de prazo em dias estabelecido por lei ou juiz, computam-se somente dias úteis; a regra aplica-se aos prazos processuais. Não extrapole para prazos materiais sem análise."], ["Exclusão do início", "Pelo art. 224, salvo disposição em contrário, exclui-se o dia do começo e inclui-se o do vencimento. Há regras próprias para início de prazo conforme a forma de intimação e para indisponibilidade do sistema."], ["Prazos e intimações", "Não basta contar dias: primeiro identifique quando se considera realizada a intimação e quando começa a correr o prazo. Intimação eletrônica e publicação têm disciplinas próprias."], ["Preclusão", "Preclusão é a perda da faculdade processual em certas situações: temporal (decurso do prazo), consumativa (ato já praticado) ou lógica (ato incompatível com comportamento anterior)."], ["Exemplo resolvido", "Um prazo processual de cinco dias úteis começa a correr em uma terça-feira, sem feriados e supondo que o termo inicial já foi definido corretamente. Os cinco dias contados são terça, quarta, quinta, sexta e segunda. Atenção: essa hipótese é didática, não define o termo inicial de uma intimação real."], ["Revisão", "Leia os arts. 218 a 235 do CPC e diferencie prazo material de processual. Treine com calendários que indiquem feriados e suspensões, pois a contagem depende deles."]]}, {"d": 4, "title": "Constitucional: direitos fundamentais e remédios", "time": 35, "parts": [["Direitos e garantias", "Direitos fundamentais protegem posições jurídicas essenciais. Garantias são instrumentos de proteção desses direitos. A leitura deve partir da Constituição, sobretudo do art. 5º, respeitando os incisos efetivamente exigidos."], ["Habeas corpus", "Protege a liberdade de locomoção contra violência ou coação por ilegalidade ou abuso de poder, inclusive ameaça. Não é via genérica para proteger qualquer direito."], ["Mandado de segurança", "Protege direito líquido e certo não amparado por habeas corpus ou habeas data, diante de ilegalidade ou abuso de poder de autoridade, observados requisitos legais. Pode ser individual ou coletivo."], ["Habeas data e mandado de injunção", "Habeas data tutela acesso e retificação de informações pessoais em registros de caráter público, conforme hipóteses legais. Mandado de injunção enfrenta falta de norma regulamentadora que inviabilize o exercício de direitos e liberdades constitucionais e prerrogativas inerentes à nacionalidade, soberania e cidadania."], ["Exemplo resolvido", "Uma pessoa sofre ameaça ilegal à sua liberdade de ir e vir: analise habeas corpus. Se busca corrigir dados pessoais em banco público e preenche os requisitos legais, analise habeas data. O direito ameaçado é o ponto decisivo."], ["Revisão", "Monte uma tabela com direito protegido, legitimidade e pressupostos de cada remédio. Confira o art. 5º, LXVIII a LXXII, e legislação específica em fonte oficial."]]}, {"d": 5, "title": "Administrativo: atos administrativos e atributos", "time": 35, "parts": [["Elementos do ato", "Na classificação tradicional, competência, finalidade, forma, motivo e objeto são elementos do ato administrativo. Diferencie o elemento motivo (pressupostos) da motivação (exposição das razões)."], ["Presunção de legitimidade", "Atos administrativos gozam, em regra, de presunção relativa de legitimidade e veracidade, admitindo prova em contrário. Isso não torna todo ato correto nem impede controle judicial."], ["Imperatividade e autoexecutoriedade", "Imperatividade permite impor obrigações independentemente de concordância do destinatário em certas hipóteses. Autoexecutoriedade não existe em todo ato: depende de previsão legal ou urgência que a justifique."], ["Anulação e revogação", "Anulação se relaciona à ilegalidade; revogação, à conveniência e oportunidade de ato válido, observados limites. O Judiciário pode controlar legalidade, mas não substituir livremente o mérito administrativo legítimo."], ["Exemplo resolvido", "Um ato praticado por agente incompetente apresenta vício de competência. Uma decisão válida que deixa de ser conveniente pode ser revogada pela Administração, desde que seja juridicamente revogável."], ["Revisão", "Explique em voz alta a diferença entre motivo e motivação, anulação e revogação. Consulte legislação e entendimentos aplicáveis ao programa confirmado do concurso."]]}, {"d": 7, "title": "Matemática: razão, proporção e regra de três", "time": 35, "parts": [["Razão", "Razão compara duas grandezas por divisão. Se 12 dos 48 processos são urgentes, a razão entre urgentes e total é 12/48 = 1/4. Isso equivale a 25%."], ["Proporção", "Proporção é igualdade entre razões. Se a/b = c/d, com denominadores não nulos, então a·d = b·c. A igualdade é ferramenta, não substitui análise das unidades."], ["Regra de três direta", "Quando duas grandezas crescem ou diminuem na mesma proporção, a relação é direta. Exemplo: 4 cadernos custam R$ 28; 7 custam 28×7/4 = R$ 49, mantendo o preço unitário."], ["Regra de três inversa", "Quando uma grandeza cresce e a outra diminui na proporção correspondente, a relação é inversa. Exemplo: 3 pessoas executam uma tarefa em 8 horas; 6 pessoas com mesma produtividade levariam 4 horas."], ["Exemplo resolvido", "Uma equipe digitaliza 240 páginas em 6 horas a ritmo constante. Em 9 horas digitaliza 240×9/6 = 360 páginas. Verifique se a produtividade é assumida constante; sem isso, não é possível concluir."], ["Pratique", "Se 5 caixas guardam 150 pastas igualmente, quantas pastas cabem em 8 caixas iguais? Resposta: 240. Se 4 pessoas fazem tarefa em 12 dias, 6 pessoas igualmente produtivas fazem em 8 dias."]]}, {"d": 8, "title": "Informática: segurança, phishing e backups", "time": 35, "parts": [["Tríade da segurança", "Confidencialidade impede acesso não autorizado; integridade protege contra alterações indevidas; disponibilidade garante acesso quando necessário. Uma medida pode contribuir para mais de um objetivo."], ["Phishing", "É tentativa de obter dados ou induzir ações por mensagens ou páginas enganosas. Sinais incluem urgência artificial, domínio suspeito e pedidos de senha. A aparência visual legítima não comprova autenticidade."], ["Autenticação multifator", "Combina fatores de categorias diferentes, como senha e aplicativo autenticador. Duas senhas não constituem necessariamente autenticação multifator. Mesmo com MFA, é necessário cuidado com engenharia social."], ["Backup e restauração", "Backup é cópia recuperável dos dados. Sincronização simples não é substituto automático de backup, porque exclusões ou corrupção podem se propagar. Testar a restauração é parte essencial da estratégia."], ["Exemplo resolvido", "Um funcionário recebe mensagem solicitando atualização urgente da senha por link desconhecido. A conduta adequada é não acessar o link, verificar o pedido por canal oficial e comunicar o incidente conforme o procedimento institucional."], ["Revisão", "Diferencie vírus, ransomware e phishing; explique por que cópias desconectadas ajudam a mitigar ransomware. Atenção às versões de sistemas e ferramentas cobradas no edital."]]}, {"d": 9, "title": "Raciocínio Lógico: proposições e negações", "time": 35, "parts": [["O que é proposição", "Proposição é enunciado declarativo ao qual se atribui valor verdadeiro ou falso. “O processo foi arquivado” pode ser proposição; “Arquive o processo!” é ordem e não é proposição na lógica proposicional clássica."], ["Conectivos", "Conjunção p ∧ q é verdadeira somente quando ambas são verdadeiras. Disjunção inclusiva p ∨ q é falsa apenas quando ambas são falsas. Condicional p → q é falsa apenas quando p é verdadeira e q é falsa."], ["Negação de e/ou", "Pelas leis de De Morgan: negar “p e q” resulta em “não p ou não q”; negar “p ou q” resulta em “não p e não q”. Não basta trocar e por ou sem negar cada componente."], ["Negação da condicional", "A negação de “se p, então q” é “p e não q”. Exemplo: negar “Se estudo, então passo” é afirmar “Estudo e não passo”, não “Se não estudo, não passo”."], ["Exemplo resolvido", "Negue: “Ana estuda Português e Matemática”. Resposta: “Ana não estuda Português ou não estuda Matemática”. O ou é inclusivo; basta que uma das partes não ocorra."], ["Revisão", "Construa tabelas-verdade de duas proposições e verifique cada regra. Negue: “João trabalha ou estuda”. Resposta: “João não trabalha e não estuda”."]]}, {"d": 10, "title": "Estatuto da Pessoa com Deficiência: fundamentos", "time": 35, "parts": [["Conceito legal", "A Lei 13.146/2015 define pessoa com deficiência considerando impedimento de longo prazo de natureza física, mental, intelectual ou sensorial que, em interação com barreiras, pode obstruir participação plena e efetiva em igualdade de condições."], ["Barreiras", "A lei trata de barreiras urbanísticas, arquitetônicas, nos transportes, nas comunicações e informação, atitudinais e tecnológicas. A identificação da barreira é essencial para entender acessibilidade."], ["Acessibilidade e desenho universal", "Acessibilidade busca utilização com segurança e autonomia de espaços, mobiliários, transportes, informação e serviços. Desenho universal orienta a concepção de produtos e ambientes para uso pelo maior número possível de pessoas, sem necessidade de adaptação específica."], ["Capacidade civil", "A deficiência não afeta a plena capacidade civil da pessoa, inclusive em aspectos explicitados no art. 6º. Não confunda deficiência com incapacidade jurídica automática."], ["Exemplo resolvido", "Um sistema de atendimento público que só aceita interação por mouse cria barreira tecnológica para alguns usuários. Navegação por teclado e compatibilidade com tecnologias assistivas são exemplos de medidas de acessibilidade."], ["Revisão", "Consulte os arts. 2º, 3º e 6º da Lei 13.146/2015. Compare impedimento e barreira; identifique exemplos de acessibilidade comunicacional e tecnológica."]]}, {"d": 6, "title": "Legislação interna: como estudar normas e competências", "time": 35, "parts": [["Atenção ao texto oficial", "Este capítulo é uma metodologia de leitura, não uma reprodução de normas específicas do TJ-SP. Os atos e artigos efetivamente exigidos devem ser importados do edital e conferidos na versão vigente antes de criar uma aula normativa definitiva."], ["Quem faz o quê", "Ao estudar um artigo de organização judiciária, marque sujeito da competência, verbo da atribuição, condições, exceções e eventual prazo. Uma troca de sujeito pode tornar uma alternativa falsa."], ["Regras gerais e exceções", "Separe o caput dos parágrafos e incisos. Exceções frequentemente aparecem em parágrafos, e a banca pode transformar uma regra aplicável apenas em certa hipótese numa afirmação geral."], ["Exemplo didático, não normativo", "Considere a regra hipotética: “O setor A recebe pedidos eletrônicos; excepcionalmente, o setor B recebe pedidos físicos”. Seria incorreto afirmar que o setor B recebe todos os pedidos. O exemplo ensina leitura, não descreve regra do TJ-SP."], ["Técnica de revisão", "Crie cartões “órgão → atribuição”, “ato → prazo”, “regra → exceção”. Confira atualizações e revogações antes de memorizar. Não estude apenas resumos quando a cobrança exigir literalidade."], ["Próximo passo", "Depois de conferir o Anexo VIII, cada norma será dividida por capítulos e artigos, com comentários específicos e exercícios de literalidade. Nenhuma regra hipotética será apresentada como oficial."]]}, {"d": 10, "title": "Atualidades: leitura crítica de notícias e fontes", "time": 35, "parts": [["O que avaliar", "Atualidades exige contexto, cronologia, instituições e consequências. Uma manchete isolada não basta: procure a data do fato, a fonte original e o que foi efetivamente decidido ou publicado."], ["Fato, opinião e projeção", "“Foi publicada uma lei” é afirmação verificável; “a lei é excelente” é opinião; “a lei deverá melhorar indicadores” é projeção. Questões podem explorar confusão entre essas categorias."], ["Instituições e atribuições", "Diferencie poderes, órgãos e níveis federativos. Ao ler notícia sobre decisão judicial, identifique qual tribunal decidiu, se houve recurso e qual o alcance da decisão."], ["Exemplo resolvido", "Manchete: “Projeto de lei avança em comissão”. Não é correto concluir que o projeto já virou lei. É necessário verificar as etapas legislativas posteriores."], ["Rotina de estudo", "Organize resumos por mês e tema, com fonte e data, evitando memorizar informações não confirmadas. Para a prova, aplique o intervalo temporal previsto no edital, que ainda precisa de conferência documental."], ["Revisão", "Para cada notícia, responda: o que aconteceu? quando? onde? quem decidiu? qual fonte primária? o que ainda é hipótese?"]]}] );

let readerSize=Number(localStorage.getItem('aprovatj_reader_size')||18);
let activeReader=null;
function setReaderSize(delta){readerSize=Math.max(15,Math.min(25,readerSize+delta));localStorage.setItem('aprovatj_reader_size',readerSize);document.documentElement.style.setProperty('--reader-size',readerSize+'px');}
function readerKey(i){return 'aprovatj_reader_chapter_'+i}
function findChapterQuestions(x){let terms=(x.title+' '+x.parts.map(p=>p[0]).join(' ')).toLowerCase();let ranked=q.filter(a=>a[1]===x.d).map(a=>{let topic=String(a[2]).toLowerCase();let score=terms.includes(topic)?3:topic.split(' ').some(w=>w.length>4&&terms.includes(w))?1:0;return {a,score}}).filter(v=>v.score>0).sort((a,b)=>b.score-a.score).map(v=>v.a);return ranked.slice(0,5)}
function saveReaderPosition(){if(activeReader===null)return;const el=document.querySelector('.reader-body');if(!el)return;const rect=el.getBoundingClientRect();const y=Math.max(0,window.scrollY);localStorage.setItem(readerKey(activeReader),JSON.stringify({y,updated:Date.now()}));}
let lastReaderSave=0;window.addEventListener('scroll',()=>{if(activeReader===null||Date.now()-lastReaderSave<700)return;lastReaderSave=Date.now();saveReaderPosition()},{passive:true});
function readerQuestion(i,j){const x=digitalModules[i];const a=findChapterQuestions(x)[j];if(!a)return;const key='aprovatj_reader_answers_'+i;const ans=JSON.parse(localStorage.getItem(key)||'{}');if(ans[a[0]]!==undefined)return;const chosen=document.querySelector('input[name="readerq'+j+'"]:checked');if(!chosen)return;ans[a[0]]=Number(chosen.value);localStorage.setItem(key,JSON.stringify(ans));const host=document.getElementById('reader-q-'+j);host.innerHTML=renderReaderQuestion(i,j);}
function renderReaderQuestion(i,j){const a=findChapterQuestions(digitalModules[i])[j];const answers=JSON.parse(localStorage.getItem('aprovatj_reader_answers_'+i)||'{}');const val=answers[a[0]],done=val!==undefined;return `<div class="card" style="margin:14px 0"><p class="muted tiny">Questão autoral • ${esc(a[2])}</p><b>${esc(a[3])}</b><div>${a[4].map((v,k)=>`<label class="practice-option"><input type="radio" name="readerq${j}" value="${k}" ${done?'disabled':''} ${val===k?'checked':''}> <b>${'ABCDE'[k]}.</b> ${esc(v)}</label>`).join('')}</div>${done?`<div class="practice-feedback"><b>${val===a[5]?'✓ Resposta correta':'Resposta correta: '+ 'ABCDE'[a[5]]}</b><p>${esc(a[6])}</p><p class="reader-note">Questão de desenvolvimento, não oficial da Vunesp.</p></div>`:`<button class="btn primary" onclick="readerQuestion(${i},${j})">Corrigir resposta</button>`}</div>`}
function openDigitalLesson(i){const x=digitalModules[i];if(!x)return;activeReader=i;tab='BibliotecaAula';const saved=JSON.parse(localStorage.getItem('aprovatj_digital_read')||'{}');const related=findChapterQuestions(x);const root=document.getElementById('main');root.innerHTML=`<button class="btn" onclick="activeReader=null;renderDigitalLibrary()">← Índice da apostila</button><div class="reader-toolbar"><button class="btn" onclick="setReaderSize(-1)">A− Fonte</button><button class="btn" onclick="setReaderSize(1)">A+ Fonte</button><button class="btn" onclick="saveReaderPosition();alert('Ponto de leitura salvo neste navegador.')">🔖 Salvar posição</button></div><div class="card reader-body" style="margin-top:10px"><span class="pill">${esc(subjects[x.d])}</span><h2>${esc(x.title)}</h2><p class="reader-note">${x.parts.length} seções • ${x.time} minutos estimados • conteúdo autoral em desenvolvimento</p><div class="reader-progress"><div style="width:${saved[i]?'100%':'0%'}"></div></div>${x.parts.map(([h,t],j)=>`<div class="lesson-block"><h3>${j+1}. ${esc(h)}</h3><div class="lesson-text">${esc(t)}</div></div>`).join('')}<hr><h3>Pratique o que aprendeu</h3><p class="reader-note">As questões são associadas por tema. Quando não houver questão específica, não apresentamos exercícios de outra matéria como se fossem desta aula.</p>${related.length?related.map((a,j)=>`<div id="reader-q-${j}">${renderReaderQuestion(i,j)}</div>`).join(''):'<div class="notice">Ainda não há exercícios específicos cadastrados para este capítulo. A aula continua disponível para leitura.</div>'}<button class="btn primary" onclick="markDigitalRead(${i})">${saved[i]?'✓ Capítulo lido':'Marcar capítulo como lido'}</button> <button class="btn" onclick="activeReader=null;start(${x.d})">Mais questões da disciplina</button><p class="reader-note">A leitura não comprova domínio. Confira o edital e a legislação vigente antes da prova.</p></div>`;setReaderSize(0);const position=JSON.parse(localStorage.getItem(readerKey(i))||'null');requestAnimationFrame(()=>window.scrollTo(0,position?.y||0));}

digitalModules.push(...[{"d": 0, "title": "Concordância nominal e verbal — curso aprofundado", "time": 55, "parts": [["Concordância verbal", "O verbo normalmente concorda com o núcleo do sujeito em pessoa e número. “Os servidores chegaram” está correto; “Os servidores chegou” não. Para resolver questões longas, identifique o sujeito e ignore provisoriamente expressões intercaladas: “A relação dos documentos exigidos foi publicada”. O núcleo é relação, no singular."], ["Sujeito composto", "Quando o sujeito composto vem antes do verbo, o plural é a regra: “O escrevente e a chefia conferiram os autos”. Quando vem depois, pode haver concordância com o núcleo mais próximo em certos contextos, ou com o conjunto: “Chegaram o juiz e os servidores”. Observe o efeito de sentido e a norma-padrão exigida."], ["Verbo haver", "Haver no sentido de existir é impessoal e fica na terceira pessoa do singular: “Havia muitos processos pendentes”. O auxiliar também permanece singular: “Deve haver recursos”. Já existir concorda com o sujeito: “Existiam muitos processos”. É uma das trocas mais exploradas em provas."], ["Verbo fazer e tempo", "Fazer indicando tempo decorrido é impessoal: “Faz dois anos que o sistema foi instalado”. Com auxiliar: “Deve fazer dois anos”. Em “Os servidores fazem relatórios”, fazer indica ação e concorda normalmente."], ["Expressões partitivas e percentuais", "Em “A maioria dos candidatos compareceu”, a concordância com maioria é segura; em certos contextos também se admite plural com o termo plural que acompanha a expressão. Com percentuais, observe o numeral e o termo especificador: “1% dos inscritos faltou”; “20% dos inscritos faltaram”. Questões podem exigir análise contextual."], ["Concordância nominal", "Adjetivos concordam com os substantivos a que se referem: “documentos e certidões atualizados” é possível quando o adjetivo posposto qualifica o conjunto. Atenção a palavras invariáveis em certas construções: “menos pessoas”, nunca “menas pessoas”. “Meio” advérbio é invariável: “Ela estava meio cansada”; numeral varia: “meia hora”."], ["Casos de bastante, anexo e obrigado", "“Bastante” varia quando é adjetivo (“bastantes razões”), mas não quando é advérbio (“estudaram bastante”). “Anexo” concorda: “Seguem anexas as cópias”; “em anexo” é locução invariável. “Obrigado/obrigada” concorda com quem agradece na norma tradicional."], ["Exemplo comentado", "Questão: “Devem haver muitas inscrições pendentes”. Correção: “Deve haver muitas inscrições pendentes”. O verbo principal haver, com sentido de existir, é impessoal; o auxiliar deve permanece no singular. Já “Devem existir muitas inscrições pendentes” está correto porque inscrições é sujeito de existir."], ["Treino de fixação", "Corrija: (a) “Fazem três meses”; (b) “Houveram reclamações”; (c) “Seguem anexo as atas”. Respostas: (a) “Faz três meses”; (b) “Houve reclamações”; (c) “Seguem anexas as atas”. Explique a regra em voz alta antes de avançar."]]}, {"d": 0, "title": "Regência verbal e nominal — do básico às armadilhas", "time": 55, "parts": [["O que é regência", "Regência é a relação entre uma palavra e seu complemento, com ou sem preposição. “Assistir ao julgamento” no sentido de presenciar, segundo a norma-padrão tradicional, exige a; “assistir o paciente” no sentido de prestar assistência admite objeto direto. O sentido do verbo importa."], ["Chegar, ir e preferir", "Na norma-padrão formal, chegar e ir indicam destino com preposição a: “Cheguei ao fórum”; “Fui à audiência”. Preferir estabelece comparação sem “mais... do que”: “Prefiro estudar Direito a estudar Informática”. A construção “prefiro mais X do que Y” é inadequada na norma tradicional cobrada."], ["Obedecer, visar e aspirar", "“Obedecer às normas” exige a. “Visar ao cargo” no sentido de almejar pede a na regência tradicional; “visar o documento” significa apor visto e é transitivo direto. “Aspirar ao cargo” é desejar; “aspirar o ar” é sorver. A banca pode alterar o sentido mantendo a preposição."], ["Informar e lembrar", "Informar admite construções como “Informei o resultado aos candidatos” e “Informei os candidatos do resultado”. “Lembrei o prazo” e “Lembrei-me do prazo” ilustram a diferença de regência associada à forma pronominal. Verifique sempre qual construção foi efetivamente usada."], ["Regência nominal", "Substantivos e adjetivos também exigem complementos: “acesso aos autos”, “favorável ao pedido”, “compatível com o sistema”, “necessidade de revisão”. A troca de preposição pode comprometer a correção gramatical."], ["Regência e crase", "A crase frequentemente depende da regência: “Obedeceu à ordem” = obedeceu a + a ordem. Em “Obedeceu a uma ordem”, não há artigo definido feminino a, logo não há crase. Estude regência antes de tentar decorar todas as situações de crase."], ["Pronomes relativos", "O pronome relativo pode exigir preposição antes de si: “A norma a que me referi” (referir-se a); “O assunto de que preciso” (precisar de). “A norma que me referi” omite a preposição exigida."], ["Exemplo resolvido", "“O servidor aspirava o cargo e obedecia as ordens”. No sentido de desejar, prefira “aspirava ao cargo”; com obedecer, “obedecia às ordens”. As duas correções dependem de regência; a segunda também envolve crase."], ["Autoavaliação", "Complete: “A regra ___ que aludi foi publicada”; “Prefiro a revisão ___ memorização mecânica”. Respostas: “a que”; “à memorização mecânica”, pois preferir X a Y, e memorização admite artigo a."]]}, {"d": 1, "title": "Crimes contra a Administração Pública — conceitos e casos", "time": 55, "parts": [["Panorama", "O Código Penal reúne crimes praticados por funcionário público contra a Administração e crimes praticados por particulares contra a Administração. O enquadramento exige examinar a conduta descrita na lei, não apenas o cargo da pessoa envolvida. Confira a redação vigente dos arts. 312 e seguintes."], ["Peculato: ideia central", "No peculato-apropriação, o funcionário se apropria de dinheiro, valor ou bem móvel de que tem posse em razão do cargo; no peculato-desvio, desvia esse bem em proveito próprio ou alheio. Não confunda desvio de finalidade administrativa genérico com o tipo penal: os elementos legais precisam estar presentes."], ["Concussão e corrupção passiva", "Concussão (art. 316) envolve exigir vantagem indevida em razão da função. Corrupção passiva (art. 317) envolve solicitar ou receber vantagem indevida, ou aceitar promessa dela, em razão da função. “Exigir” e “solicitar” são verbos diferentes; a banca costuma explorar essa diferença."], ["Corrupção ativa", "Corrupção ativa (art. 333) refere-se a oferecer ou prometer vantagem indevida a funcionário público para determiná-lo a praticar, omitir ou retardar ato de ofício. É importante diferenciar a conduta do particular daquela do agente público; os tipos têm elementos próprios."], ["Prevaricação", "Prevaricação (art. 319) é retardar ou deixar de praticar indevidamente ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal. O elemento subjetivo específico é decisivo; nem todo atraso funcional configura prevaricação."], ["Funcionário público para fins penais", "O art. 327 traz conceito penal amplo de funcionário público, inclusive quem exerce função pública transitoriamente ou sem remuneração. O conceito penal não se confunde necessariamente com o conceito administrativo de servidor estatutário."], ["Caso comparativo", "Caso A: agente exige dinheiro para praticar ato funcional — pense em concussão. Caso B: agente pede dinheiro — avalie corrupção passiva. Caso C: particular oferece dinheiro para influenciar ato de ofício — avalie corrupção ativa. A identificação preliminar depende do verbo, mas o tipo completo exige os demais requisitos."], ["Armadilhas Vunesp", "Não iguale “exigir”, “solicitar”, “receber” e “oferecer”. Não conclua que toda irregularidade administrativa é crime. Distinga sujeito ativo, vantagem indevida, relação com a função e finalidade. Releia os tipos na lei atualizada antes da prova."], ["Revisão ativa", "Sem consultar: defina peculato, concussão, corrupção passiva, corrupção ativa e prevaricação em uma frase cada. Em seguida crie um exemplo de cada um, sublinhando o verbo nuclear da conduta."]]}, {"d": 2, "title": "Provas no processo penal — teoria e situações práticas", "time": 55, "parts": [["Finalidade da prova", "A prova permite reconstruir fatos relevantes para a decisão. No processo penal, a busca de esclarecimento deve respeitar direitos fundamentais, contraditório e regras de admissibilidade. Elementos de investigação não se confundem automaticamente com provas produzidas em juízo."], ["Artigo 155 do CPP", "O juiz forma sua convicção pela livre apreciação da prova produzida em contraditório judicial, não podendo fundamentar sua decisão exclusivamente nos elementos informativos da investigação, ressalvadas as provas cautelares, não repetíveis e antecipadas. A palavra “exclusivamente” é essencial."], ["Provas ilícitas", "O art. 157 do CPP considera inadmissíveis as provas ilícitas, obtidas em violação a normas constitucionais ou legais, e disciplina provas derivadas, com ressalvas legais. Não trate toda irregularidade processual como prova ilícita sem análise."], ["Cadeia de custódia", "A cadeia de custódia documenta o histórico cronológico do vestígio, do reconhecimento ao descarte, para preservar rastreabilidade e confiabilidade. O CPP disciplina etapas e procedimentos próprios; não é sinônimo apenas de guardar objetos num armário."], ["Testemunhas e declarações", "Diferencie depoimento testemunhal, interrogatório do acusado, declarações da vítima e perícia. Cada meio tem função, limites e regras próprias. O acusado tem garantias, incluindo o direito ao silêncio, que não pode ser tratado como confissão automática."], ["Perícia e exame de corpo de delito", "Quando a infração deixa vestígios, a legislação prevê exame de corpo de delito, direto ou indireto, observadas as regras aplicáveis. A confissão não substitui automaticamente o exame exigido. A prova pericial deve ser interpretada com os demais elementos."], ["Exemplo resolvido", "A sentença cita apenas relatos colhidos na delegacia, sem provas judiciais ou exceções legalmente admitidas. A situação exige atenção ao art. 155: a fundamentação exclusivamente em elementos informativos da investigação é vedada, ressalvadas as hipóteses legais."], ["Questões de revisão", "Por que “exclusivamente” importa no art. 155? O que é cadeia de custódia? Toda prova derivada de uma ilícita será sempre inadmissível sem qualquer exceção? Revise a redação legal antes de responder."]]}, {"d": 3, "title": "Tutela provisória e recursos no CPC — guia de leitura", "time": 55, "parts": [["Tutela provisória", "O CPC organiza tutela provisória em tutela de urgência e de evidência. A tutela de urgência pode ter natureza cautelar ou antecipada; ambas têm requisitos e finalidades que não devem ser confundidos."], ["Probabilidade e perigo", "O art. 300 exige, para tutela de urgência, elementos que evidenciem probabilidade do direito e perigo de dano ou risco ao resultado útil do processo. A decisão pode exigir caução conforme o caso, e há restrições específicas à tutela antecipada quando houver perigo de irreversibilidade."], ["Tutela de evidência", "A tutela de evidência (art. 311) pode ser concedida independentemente da demonstração de perigo de dano ou de risco ao resultado útil, nas hipóteses previstas em lei. Isso não significa concessão automática sempre que a parte afirma ter razão."], ["Sentença e decisão interlocutória", "Sentença é o pronunciamento judicial que, nos termos dos arts. 485 e 487, põe fim à fase cognitiva do procedimento comum ou extingue a execução, ressalvadas disposições legais. Decisão interlocutória é pronunciamento decisório que não se enquadra como sentença."], ["Apelação e agravo", "Em linhas gerais, cabe apelação contra sentença (art. 1.009). O agravo de instrumento é cabível contra decisões interlocutórias nas hipóteses legais (art. 1.015 e interpretação jurisprudencial pertinente). Não suponha que toda interlocutória admite agravo imediato."], ["Embargos de declaração", "O art. 1.022 prevê embargos de declaração para esclarecer obscuridade, eliminar contradição, suprir omissão ou corrigir erro material. Eles não são recurso genérico para simplesmente rediscutir o mérito sem apontar vício cabível."], ["Exemplo aplicado", "Uma decisão judicial deixa de enfrentar pedido relevante. A parte pode avaliar embargos de declaração por omissão. Se o pronunciamento encerra a fase cognitiva e se enquadra como sentença, a via recursal ordinária normalmente será apelação, respeitadas exceções."], ["Método de estudo", "Crie tabela própria: pronunciamento judicial, finalidade, recurso em tese cabível e artigo. Em questões, procure palavras como “sempre”, “qualquer” e “automaticamente”: frequentemente escondem generalizações indevidas."]]}, {"d": 4, "title": "Administração pública na Constituição — art. 37 explicado", "time": 55, "parts": [["Princípios expressos", "O caput do art. 37 da Constituição apresenta legalidade, impessoalidade, moralidade, publicidade e eficiência — mnemônico LIMPE. Eles orientam a Administração direta e indireta de qualquer dos Poderes e entes federativos, observada a redação constitucional."], ["Legalidade administrativa", "Para o particular, em regra, vale a liberdade de fazer o que a lei não proíbe; a Administração atua vinculada ao ordenamento e às competências legais. Não significa que todo ato dependa de uma lei individualizada, mas que precisa de fundamento jurídico."], ["Impessoalidade e moralidade", "Impessoalidade veda favorecimentos pessoais indevidos e exige atuação voltada à finalidade pública. Moralidade administrativa envolve padrões jurídicos de probidade, lealdade e boa-fé. Um ato pode ser formalmente praticado por autoridade competente e ainda assim ser inválido por desvio de finalidade."], ["Publicidade e eficiência", "Publicidade promove transparência e controle, ressalvados sigilos constitucional e legalmente legítimos. Eficiência exige desempenho adequado e uso responsável dos recursos; não autoriza descumprir legalidade para obter resultados mais rápidos."], ["Concurso público", "O art. 37, II, estabelece regra de investidura em cargo ou emprego público mediante aprovação prévia em concurso, ressalvadas nomeações para cargo em comissão declarado em lei de livre nomeação e exoneração. Leia também as regras sobre validade e prioridade de convocação."], ["Acumulação de cargos", "A Constituição prevê proibição geral de acumulação remunerada de cargos públicos, com exceções e requisitos, incluindo compatibilidade de horários. A disciplina constitucional foi alterada ao longo do tempo; confira o texto vigente para memorizar as hipóteses exatas."], ["Responsabilidade civil do Estado", "O art. 37, § 6º, trata da responsabilidade das pessoas jurídicas de direito público e das de direito privado prestadoras de serviços públicos por danos que seus agentes, nessa qualidade, causem a terceiros, assegurado direito de regresso em casos previstos. Diferencie responsabilidade perante a vítima e responsabilidade regressiva do agente."], ["Caso resolvido", "Uma autoridade promove campanha institucional destacando sua imagem pessoal como se a obra fosse conquista particular. O caso pode envolver violação da impessoalidade e da regra constitucional sobre publicidade institucional. Não confunda publicidade de atos com autopromoção."], ["Revisão", "Explique cada letra de LIMPE e crie um exemplo. Depois compare regra de concurso e exceção dos cargos em comissão, e identifique a diferença entre responsabilidade estatal e ação regressiva."]]}, {"d": 5, "title": "Atos administrativos — elementos, atributos e invalidação", "time": 55, "parts": [["Conceito", "Ato administrativo é manifestação da Administração, sob regime jurídico aplicável, que produz efeitos jurídicos. Nem toda atuação estatal é ato administrativo: contratos, fatos materiais e atos políticos exigem classificação própria."], ["Cinco elementos", "A doutrina costuma estudar competência, finalidade, forma, motivo e objeto. Competência é quem pode agir; finalidade é o objetivo público; forma é a exteriorização; motivo são pressupostos de fato e de direito; objeto é o efeito jurídico imediato."], ["Motivo e motivação", "Motivo é a situação de fato e de direito que autoriza o ato. Motivação é a exposição desses fundamentos. Não são sinônimos. A teoria dos motivos determinantes associa a validade do ato à veracidade e adequação dos motivos explicitados."], ["Presunção e imperatividade", "A presunção de legitimidade e veracidade é relativa, não absoluta. Imperatividade significa possibilidade de impor obrigações independentemente da concordância do destinatário, mas nem todos os atos possuem esse atributo."], ["Autoexecutoriedade", "Em certas hipóteses, a Administração pode executar diretamente decisões sem prévia autorização judicial, quando houver previsão legal ou urgência juridicamente reconhecida. Não é atributo universal de todos os atos."], ["Anulação e revogação", "Anulação decorre de ilegalidade; revogação, de conveniência e oportunidade sobre atos válidos, respeitados limites. A Administração pode anular seus atos ilegais e revogar atos válidos quando cabível; o Judiciário controla legalidade, não substitui livremente o mérito administrativo."], ["Convalidação", "Alguns vícios podem ser sanados conforme a legislação e a natureza do defeito, desde que não haja prejuízo ao interesse público ou a terceiros. Não se convalidam automaticamente todos os vícios: a análise depende do elemento atingido e do regime aplicável."], ["Exemplo resolvido", "Uma licença é expedida por agente sem competência legal. Investigue o vício de competência e se a hipótese admite convalidação. Se a autoridade competente desfaz ato válido apenas porque mudou sua avaliação de conveniência, o instituto em tese é revogação, não anulação."], ["Exercício mental", "Classifique: (a) ato ilegal; (b) ato válido, mas inconveniente; (c) ato com justificativa baseada em fato inexistente. Respostas iniciais: (a) anulação; (b) revogação, quando cabível; (c) possível invalidade por vício do motivo."]]}, {"d": 7, "title": "Estatuto da Pessoa com Deficiência — acessibilidade e atendimento", "time": 55, "parts": [["Modelo social da deficiência", "A Lei 13.146/2015 considera a interação entre impedimentos de longo prazo e barreiras que podem obstruir participação em igualdade de condições. Não reduza a deficiência a um diagnóstico médico isolado; a lei adota perspectiva de direitos e participação."], ["Barreiras em categorias", "O art. 3º distingue barreiras urbanísticas, arquitetônicas, nos transportes, nas comunicações e informação, atitudinais e tecnológicas. Uma escada sem alternativa acessível é barreira arquitetônica; sistema incompatível com leitor de tela pode constituir barreira tecnológica."], ["Acessibilidade", "Acessibilidade envolve possibilidade e condição de alcance e utilização com segurança e autonomia de espaços, mobiliário, equipamentos, transportes, informação, comunicação e serviços, em áreas urbanas e rurais, conforme a definição legal."], ["Adaptação razoável", "Adaptações razoáveis são modificações e ajustes necessários e adequados que não imponham ônus desproporcional ou indevido, quando requeridos em cada caso, para assegurar exercício de direitos em igualdade. Não confunda com desenho universal, que orienta concepção ampla desde o início."], ["Atendimento prioritário", "O Estatuto prevê atendimento prioritário em condições legais. É essencial ler o art. 9º e as normas correlatas, distinguindo prioridade de atendimento, proteção e procedimentos específicos; não invente uma ordem absoluta aplicável a qualquer situação."], ["Capacidade civil e autonomia", "O art. 6º afirma que a deficiência não afeta a plena capacidade civil da pessoa. A curatela, quando cabível, é medida extraordinária e proporcional, com disciplina específica. É incorreto presumir incapacidade apenas pela existência de deficiência."], ["Comunicação acessível", "No serviço público, acessibilidade pode exigir linguagem clara, recursos de comunicação, tecnologias assistivas e alternativas de atendimento. Exemplo: disponibilizar documento digital acessível, em vez de apenas imagem sem texto selecionável."], ["Caso prático", "Um cidadão utiliza leitor de tela, mas o formulário eletrônico possui botões sem identificação. A barreira é tecnológica e comunicacional. A correção deve considerar identificação de campos, navegação por teclado e compatibilidade com tecnologia assistiva."], ["Revisão", "Compare barreira atitudinal e tecnológica; explique adaptação razoável versus desenho universal; diga por que deficiência não implica incapacidade civil. Consulte a lei vigente para detalhes de prioridade."]]}, {"d": 8, "title": "Juros simples, compostos e descontos — passo a passo", "time": 55, "parts": [["Capital, taxa e tempo", "Capital é o valor inicial; taxa é o percentual por período; tempo é o número de períodos. Antes de calcular, padronize unidades: 2% ao mês com prazo em meses, por exemplo. Misturar taxa mensal e prazo anual sem conversão gera erro."], ["Juros simples", "Em juros simples, J = C × i × t, com i em forma decimal. Exemplo: R$ 1.000 a 2% ao mês durante 3 meses: J = 1000 × 0,02 × 3 = R$ 60. Montante M = C + J = R$ 1.060."], ["Juros compostos", "Em juros compostos, cada período incorpora juros ao saldo: M = C × (1+i)^t. Exemplo: R$ 1.000 a 10% ao mês por 2 meses: 1000 × 1,1² = R$ 1.210. Os juros são R$ 210, não R$ 200."], ["Comparação", "Com C=1000, i=10% e t=3: simples = 1000 × (1+0,1×3)=1300; compostos =1000×1,1³=1331. A diferença cresce com taxa e tempo; em um período, os resultados coincidem."], ["Desconto percentual", "Desconto de 15% sobre R$ 240: 240 × 0,15 = R$ 36; preço final R$ 204. Forma rápida: 240 × 0,85 = 204. Aumento de 15% usa fator 1,15, e não 0,85."], ["Aumentos e descontos sucessivos", "Um aumento de 20% seguido de desconto de 20% não devolve o preço original. Partindo de 100: 100×1,20×0,80=96. A variação final é queda de 4%. Sempre multiplique fatores sucessivos."], ["Taxa equivalente", "Em juros compostos, taxa de 10% ao mês por dois meses equivale a (1,1²−1)×100%=21% no bimestre. Não some taxas compostas quando a questão pede equivalência efetiva."], ["Exemplo resolvido", "Uma dívida de R$ 800 cresce 5% ao mês por dois meses em regime composto: M=800×1,05²=R$ 882. Juros totais: R$ 82. Se fosse simples, seriam R$ 80."], ["Pratique", "Calcule: (a) juros simples de R$ 500 a 4% por 3 meses; (b) R$ 200 com dois aumentos de 10%. Respostas: (a) R$ 60, montante R$ 560; (b) R$ 242."]]}, {"d": 9, "title": "Excel — funções, referências e erros frequentes", "time": 55, "parts": [["Endereços de célula", "A1 indica coluna A, linha 1. A referência relativa muda quando a fórmula é copiada. Exemplo: em C2, =A2+B2; ao copiar uma linha abaixo, vira =A3+B3. A lógica depende do deslocamento entre origem e destino."], ["Referências mistas", "Em $A2, a coluna A é fixa e a linha varia. Em A$2, a coluna varia e a linha 2 é fixa. Em $A$2, ambas são fixas. Os cifrões prendem o componente que vêm antes: coluna ou linha."], ["Exemplo de cópia", "Na célula C5 está =$A5+B$2+$D$4. Copiar para E8 desloca duas colunas à direita e três linhas abaixo. Resultado: =$A8+D$2+$D$4. O primeiro termo fixa coluna; o segundo fixa linha; o terceiro fixa ambos."], ["SOMA e MÉDIA", "=SOMA(A1:A5) soma os cinco valores do intervalo. =MÉDIA(A1:A5) calcula média aritmética dos valores numéricos considerados. A função MÉDIA não equivale a somar e dividir por cinco quando há células vazias ou textos no intervalo."], ["SE e comparações", "=SE(B2>=60;\"Aprovado\";\"Revisar\") retorna “Aprovado” quando B2 é pelo menos 60, e “Revisar” caso contrário. Em instalações com idioma e configurações diferentes, nomes de funções e separadores podem mudar."], ["CONT.SE e SOMASE", "=CONT.SE(A1:A10;\"Pago\") conta células que atendem ao critério. =SOMASE(A1:A10;\"Pago\";B1:B10) soma valores em B1:B10 correspondentes às linhas cujo status em A é Pago. Entenda intervalo de critério e intervalo de soma."], ["Erros típicos", "#DIV/0! aparece em divisão por zero; #NOME? pode indicar nome de função ou referência não reconhecida; #REF! indica referência inválida; #VALOR! costuma indicar tipo de argumento incompatível. A mensagem exata pode variar conforme software e idioma."], ["Exemplo resolvido", "A1=10, A2=20, B1=5, B2=15. Em C1: =SOMA(A$1:$B2). Copiando para D2, o intervalo torna-se B$1:$C3; como C1 contém fórmula e C2/C3 podem estar vazias, o resultado depende dos valores dessas células e da fórmula presente em C1. Avalie a planilha inteira, não apenas a sintaxe."], ["Exercícios", "(a) Copie =$B3+C$1 de D4 para F6: =$B5+E$1. (b) O que faz =CONT.SE(A1:A20;\">=10\")? Conta quantas células no intervalo atendem ao critério numérico maior ou igual a 10."]]}, {"d": 10, "title": "Lógica proposicional — equivalências e negações", "time": 55, "parts": [["Proposição", "Proposição é uma sentença declarativa à qual se pode atribuir valor lógico verdadeiro ou falso. Perguntas, ordens e frases abertas sem valor determinado geralmente não são proposições na lógica clássica estudada em concursos."], ["Negação", "Se p é “O processo foi distribuído”, ¬p é “O processo não foi distribuído”. Negar não significa criar frase diferente ou contrária sem preservar o conteúdo lógico. Uma proposição e sua negação não podem ser ambas verdadeiras na lógica clássica."], ["Conjunção e disjunção", "p ∧ q (“p e q”) só é verdadeira se ambas forem verdadeiras. p ∨ q (“p ou q”), no sentido inclusivo padrão, é verdadeira quando pelo menos uma é verdadeira. Não confunda ou inclusivo com escolha exclusiva do cotidiano."], ["Condicional", "p → q (“se p, então q”) é falsa apenas quando p é verdadeira e q é falsa. Exemplo: “Se estudo, então reviso”. A condicional não afirma que eu estudei; apenas estabelece relação lógica."], ["Contrapositiva", "p → q é logicamente equivalente a ¬q → ¬p. “Se há sentença, então há pronunciamento judicial” equivale a “Se não há pronunciamento judicial, então não há sentença”, como estrutura lógica. A recíproca q → p não é automaticamente equivalente."], ["Negação da condicional", "A negação de p → q é p ∧ ¬q. Negar “Se estudo, então reviso” é afirmar “Estudo e não reviso”. Não é “Se não estudo, então não reviso”."], ["Leis de De Morgan", "¬(p ∧ q) equivale a ¬p ∨ ¬q; ¬(p ∨ q) equivale a ¬p ∧ ¬q. Em linguagem natural: negar “Ana estuda e Bruno trabalha” resulta em “Ana não estuda ou Bruno não trabalha”."], ["Quantificadores", "Negar “Todos os servidores compareceram” resulta em “Pelo menos um servidor não compareceu”. Negar “Existe um candidato aprovado” resulta em “Nenhum candidato foi aprovado”. Evite trocar “todos” por “nenhum” sem verificar a negação do predicado."], ["Prática guiada", "Negue: (a) “Pedro lê ou Maria escreve”; (b) “Se chover, a prova será adiada”. Respostas: (a) “Pedro não lê e Maria não escreve”; (b) “Chove e a prova não é adiada”."]]}, {"d": 6, "title": "Normas da Corregedoria — técnica de leitura e aplicação", "time": 55, "parts": [["Escopo e cautela", "Este capítulo ensina a estudar normas administrativas judiciais, sem afirmar quais artigos específicos integram o edital 02/2026. Antes de memorizar competências ou prazos, confira o texto consolidado das Normas de Serviço da Corregedoria Geral da Justiça e o Anexo VIII oficial."], ["Estrutura normativa", "Identifique Livro, Título, Capítulo, Seção, artigo, parágrafo, inciso e alínea. A numeração é parte da localização do comando, mas o conteúdo deve ser compreendido em conjunto. Uma exceção em parágrafo pode alterar o alcance do caput."], ["Competência", "Em cada regra, pergunte: quem deve praticar o ato? Qual unidade é responsável? Há delegação? Há necessidade de autorização? Questões de literalidade frequentemente trocam o sujeito competente por outro órgão aparentemente semelhante."], ["Prazos e condições", "Destaque verbos como deverá, poderá, é vedado e será permitido, além de prazos e condições. “Poderá” não é sinônimo de “deverá”; “em regra” não significa “sempre”. Não memorize prazo sem vincular ao ato correspondente."], ["Rotinas cartorárias", "Para compreender rotinas, desenhe um fluxo genérico: recebimento de documento → conferência formal → registro → encaminhamento → controle de prazo → arquivamento ou conclusão, conforme norma aplicável. Esse é um exemplo de método, não uma regra específica do TJ-SP."], ["Sigilo e proteção de dados", "Ao estudar publicidade, acesso e sigilo, diferencie informação pública, dado pessoal e hipóteses legais de restrição. Acesso aos autos e divulgação irrestrita na internet não são conceitos equivalentes."], ["Exemplo hipotético", "Imagine regra fictícia: “O setor X conferirá o documento em até dois dias úteis, salvo urgência justificada”. Uma alternativa dizendo “o setor Y sempre conferirá em dois dias corridos” erra sujeito, exceção e contagem. O exemplo não reproduz norma oficial."], ["Quadro de revisão", "Monte fichas com cinco campos: artigo; responsável; ação obrigatória ou facultativa; prazo; exceção. Ao revisar, oculte as respostas e tente reconstruir a regra. Confira sempre revogações e alterações."], ["Próxima etapa documental", "Para transformar este capítulo em legislação comentada artigo por artigo, será necessário conferir o edital oficial e as normas vigentes. Até lá, este conteúdo é metodologia de estudo, não substituto do texto normativo."]]}, {"d": 7, "title": "Atualidades — instituições, economia e leitura crítica", "time": 55, "parts": [["Atualidades não é decorar manchetes", "A prova pode explorar acontecimentos, instituições, conceitos e consequências. Para cada fato, identifique data, local, atores, decisão efetiva e fonte. Sem recorte temporal confirmado do edital, evite supor quais notícias cairão."], ["Processo legislativo", "Projeto de lei não é lei. Tramitação em comissão, votação, sanção ou veto, promulgação e publicação são etapas distintas, sujeitas às regras constitucionais aplicáveis. Uma manchete “projeto aprovado em comissão” não significa vigência imediata."], ["Inflação e juros", "Inflação é aumento generalizado e persistente do nível de preços, medido por índices com metodologias específicas. Juros influenciam crédito, consumo e investimento. Não confunda redução da inflação com queda absoluta de todos os preços: desaceleração significa que preços podem continuar subindo mais lentamente."], ["PIB e desenvolvimento", "PIB mede valor de bens e serviços finais produzidos em determinado período e território, conforme metodologia estatística. Crescimento do PIB não implica automaticamente distribuição igual de renda, melhoria ambiental ou aumento do poder de compra de todos."], ["Poderes e federação", "No Brasil, União, estados, Distrito Federal e municípios possuem competências próprias. Executivo, Legislativo e Judiciário exercem funções constitucionais distintas, com mecanismos de controle recíproco. Notícias podem confundir decisão judicial com edição de lei."], ["Tecnologia e segurança", "Ao ler notícias sobre inteligência artificial e proteção de dados, diferencie proposta regulatória, norma vigente e decisão judicial. Identifique quem divulgou dados, qual foi a base factual e se houve confirmação independente."], ["Meio ambiente e clima", "Diferencie evento meteorológico específico, variabilidade climática e tendências de longo prazo. Uma onda de calor isolada não basta para demonstrar sozinha mudança climática; estudos consideram séries históricas e múltiplas evidências."], ["Exemplo resolvido", "“Inflação anual caiu de 6% para 4%”. Conclusão correta: o ritmo de aumento de preços, medido pelo índice citado, diminuiu. Conclusão incorreta: os preços ficaram 2% mais baratos. O índice ainda é positivo."], ["Método semanal", "Escolha fontes primárias e veículos confiáveis, registre fato, data, instituição, números e contexto. Releia uma semana depois e explique o acontecimento sem consultar. O capítulo não pretende substituir um levantamento de notícias atualizadas."]]}]);
