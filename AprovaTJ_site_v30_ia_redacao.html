</script><script>
// Ampliação didática do curso de redação: módulos 9 a 20.
essayCourse.push(...[{"title":"09 · Repertório sociocultural","subtitle":"Como usar dados, leis e exemplos sem inventar","parts":[["O que é repertório produtivo","Repertório é uma informação externa ao tema usada para esclarecer o argumento: um conceito, uma norma, um acontecimento histórico ou uma situação social verificável. Ele só ajuda quando você explica a relação com a tese. Citar um autor famoso sem explicar sua ideia não fortalece o texto."],["Exemplo desenvolvido","Tema: atendimento público digital. Afirmação: a digitalização pode agilizar serviços. Repertório: o princípio da eficiência orienta a Administração Pública, conforme o art. 37 da Constituição. Análise: eficiência não é apenas rapidez do sistema; é necessário que o serviço seja efetivamente acessível ao cidadão. Assim, canais alternativos podem evitar que a modernização exclua usuários."],["Citação e paráfrase","Prefira paráfrases fiéis de ideias que você compreende. Não coloque frases entre aspas quando não souber a redação exata. Não invente percentuais, pesquisas ou decisões judiciais. Se não tiver um dado confiável, use um exemplo hipotético explicitamente apresentado como hipótese."],["Treino guiado","Escolha um tema e escreva: 1) sua tese; 2) um fato ou conceito que conhece com segurança; 3) duas frases explicando por que esse repertório sustenta a tese."]]},{"title":"10 · Como evitar fuga ao tema","subtitle":"Assunto, recorte e abordagem","parts":[["Diferença entre assunto e recorte","Assunto é o campo geral; recorte é o ângulo específico pedido. Em “Os desafios da inclusão digital no acesso aos serviços públicos”, falar genericamente sobre redes sociais é insuficiente. O texto precisa relacionar inclusão digital ao acesso a serviços do Estado."],["Teste do título invisível","Antes de escrever, imagine que o avaliador ocultou o enunciado. Lendo sua tese e seus parágrafos, ele conseguiria identificar o tema específico? Se não, provavelmente você está escrevendo sobre um assunto amplo demais."],["Exemplo comparado","Fora do foco: “A tecnologia mudou o modo de conversar”. Dentro do foco: “A exigência de aplicativos para agendamento pode dificultar o acesso de pessoas com baixa familiaridade digital a serviços públicos essenciais”. A segunda frase responde ao recorte."],["Exercício","Reescreva uma tese genérica acrescentando quem é afetado, qual é a dificuldade e em que contexto ela ocorre. Depois confira se cada parágrafo volta a esses elementos."]]},{"title":"11 · Parágrafos com profundidade","subtitle":"Do argumento superficial à análise","parts":[["A cadeia argumentativa","Um argumento consistente percorre quatro passos: afirmação, causa ou mecanismo, consequência e ligação com a tese. Sem o mecanismo, a redação vira uma coleção de opiniões."],["Antes e depois","Superficial: “A falta de internet é ruim e prejudica muita gente”. Desenvolvido: “Quando o agendamento de um serviço público depende exclusivamente de plataforma digital, pessoas sem conexão estável podem deixar de solicitar atendimento. O problema não está apenas na existência da tecnologia, mas na ausência de alternativas acessíveis. Isso mostra que a eficiência administrativa precisa considerar diferentes condições de acesso”."],["A pergunta por quê","Após cada afirmação, pergunte “por quê?” e “como isso acontece?”. Após o exemplo, pergunte “o que ele demonstra?”. Responda sem repetir a mesma ideia com outras palavras."],["Prática","Escreva um parágrafo de cinco frases: tese local, causa, mecanismo, exemplo hipotético e consequência. Corte qualquer frase que não acrescente informação."]]},{"title":"12 · Contra-argumentação","subtitle":"Como reconhecer objeções sem enfraquecer a tese","parts":[["O que é contra-argumentar","Contra-argumentar é considerar uma objeção plausível e responder a ela. Isso demonstra capacidade de ponderação, mas não é obrigatório em toda redação. Use apenas quando ajudar a desenvolver o tema."],["Modelo comentado","“É verdade que a digitalização reduz filas e custos operacionais. Contudo, a substituição integral do atendimento presencial pode dificultar o acesso de cidadãos que não dispõem de conexão ou orientação. Por isso, a eficiência do sistema deve ser avaliada também pela capacidade de atender públicos diferentes.” O primeiro período reconhece a vantagem; o segundo delimita o problema; o terceiro reafirma a tese."],["Armadilhas","Não invente um argumento contrário absurdo para refutá-lo facilmente. Não contradiga a própria tese. A objeção deve ser relevante e a resposta precisa trazer uma razão, não apenas a expressão “porém, isso está errado”."],["Exercício","Formule uma objeção realista à sua tese. Em seguida, responda em três frases: concessão, limite da objeção e retomada do argumento central."]]},{"title":"13 · Conectivos por função","subtitle":"Adição, contraste, causa e conclusão","parts":[["Não decore listas sem entender","Conectivos expressam relações lógicas. Adição: além disso, também. Contraste: porém, entretanto. Causa: porque, uma vez que. Consequência: por isso, de modo que. Conclusão: portanto, assim. Exemplificação: por exemplo."],["Exemplos corretos","“O sistema é rápido; entretanto, parte dos usuários encontra barreiras de acesso.” Há contraste. “Muitos usuários não têm conexão estável; por isso, o atendimento exclusivamente digital pode excluí-los.” Há consequência. Trocar os conectivos altera a relação e pode tornar a frase incoerente."],["Coesão além dos conectivos","Use substituições e retomadas: “a plataforma”, “esse serviço”, “a ferramenta”. Evite repetir “a tecnologia” cinco vezes no mesmo parágrafo, mas também não substitua por termos imprecisos que confundam o leitor."],["Exercício com gabarito","Complete: “O atendimento remoto facilita solicitações; ___, exige acesso à internet.” Resposta: “entretanto” ou “porém”, porque há contraste. “O acesso é instável; ___, o cidadão pode perder o agendamento.” Resposta: “por isso”, pois há consequência."]]},{"title":"14 · Pontuação na redação","subtitle":"Vírgula, ponto e períodos legíveis","parts":[["Sujeito e verbo","Em regra, não se separa sujeito do verbo com vírgula: inadequado “A ausência de alternativas, prejudica os usuários”; adequado “A ausência de alternativas prejudica os usuários”. O mesmo cuidado vale para o verbo e seu complemento direto."],["Expressões deslocadas","Uma expressão adverbial deslocada pode ser isolada por vírgula: “Em determinadas regiões, o sinal de internet é instável”. Orações explicativas também são isoladas: “Os usuários, que já enfrentavam dificuldades, passaram a depender do aplicativo” — a pontuação muda o sentido em comparação à oração restritiva."],["Ponto final como ferramenta","Se uma frase acumula cinco ideias, separe-a. Exemplo: “O serviço foi digitalizado, mas muitos usuários não tinham acesso, e isso gerou dificuldades, porque...” pode virar dois períodos: “O serviço foi digitalizado. Entretanto, a ausência de acesso à internet dificultou sua utilização por parte dos usuários”."],["Exercício comentado","Revise: “A falta de orientação, impede que muitos cidadãos utilizem o sistema.” Correção: retirar a vírgula entre sujeito e verbo. Revise: “No entanto o serviço ainda apresenta barreiras.” Correção recomendada: “No entanto, o serviço ainda apresenta barreiras.”"]]},{"title":"15 · Concordância e regência","subtitle":"Erros frequentes em textos formais","parts":[["Concordância verbal","O verbo concorda com o núcleo do sujeito: “A oferta de canais alternativos facilita o atendimento” (núcleo: oferta). “Os serviços digitais facilitam o acesso” (núcleo: serviços). Cuidado com palavras no plural próximas ao verbo que não são o núcleo do sujeito."],["Haver e fazer impessoais","Com sentido de existir, “haver” é impessoal: “Há muitas dificuldades”, não “Haviam muitas dificuldades”. Em indicação de tempo decorrido, “fazer” também fica no singular: “Faz dois anos”."],["Regência e crase","Quem se refere, refere-se a algo. Quem tem acesso, tem acesso a algo. Na combinação de preposição “a” com artigo feminino “a”, ocorre crase: “acesso à informação”. Mas: “acesso a informações” não exige crase, porque não há artigo feminino singular."],["Treino comentado","Corrija: “Houveram mudanças importantes”. Resposta: “Houve mudanças importantes”. Corrija: “O acesso a educação é fundamental”. Em contexto com artigo definido: “O acesso à educação é fundamental”."]]},{"title":"16 · Reescrita e clareza","subtitle":"Como revisar frases sem mudar o sentido","parts":[["Corte abstrações","Troque expressões vagas por relações concretas. “A questão da tecnologia na sociedade é muito importante” pode se tornar “A digitalização do atendimento público exige medidas de acessibilidade para usuários com diferentes níveis de familiaridade tecnológica”."],["Voz ativa e passiva","“O órgão disponibilizou atendimento presencial” e “O atendimento presencial foi disponibilizado pelo órgão” expressam, em essência, o mesmo evento, mas enfatizam elementos diferentes. A voz ativa costuma ser mais direta; a passiva pode ser útil quando o foco é o serviço."],["Evite afirmações absolutas","Palavras como “todos”, “nunca”, “sempre” e “ninguém” tornam a tese vulnerável a exceções. Prefira “parte da população”, “em muitos casos”, “pode contribuir”, quando essa é a extensão real da sua afirmação."],["Oficina de reescrita","Original: “Todo mundo sabe que a internet resolve tudo”. Reescrita: “Ferramentas digitais podem facilitar procedimentos administrativos, mas seus benefícios dependem de condições adequadas de acesso”. Identifique as mudanças: formalidade, precisão e ponderação."]]},{"title":"17 · Exemplos de introdução","subtitle":"Três estratégias de abertura","parts":[["Introdução direta","“A ampliação dos serviços digitais transformou a relação entre cidadãos e órgãos públicos. Apesar dos ganhos de agilidade, a desigualdade de acesso à internet ainda limita o uso dessas ferramentas. Portanto, modernizar o atendimento exige conciliar eficiência e inclusão.” É objetiva e apresenta tese clara."],["Introdução por contraste","“Embora plataformas eletrônicas simplifiquem procedimentos, elas não eliminam todas as barreiras de atendimento. Para usuários com baixa conectividade ou dificuldade de navegação, a digitalização pode representar um novo obstáculo. Assim, é necessário discutir os limites do atendimento exclusivamente virtual.” O contraste organiza o problema."],["Introdução com princípio jurídico","“A Administração Pública deve observar, entre outros, o princípio da eficiência. No atendimento digital, porém, eficiência não se resume à rapidez de processamento: é preciso considerar se os serviços alcançam a população. Desse modo, a inclusão dos usuários deve integrar a modernização administrativa.” O conceito legal serve ao argumento; não é enfeite."],["Treino","Escreva duas introduções para o mesmo tema, uma direta e outra por contraste. Compare qual delas apresenta a tese com mais clareza e menos frases genéricas."]]},{"title":"18 · Exemplos de desenvolvimento","subtitle":"Dois parágrafos comentados","parts":[["Desenvolvimento 1: barreira material","“A falta de conexão estável pode impedir o uso de serviços públicos digitais. Quando agendamentos e solicitações dependem de acesso contínuo à rede, falhas de infraestrutura e ausência de equipamentos tornam o procedimento menos acessível. Por consequência, parte da população pode enfrentar atrasos em demandas essenciais.” O parágrafo apresenta causa, mecanismo e consequência."],["Desenvolvimento 2: barreira de uso","“Além da infraestrutura, a dificuldade de navegação constitui outra barreira. Formulários complexos, linguagem pouco clara e ausência de orientação podem desestimular usuários com menor familiaridade tecnológica. Nesse cenário, simplificar interfaces e oferecer suporte humano são medidas capazes de aproximar a modernização das necessidades reais do público.” Há progressão: o segundo parágrafo acrescenta uma dimensão distinta."],["Coerência entre os parágrafos","O primeiro desenvolvimento aborda acesso material; o segundo, usabilidade. Não repita a mesma causa em ambos. A conclusão deve integrar as duas linhas argumentativas, sem abrir um terceiro problema."],["Treino","Crie dois parágrafos sobre outro tema: o primeiro sobre uma causa estrutural, o segundo sobre uma consequência ou dificuldade distinta. Marque a ideia central de cada um."]]},{"title":"19 · Conclusões comentadas","subtitle":"Fechar sem copiar a introdução","parts":[["Síntese com encaminhamento","“Portanto, a digitalização dos serviços públicos deve ser acompanhada de medidas que ampliem o acesso. A manutenção de canais alternativos e a oferta de orientação aos usuários podem reduzir barreiras sem comprometer os ganhos de eficiência.” Retoma as duas linhas argumentativas e apresenta uma saída coerente."],["Síntese sem proposta detalhada","“Em síntese, os benefícios do atendimento digital dependem de condições que permitam seu uso por diferentes públicos. Sem conectividade e interfaces compreensíveis, a modernização corre o risco de reproduzir desigualdades no acesso aos serviços.” É uma conclusão válida como fechamento argumentativo, dependendo da proposta e dos critérios de avaliação."],["Evite a frase pronta","“Conclui-se que o governo e a sociedade devem se unir para resolver esse problema” é genérico. Quem deve agir, em relação a qual barreira e por quê? Mesmo quando não se exige intervenção formal, o fechamento deve ser específico."],["Exercício","Compare as duas conclusões. Identifique qual retoma a tese, qual menciona as causas e se introduzem fatos novos. Depois escreva a sua própria versão."]]},{"title":"20 · Simulado de planejamento","subtitle":"Da proposta ao esqueleto da redação","parts":[["Tema de treino","“Os desafios de garantir atendimento humanizado em serviços públicos cada vez mais digitais.” É um tema autoral de prática, não uma previsão de prova."],["Passo 1: delimite","Assunto: digitalização do atendimento. Recorte: atendimento humanizado. Problema: como conciliar rapidez das plataformas com necessidades de orientação, acolhimento e acessibilidade. Evite transformar o texto em discussão geral sobre redes sociais."],["Passo 2: tese e argumentos","Tese-modelo: “A modernização digital pode ampliar a eficiência, mas precisa preservar canais de orientação e considerar diferentes condições de acesso”. Argumento 1: barreiras de usabilidade. Argumento 2: necessidade de suporte e atendimento alternativo."],["Passo 3: escreva e confira","Escreva introdução, dois desenvolvimentos e conclusão. Confira se cada desenvolvimento explica uma causa diferente. Revise concordância, pontuação, termos genéricos e repetições. Cole o texto na oficina e use a correção offline como checklist, não como nota oficial."]]}]);

</script>
<script>
// v2.7: aprofundamento autoral nas 11 disciplinas, sem modificar os dados de progresso.
digitalModules.push(...[{"d":0,"title":"Português — colocação pronominal: próclise, ênclise e mesóclise","time":50,"parts":[["Conceitos essenciais","Pronomes oblíquos átonos, como me, te, se, o, a, lhe, nos e lhes, podem aparecer antes, depois ou no interior do verbo. Antes: não se esqueça. Depois: esqueça-se. No interior do futuro: entregar-lhe-ei. A posição depende do contexto sintático e do registro formal."],["Próclise: elementos atrativos","Palavras negativas, pronomes relativos, certos pronomes indefinidos, conjunções subordinativas e advérbios sem pausa costumam atrair o pronome. Exemplos: Não me disseram a verdade; o documento que se perdeu foi encontrado; quando lhe entregarem os autos, confira-os. Não basta decorar a lista: observe a oração completa."],["Ênclise na norma-padrão","Sem elemento atrativo, a ênclise é comum no início de orações formais: Encaminhou-se o pedido. No imperativo afirmativo: Apresente-se ao setor. Atenção: na fala brasileira, começar frase com me é frequente, mas provas de norma-padrão podem preferir outra construção."],["Mesóclise e futuro","Com futuro do presente ou futuro do pretérito, sem fator de próclise, a gramática normativa admite mesóclise: enviar-lhe-ei a resposta; comunicar-se-ia a decisão. Se houver elemento atrativo, ocorre próclise: Não lhe enviarei a resposta. Não use mesóclise com pretérito: entregou-lhe é ênclise."],["Locuções verbais e armadilhas","Em locuções, a posição varia conforme auxiliar, verbo principal e presença de elemento atrativo: pode-se consultar; não se pode consultar. Evite aplicar mecanicamente uma única regra a todos os casos; a norma culta brasileira admite variantes em diversos contextos."],["Exemplo resolvido e revisão","Complete: “Os servidores que ___ apresentaram deverão aguardar.” A forma “se apresentaram” é adequada porque que é pronome relativo e favorece próclise. Compare: “Apresentaram-se os servidores.” Revise: identifique o verbo, o pronome e eventual palavra atrativa antes de decidir."]]},{"d":1,"title":"Direito Penal — crimes praticados por particular contra a Administração","time":50,"parts":[["Visão geral","O Código Penal diferencia crimes funcionais, cometidos por funcionário público em razão da função, e crimes que um particular pode cometer contra a Administração. O agente, a conduta e o verbo do tipo penal são decisivos. Estude sempre o texto atualizado dos artigos correspondentes."],["Resistência: art. 329","O núcleo é opor-se à execução de ato legal mediante violência ou ameaça a funcionário competente para executá-lo ou a quem lhe preste auxílio. A mera discordância verbal sem violência ou ameaça não configura automaticamente resistência. Exemplo: ameaçar fisicamente o oficial para impedir cumprimento de ordem legal."],["Desobediência: art. 330","Consiste em desobedecer a ordem legal de funcionário público. A ordem deve ser legal, concreta e dirigida ao destinatário. Questões podem confundir desobediência com resistência: resistência exige violência ou ameaça nos termos do tipo; desobediência não."],["Desacato: art. 331","O tipo trata de desacatar funcionário público no exercício da função ou em razão dela. Não se confunde crítica legítima à atuação estatal com qualquer hipótese de desacato. O contexto e os elementos do tipo importam; evite afirmar que toda reclamação é crime."],["Corrupção ativa: art. 333","Oferecer ou prometer vantagem indevida a funcionário público para determiná-lo a praticar, omitir ou retardar ato de ofício. Compare com corrupção passiva, em que o funcionário solicita, recebe ou aceita promessa de vantagem indevida, conforme o art. 317. A banca costuma trocar os verbos."],["Quadro comparativo comentado","Se o particular oferece dinheiro ao servidor para alterar um ato, pense em corrupção ativa. Se o servidor solicita a vantagem, examine corrupção passiva. Se alguém impede ato legal por violência ou ameaça, examine resistência. Se descumpre ordem legal, examine desobediência. A classificação final depende de todos os fatos e requisitos legais."]]},{"d":2,"title":"Processo Penal — competência, provas e reconhecimento","time":50,"parts":[["Competência e juiz natural","A competência define qual órgão jurisdicional processará e julgará o caso. A Constituição protege o juiz natural; o CPP contém regras de competência, inclusive em razão do lugar, da matéria e da pessoa. Não confunda atribuição policial com competência jurisdicional."],["Prova e contraditório","A prova serve para formar o convencimento judicial dentro dos limites constitucionais e legais. Elementos informativos colhidos na investigação não se confundem integralmente com provas produzidas sob contraditório judicial. O art. 155 do CPP traz regra importante sobre fundamentação da decisão."],["Provas ilícitas","O art. 5º, LVI, da Constituição considera inadmissíveis no processo provas obtidas por meios ilícitos. O CPP disciplina a inadmissibilidade e o desentranhamento, bem como questões relativas a provas derivadas. Em prova, atenção à distinção entre ilicitude e mera irregularidade."],["Reconhecimento de pessoas","O art. 226 do CPP prevê procedimento para reconhecimento de pessoa, incluindo descrição prévia e, quando possível, colocação ao lado de outras pessoas semelhantes. A jurisprudência sobre reconhecimento evoluiu: o procedimento legal e as garantias contra identificações equivocadas merecem atenção especial."],["Cadeia de custódia","A cadeia de custódia documenta a história cronológica do vestígio, do reconhecimento ao descarte, conforme os arts. 158-A e seguintes do CPP. Ela busca preservar rastreabilidade e confiabilidade. Exemplo: identificar quem coletou, acondicionou, transportou e analisou material."],["Questão guiada","Uma testemunha identifica alguém apenas por fotografia, sem cautelas e sem outros elementos de corroboração. É seguro concluir que o reconhecimento basta, por si só, para condenar? Não. É necessário avaliar as exigências legais, a confiabilidade e o conjunto probatório, conforme a jurisprudência aplicável."]]},{"d":3,"title":"Processo Civil — petição inicial, indeferimento e emenda","time":50,"parts":[["Função da petição inicial","A petição inicial provoca a atividade jurisdicional e apresenta partes, fatos, fundamentos, pedido e demais elementos exigidos pelo CPC. É a peça de ingresso da demanda e delimita o que se pretende obter em juízo."],["Requisitos do art. 319","O CPC prevê indicação do juízo, qualificação das partes, fatos e fundamentos jurídicos, pedido e especificações, valor da causa, provas pretendidas e opção sobre audiência de conciliação ou mediação. Há regras para dificuldade de obter dados da parte ré; não conclua que toda ausência leva imediatamente ao indeferimento."],["Documentos indispensáveis","O art. 320 exige que a inicial seja instruída com documentos indispensáveis à propositura da ação. Nem todo documento útil é indispensável: a distinção depende do tipo de demanda e do requisito legal."],["Emenda: art. 321","Se a inicial não preencher requisitos legais ou apresentar defeitos capazes de dificultar o julgamento de mérito, o juiz determinará emenda ou complementação, indicando com precisão o que deve ser corrigido, no prazo legal de 15 dias. A falta de cumprimento pode levar ao indeferimento."],["Indeferimento: art. 330","O indeferimento pode ocorrer, entre outras hipóteses legais, por inépcia da inicial. Pedido indeterminado fora das hipóteses admitidas e ausência de causa de pedir são exemplos de situações a examinar. É importante distinguir indeferimento da inicial e improcedência do pedido."],["Caso comentado","Uma inicial omite documento indispensável, mas o defeito é sanável. Em regra, deve-se observar a oportunidade de emenda prevista no CPC antes de indeferir por esse fundamento. A pergunta-chave é: o vício é sanável e o juiz indicou o que corrigir?"]]},{"d":4,"title":"Constitucional — nacionalidade, direitos políticos e servidores","time":50,"parts":[["Nacionalidade: art. 12","A Constituição disciplina brasileiros natos e naturalizados, com hipóteses e requisitos próprios. Não confunda local de nascimento com a única forma de aquisição da nacionalidade: a Constituição também contempla situações relacionadas à filiação e ao registro ou residência."],["Cargos privativos de brasileiro nato","O § 3º do art. 12 lista cargos privativos de brasileiro nato, como Presidente e Vice-Presidente da República, Presidente da Câmara, Presidente do Senado, ministro do STF, carreira diplomática, oficial das Forças Armadas e Ministro de Estado da Defesa. A banca costuma incluir cargo que não está na lista."],["Direitos políticos: art. 14","A soberania popular é exercida por sufrágio universal e voto direto e secreto, com valor igual para todos, e por instrumentos previstos na Constituição. O alistamento e o voto têm regras de obrigatoriedade e facultatividade que devem ser lidas diretamente no art. 14."],["Condições de elegibilidade","Entre as condições constitucionais estão nacionalidade brasileira, pleno exercício dos direitos políticos, alistamento eleitoral, domicílio eleitoral na circunscrição, filiação partidária e idade mínima correspondente ao cargo. As idades variam conforme o cargo."],["Acumulação de cargos: art. 37","A Constituição estabelece regra de vedação à acumulação remunerada de cargos públicos, com exceções condicionadas, entre outros requisitos, à compatibilidade de horários. Não confunda a existência de uma exceção com autorização automática: é necessário cumprir os requisitos constitucionais."],["Fixação","Uma questão afirma que todo cargo do Judiciário é privativo de brasileiro nato. Está incorreta: a Constituição prevê lista específica, que inclui ministro do STF, mas não torna todos os cargos judiciais privativos de natos. Sempre compare a alternativa com o texto constitucional."]]},{"d":5,"title":"Administrativo — agentes públicos, deveres e responsabilização","time":50,"parts":[["Agentes públicos: panorama","Agente público é expressão ampla que abrange diferentes pessoas que exercem funções estatais, conforme o contexto normativo. Servidores estatutários, empregados públicos e agentes políticos não têm regimes necessariamente idênticos. A banca explora generalizações indevidas."],["Cargo, emprego e função","Cargo público costuma estar associado a regime estatutário; emprego público, em regra, a vínculo contratual trabalhista; função pública designa atribuições exercidas. Não trate os três termos como sinônimos. O regime jurídico concreto depende da Constituição e das normas aplicáveis."],["Dever de legalidade e finalidade","A atuação administrativa deve respeitar competência, finalidade pública e demais parâmetros legais. Um agente não pode usar prerrogativas para perseguir interesse pessoal. A conduta pode gerar consequências administrativas, civis e, conforme o caso, penais."],["Responsabilidades em esferas distintas","Uma mesma conduta pode ser examinada em esferas administrativa, civil e penal, observadas regras de independência e repercussão entre instâncias. Não presuma que absolvição criminal sempre elimina qualquer responsabilidade administrativa: é necessário analisar seu fundamento e o regime aplicável."],["Processo administrativo e defesa","A Constituição assegura contraditório e ampla defesa em processos administrativos quando cabíveis. A apuração disciplinar exige observância das normas de competência, procedimento e garantias. Atenção à diferença entre apuração preliminar e decisão sancionatória."],["Exemplo resolvido","Um servidor usa informação funcional para favorecer um conhecido. Mesmo sem recebimento de dinheiro, a conduta pode afrontar deveres funcionais e princípios administrativos. A ausência de vantagem financeira não torna automaticamente o ato regular."]]},{"d":6,"title":"Normas do TJ-SP — como estudar atos, prazos e rotinas cartorárias","time":50,"parts":[["Fonte oficial obrigatória","Para Normas da Corregedoria e legislação interna, a redação oficial consolidada e as alterações publicadas pelo TJ-SP são a referência. Este capítulo ensina o método de leitura; não substitui os artigos específicos do edital. Registre o número do ato, a versão e a data de atualização."],["Identifique o sujeito da regra","Em cada dispositivo, sublinhe quem deve agir: juiz, escrivão, chefe de seção, servidor ou parte. A troca de sujeito é uma pegadinha frequente. Uma obrigação atribuída a uma unidade não pode ser transferida para outra por mera suposição."],["Separe dever, faculdade e proibição","Verbos como deverá, poderá e é vedado têm efeitos diferentes. Deverá indica obrigação; poderá, faculdade sujeita aos requisitos legais; é vedado, proibição. Compare também imediatamente, previamente e após, que podem mudar a ordem dos atos."],["Prazos e eventos que os iniciam","Ao estudar um prazo, identifique o evento inicial, a unidade de contagem, quem é responsável e se há regra especial. Evite aplicar automaticamente a contagem do CPC a qualquer rotina administrativa; a norma específica pode estabelecer disciplina própria."],["Fluxo cartorário em etapas","Transforme a regra em um fluxo: recebimento → conferência → registro → encaminhamento → cumprimento → certificação. Esse esquema é apenas didático: a sequência real deve ser extraída do dispositivo aplicável."],["Exercício de interpretação","Imagine uma norma fictícia: “O servidor deverá certificar o cumprimento antes de remeter os autos.” Qual a ordem correta? Primeiro certificar, depois remeter. A conclusão vem dos termos deverá e antes. Para estudar o TJ-SP, substitua esse exemplo por dispositivos oficiais efetivamente cobrados."]]},{"d":7,"title":"Atualidades e PCD — barreiras, adaptações e inclusão","time":50,"parts":[["Conceito de pessoa com deficiência","A Lei 13.146/2015 considera pessoa com deficiência aquela que tem impedimento de longo prazo de natureza física, mental, intelectual ou sensorial que, em interação com barreiras, pode obstruir participação plena e efetiva na sociedade em igualdade de condições. O foco não é apenas a condição individual, mas também o ambiente."],["Tipos de barreiras","A LBI trata de barreiras urbanísticas, arquitetônicas, nos transportes, nas comunicações e informação, atitudinais e tecnológicas. Exemplo: escada sem alternativa acessível é barreira arquitetônica; recusar atendimento por preconceito envolve barreira atitudinal."],["Acessibilidade e desenho universal","Acessibilidade busca permitir uso seguro e autônomo de espaços, serviços e informações. Desenho universal orienta produtos e ambientes utilizáveis por todas as pessoas, tanto quanto possível, sem necessidade de adaptação posterior. Tecnologia assistiva pode complementar a inclusão."],["Adaptação razoável","Adaptações razoáveis são ajustes necessários e adequados que não imponham ônus desproporcional ou indevido, conforme o caso, para assegurar direitos em igualdade de condições. Não confunda adaptação razoável com privilégio: ela busca remover obstáculos à participação."],["Atendimento no serviço público","Comunicação clara, canais acessíveis, respeito à autonomia e ausência de tratamento discriminatório são centrais. Não presuma incapacidade de decisão de uma pessoa apenas pela existência de deficiência. O atendimento deve considerar necessidades concretas."],["Questão comentada","Um prédio tem elevador, mas o sistema de senhas só emite avisos sonoros, sem alternativa visual. A existência de elevador resolve todas as barreiras? Não. Acessibilidade envolve também comunicação e informação; é preciso avaliar diferentes formas de acesso."]]},{"d":8,"title":"Matemática — conjuntos, intervalos e problemas de contagem","time":50,"parts":[["Linguagem dos conjuntos","Conjunto é uma coleção definida de elementos. Escrevemos x ∈ A quando x pertence a A e A ⊂ B quando A é subconjunto de B. União A ∪ B reúne elementos de ambos; interseção A ∩ B reúne os comuns."],["União sem dupla contagem","Para conjuntos finitos, n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Exemplo: 24 pessoas estudam Português, 18 estudam Direito e 10 estudam ambos. Pelo menos uma das duas matérias: 24 + 18 − 10 = 32."],["Nenhum dos grupos","Se há 40 alunos no total e 32 estudam ao menos uma das duas matérias, 40 − 32 = 8 não estudam nenhuma. A armadilha é somar 24 e 18 e esquecer a interseção."],["Três conjuntos: ideia geral","Para três conjuntos, some os três totais, subtraia interseções dois a dois e acrescente a interseção tripla. O raciocínio corrige contagens duplicadas. Faça um diagrama antes de usar a fórmula quando os dados forem apresentados em texto."],["Intervalos reais","Intervalo [2,5] inclui 2 e 5; (2,5) exclui ambos; [2,5) inclui apenas 2. Atenção à notação matemática e às desigualdades: 2 ≤ x < 5 corresponde a [2,5)."],["Exercício resolvido","Em 60 candidatos, 35 estudam Informática, 28 Matemática e 15 ambas. Estudam pelo menos uma: 35 + 28 − 15 = 48. Não estudam nenhuma: 60 − 48 = 12. Confira se a interseção não supera nenhum dos totais."]]},{"d":9,"title":"Informática — Word: estilos, sumário e revisão de documentos","time":50,"parts":[["Formatação direta e estilos","Formatação direta altera um trecho específico, como negrito e tamanho. Estilos são conjuntos nomeados de formatação, como Título 1 e Título 2, que permitem padronização e manutenção do documento. Em textos longos, estilos são mais eficientes."],["Sumário automático","Para criar sumário automático confiável, aplique estilos de títulos aos capítulos e subtítulos. O Word utiliza esses níveis para montar a estrutura. Se o título mudar ou as páginas se deslocarem, atualize o sumário; editar o texto do sumário manualmente pode quebrar a consistência."],["Quebra de página e seção","Quebra de página leva o conteúdo seguinte à próxima página. Quebra de seção permite alterar características de parte do documento, como orientação, margens ou cabeçalhos. Não são equivalentes: uma seção nova pode começar na mesma página ou em outra, conforme a opção."],["Controlar Alterações","O recurso Controlar Alterações registra edições para revisão. Comentários permitem discutir trechos sem necessariamente mudar o texto. Aceitar ou rejeitar alterações consolida o documento; simplesmente ocultar marcações não é o mesmo que removê-las."],["Localizar e substituir","Localizar encontra termos; Substituir permite trocar ocorrências, com opções para cada caso ou para todas. Substituir tudo exige cuidado com palavras inseridas dentro de outras e com diferenças de maiúsculas, acentos e padrões."],["Caso de prova","Um relatório de 80 páginas precisa de sumário atualizável. Qual a melhor prática? Aplicar estilos de título e inserir sumário automático. Usar apenas negrito manual nos títulos não garante estrutura reconhecida pelo recurso."]]},{"d":10,"title":"Raciocínio Lógico — argumentos, validade e contraexemplos","time":50,"parts":[["Premissas e conclusão","Argumento é um conjunto de premissas do qual se pretende extrair uma conclusão. Validade não significa que as premissas sejam verdadeiras no mundo real; significa que não há situação em que todas as premissas sejam verdadeiras e a conclusão falsa."],["Modus ponens","Forma válida: Se P, então Q; P; logo Q. Exemplo: se o processo foi arquivado, houve decisão de arquivamento; o processo foi arquivado; logo houve decisão de arquivamento. A validade é formal e depende de manter o mesmo sentido das proposições."],["Modus tollens","Forma válida: Se P, então Q; não Q; logo não P. Exemplo: se o documento é digitalizado corretamente, há arquivo legível; não há arquivo legível; logo não foi digitalizado corretamente. Atenção: a conclusão depende de a condicional original ser aceita."],["Afirmação do consequente: inválida","Se P, então Q; Q; logo P é falácia. Exemplo: se chove, a rua molha; a rua está molhada; logo choveu. A rua pode ter sido lavada. Encontrar um contraexemplo basta para demonstrar invalidade."],["Negação do antecedente: inválida","Se P, então Q; não P; logo não Q também é falácia. Exemplo: se estudo, aprendo; não estudei; logo não aprendi. Pode-se aprender por outros meios."],["Treino resolvido","Premissas: “Se Ana revisa, melhora o desempenho” e “Ana não melhorou o desempenho”. Conclusão: “Ana não revisou”. É um modus tollens, formalmente válido. Já concluir que Ana revisou apenas porque melhorou seria afirmar o consequente, inferência inválida."]]}]);
document.title="AprovaTJ 2.7 — Apostila por matérias";
</script>

<script>
// AprovaTJ 2.8 — conteúdo autoral complementar por matéria
digitalModules.push(...[{"d":0,"title":"Português — reescrita de frases e preservação de sentido","time":55,"parts":[["Sentido antes da gramática","Questões de reescrita exigem duas verificações independentes: a nova frase precisa estar gramaticalmente correta e preservar a relação lógica da original. Uma frase pode estar perfeitamente escrita e, ainda assim, mudar o sentido. Compare: “Embora estivesse doente, trabalhou” (concessão) e “Porque estava doente, trabalhou” (causa)."],["Voz ativa e passiva","“O servidor conferiu os autos” passa a “Os autos foram conferidos pelo servidor”. O objeto direto torna-se sujeito paciente; o sujeito original pode virar agente da passiva. Preserve tempo e modo verbal: “conferirá” corresponde a “serão conferidos”, não a “foram conferidos”. Nem todo verbo admite passiva analítica."],["Negação e quantificadores","“Todos os candidatos compareceram” tem como negação “Pelo menos um candidato não compareceu”, e não “Nenhum compareceu”. “Nenhum documento foi perdido” nega-se por “Pelo menos um documento foi perdido”. Observe a força de palavras como todo, algum, nenhum, sempre e nunca."],["Pronomes e referência","Em “Marina avisou Paula de que seu documento estava pronto”, “seu” pode ser ambíguo. Reescrever como “o documento de Paula” elimina a ambiguidade, mas só preserva o sentido se o contexto indicar essa referência. Cuidado com substituições por “o qual”, “cujo” e “onde”: cada forma tem requisitos."],["Conectivos equivalentes","“Apesar de ter estudado, errou” pode ser reescrito como “Embora tenha estudado, errou”. Já “Portanto” exprime conclusão e não substitui “entretanto”. Não decore listas de sinônimos sem verificar o contexto e a estrutura sintática."],["Questão resolvida","Original: “Se o recurso for tempestivo, será analisado”. Reescrita proposta: “O recurso será analisado somente se for tempestivo”. Há equivalência? Não necessariamente. “Se P, Q” afirma que P é suficiente para Q; “Q somente se P” torna P necessário para Q. A troca altera a relação lógica."],["Treino e gabarito","1) Negue “Todos os processos foram digitalizados”. Resposta: “Algum processo não foi digitalizado”. 2) Passe “A equipe revisará o relatório” à passiva. Resposta: “O relatório será revisado pela equipe”. 3) “Todavia” indica causa? Não; indica oposição."]]},{"d":1,"title":"Direito Penal — crimes funcionais: comparação por elementos","time":55,"parts":[["Por que comparar tipos penais","Em crimes contra a Administração Pública, pequenas mudanças de verbo ou finalidade alteram o enquadramento. Antes de memorizar pena, identifique sujeito ativo, conduta típica, objeto, finalidade especial e consumação. Consulte a redação atualizada dos arts. 312 a 327 do Código Penal."],["Peculato: art. 312","No peculato-apropriação, o funcionário público se apropria de dinheiro, valor ou bem móvel de que tem posse em razão do cargo. No peculato-desvio, desvia o bem em proveito próprio ou alheio. A posse funcional é elemento central dessas modalidades. Não confunda com a simples subtração de bem sem posse prévia, que exige análise de outra figura do próprio artigo."],["Concussão: art. 316","O verbo nuclear é EXIGIR vantagem indevida em razão da função, ainda que fora dela ou antes de assumi-la. Exigir não equivale a solicitar. Exemplo didático: agente afirma que só praticará ato obrigatório se receber pagamento ilícito, impondo a exigência."],["Corrupção passiva: art. 317","Verbos: SOLICITAR ou RECEBER vantagem indevida, ou ACEITAR promessa de tal vantagem, em razão da função. A solicitação já integra o tipo, ainda que o particular não pague. A distinção com concussão costuma concentrar-se na exigência versus solicitação, considerando as circunstâncias concretas."],["Prevaricação: art. 319","Consiste em retardar ou deixar de praticar indevidamente ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal. O motivo especial importa. Não basta qualquer atraso de trabalho para concluir automaticamente que houve prevaricação."],["Corrupção ativa: art. 333","O particular pode cometer corrupção ativa ao OFERECER ou PROMETER vantagem indevida a funcionário público para determiná-lo a praticar, omitir ou retardar ato de ofício. Não é necessário que o agente público aceite para que se analise a consumação da conduta de oferecer ou prometer."],["Quadro de memorização","Exigir → concussão; solicitar/receber/aceitar promessa → corrupção passiva; oferecer/prometer → corrupção ativa; apropriar/desviar bem sob posse funcional → peculato; agir para satisfazer interesse ou sentimento pessoal nas condições do art. 319 → prevaricação. A palavra isolada não dispensa examinar todos os elementos legais."],["Questão comentada","Servidor pede espontaneamente vantagem indevida em razão do cargo, sem impor ameaça ou exigência. Qual tipo comparar primeiro? Corrupção passiva, pela conduta de solicitar. Se o enunciado indicar exigência, investigue concussão. Sempre confirme os demais elementos."]]},{"d":2,"title":"Processo Penal — prova testemunhal e reconhecimento","time":55,"parts":[["Prova e decisão judicial","No processo penal, a prova deve ser apreciada com observância do contraditório e das regras legais. O art. 155 do CPP distingue elementos informativos colhidos na investigação da prova produzida em contraditório judicial, ressalvadas as provas cautelares, não repetíveis e antecipadas. Uma condenação não pode se fundar exclusivamente nos elementos informativos do inquérito."],["Testemunha e compromisso","Testemunha relata fatos de que tem conhecimento. O CPP disciplina quem pode depor, hipóteses de dispensa e compromisso de dizer a verdade. Não presuma que toda pessoa ouvida tem o mesmo regime processual. Diferencie testemunha, vítima e investigado/acusado."],["Perguntas e contraditório","Na audiência, a forma de formulação de perguntas e o controle judicial seguem o procedimento legal. O juiz pode indeferir perguntas impertinentes, repetidas ou que induzam respostas nos termos legais. Contraditório não é autorização para constranger a testemunha."],["Reconhecimento de pessoas","O art. 226 do CPP descreve formalidades para reconhecimento. A jurisprudência exige cautela especial com reconhecimentos, sobretudo quando a memória foi influenciada por apresentação isolada ou sugestiva. Uma identificação informal não deve ser tratada como prova automaticamente infalível."],["Cadeia de custódia","Os arts. 158-A e seguintes tratam do conjunto de procedimentos para manter e documentar a história cronológica do vestígio. Reconhecimento, coleta, acondicionamento, transporte, recebimento e armazenamento precisam de registros apropriados. Falhas devem ser avaliadas quanto às consequências probatórias, sem soluções automáticas."],["Exemplo resolvido","Uma fotografia única é mostrada à vítima com a afirmação de que a polícia já encontrou o autor. Qual risco? Sugestionamento e contaminação da memória. O estudante deve identificar a necessidade de observar o procedimento legal e examinar a confiabilidade do reconhecimento."],["Fixação","Pergunta: elementos informativos do inquérito bastam, sozinhos, para condenar? Regra geral: não, conforme art. 155 do CPP. Pergunta: cadeia de custódia começa apenas no laboratório? Não; envolve etapas anteriores de identificação e preservação."]]},{"d":3,"title":"Processo Civil — tutela de urgência e tutela de evidência","time":55,"parts":[["Tutela provisória","O CPC organiza tutelas provisórias de urgência e de evidência. A tutela de urgência pode ser cautelar (proteger o resultado útil do processo) ou antecipada (adiantar efeitos práticos da tutela final). A distinção depende da função da medida, não apenas de seu nome."],["Requisitos da urgência","O art. 300 exige elementos que evidenciem probabilidade do direito e perigo de dano ou risco ao resultado útil do processo. Não basta o autor alegar pressa: o juiz avalia elementos concretos. A tutela antecipada de urgência enfrenta também a questão da reversibilidade dos efeitos, conforme o § 3º."],["Cautelar versus antecipada","Exemplo cautelar: bloquear a alienação de bem para preservar futura satisfação de crédito, se presentes requisitos legais. Exemplo antecipado: determinar provisoriamente o fornecimento de prestação requerida na demanda. A tutela cautelar preserva; a antecipada satisfaz provisoriamente."],["Tutela de evidência","O art. 311 prevê hipóteses de tutela de evidência, independentemente da demonstração de perigo de dano ou risco ao resultado útil do processo. Isso não significa que basta qualquer documento: é necessário enquadramento nas hipóteses legais."],["Momento e revisão","A tutela provisória pode ser requerida em caráter antecedente ou incidental, observadas as regras aplicáveis. Em geral, conserva eficácia enquanto o processo estiver pendente, mas pode ser revogada ou modificada, conforme art. 296."],["Exemplo de prova","A questão diz: “Não há perigo de dano, mas estão presentes os pressupostos específicos do art. 311”. A conclusão correta é que a tutela de evidência pode ser analisada; exigir sempre perigo de dano confundiria os dois regimes."],["Checklist","Identifique: 1) espécie; 2) finalidade; 3) probabilidade do direito; 4) perigo ou hipótese de evidência; 5) reversibilidade, quando pertinente; 6) procedimento. Consulte arts. 294 a 311 do CPC em texto atualizado."]]},{"d":4,"title":"Constitucional — direitos e garantias: remédios constitucionais","time":55,"parts":[["Direito e garantia","Direitos fundamentais protegem posições jurídicas; garantias oferecem instrumentos de proteção. Os remédios constitucionais são mecanismos específicos para reagir a lesões ou ameaças em situações previstas na Constituição."],["Habeas corpus","Protege a liberdade de locomoção contra violência ou coação por ilegalidade ou abuso de poder, inclusive ameaça. Pode ser preventivo ou repressivo. Não é instrumento genérico para discutir qualquer direito administrativo ou patrimonial."],["Mandado de segurança","Protege direito líquido e certo não amparado por habeas corpus ou habeas data, quando o responsável pela ilegalidade ou abuso é autoridade pública ou agente no exercício de atribuições do poder público. A prova pré-constituída é aspecto relevante da via."],["Habeas data","Destina-se, nas hipóteses legais, ao conhecimento e à retificação de informações relativas à pessoa do impetrante constantes de registros ou bancos de dados governamentais ou de caráter público. Não se confunde com acesso indiscriminado a informações de terceiros."],["Mandado de injunção","Relaciona-se à falta de norma regulamentadora que inviabilize o exercício de direitos e liberdades constitucionais e prerrogativas inerentes à nacionalidade, soberania e cidadania. O problema central é a omissão normativa inviabilizadora."],["Ação popular","Cidadão, nos termos constitucionais e legais, pode buscar anular ato lesivo ao patrimônio público, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural. Não confunda legitimidade de cidadão com qualquer pessoa jurídica."],["Questão comentada","Pessoa sofre ameaça ilegal de prisão. Qual remédio examinar? Habeas corpus preventivo. Pessoa busca acesso a dados pessoais em banco público, conforme requisitos legais: habeas data. Direito líquido e certo violado por autoridade sem cabimento de HC ou HD: mandado de segurança."],["Leitura dirigida","Releia art. 5º, incisos LXVIII a LXXIII, da Constituição, e legislação específica. Memorize o bem jurídico protegido e a hipótese de cabimento antes de estudar detalhes procedimentais."]]},{"d":5,"title":"Administrativo — princípios e motivação dos atos","time":55,"parts":[["Princípios do art. 37","Legalidade, impessoalidade, moralidade, publicidade e eficiência formam o conjunto expresso no caput do art. 37 da Constituição. Outros princípios também incidem sobre a Administração. Não trate publicidade como autorização para divulgar dados protegidos."],["Legalidade administrativa","Para o particular, em geral, é permitido fazer o que a lei não proíbe. A Administração depende de competência e fundamento jurídico para agir. Uma autoridade não pode inventar requisito de concurso ou criar sanção sem suporte normativo."],["Impessoalidade e finalidade","A atuação deve perseguir finalidade pública, sem promoção pessoal ou favorecimento indevido. Exemplo: escolher beneficiário de serviço com base em amizade, ignorando critérios legais, afronta impessoalidade."],["Motivação","Motivação é a exposição dos fundamentos de fato e de direito que justificam o ato. Não confunda motivo (pressuposto de fato e de direito) com motivação (sua explicitação). Regras sobre quando motivar dependem do regime aplicável e do tipo de ato."],["Teoria dos motivos determinantes","Quando a Administração declara motivos para um ato, a validade da decisão fica vinculada à existência e à adequação desses motivos, conforme a aplicação da teoria. Se a razão apresentada é comprovadamente falsa, pode haver vício do ato."],["Anulação e revogação","Anulação enfrenta ilegalidade; revogação examina conveniência e oportunidade de ato válido, dentro dos limites legais. Ato vinculado não é livremente revogável por mero juízo de conveniência. A convalidação exige análise de vício sanável e requisitos aplicáveis."],["Questão resolvida","Uma autoridade nega pedido afirmando que falta documento, mas o documento está comprovadamente anexado. O problema envolve motivo declarado incompatível com os fatos; analise legalidade e motivação, em vez de concluir que se trata apenas de conveniência administrativa."]]},{"d":7,"title":"PCD — atendimento prioritário, acessibilidade e comunicação","time":55,"parts":[["Prioridade não é favor","A legislação brasileira assegura atendimento prioritário a grupos definidos em lei. No estudo, diferencie a pessoa com deficiência de outras hipóteses de prioridade e confira a legislação específica e suas atualizações. O atendimento deve respeitar autonomia e dignidade."],["Barreiras de comunicação","Informações oferecidas somente em formato inacessível podem impedir o exercício de direitos. Acessibilidade envolve canais, linguagem e recursos adequados, não apenas rampas e elevadores. Exemplo: atendimento exclusivamente sonoro pode excluir usuários com deficiência auditiva."],["Tecnologia assistiva","Tecnologia assistiva abrange produtos, equipamentos, dispositivos, recursos, metodologias e serviços voltados a promover funcionalidade e participação. Exemplos incluem leitores de tela e dispositivos de comunicação alternativa, conforme necessidades individuais."],["Adaptação razoável","Ajustes necessários e adequados em situação particular, sem ônus desproporcional ou indevido, ajudam a assegurar igualdade de oportunidades. A avaliação deve considerar a barreira concreta e a solução apropriada."],["Atendimento respeitoso","Pergunte à pessoa qual forma de apoio prefere, sem presumir incapacidade. Dirija-se à própria pessoa, e não automaticamente ao acompanhante. Evite infantilização e não toque em equipamentos de mobilidade sem autorização."],["Caso resolvido","Um serviço público fornece senha apenas por aviso sonoro. Há problema de acessibilidade? Sim, pode haver barreira na comunicação e informação. Uma alternativa visual ou outra solução adequada amplia o acesso."],["Fixação","Identifique se cada exemplo é barreira arquitetônica, tecnológica, atitudinal ou comunicacional. Leia os conceitos do art. 3º da Lei 13.146/2015 em fonte oficial atualizada."]]},{"d":8,"title":"Matemática — juros e descontos: comparação de taxas","time":55,"parts":[["Juros simples","J = C × i × t, com taxa e tempo na mesma unidade. Montante M = C + J. Exemplo: capital R$ 2.000, taxa 2% ao mês, três meses: J = 2.000 × 0,02 × 3 = R$ 120; M = R$ 2.120."],["Juros compostos","M = C × (1+i)^t. Com R$ 2.000 a 2% ao mês por três meses: M = 2.000 × 1,02³ = R$ 2.122,416, aproximadamente R$ 2.122,42. Os juros de cada período incidem também sobre juros acumulados."],["Descontos sucessivos","Desconto de 20% seguido de 10% não soma 30%. O fator é 0,80 × 0,90 = 0,72; o desconto total é 28%. Em preço de R$ 500, o valor final é R$ 360."],["Aumento seguido de redução","Um aumento de 25% e uma redução de 20% devolvem o valor inicial: 1,25 × 0,80 = 1. Em contrapartida, aumentar 20% e reduzir 20% resulta em 1,20 × 0,80 = 0,96: perda de 4%."],["Taxas equivalentes","Em juros compostos, 1% ao mês durante 12 meses corresponde a (1,01)^12 − 1 ≈ 12,68% ao ano, e não exatamente 12%. A multiplicação direta de taxa por tempo pertence à lógica de juros simples."],["Questão resolvida","Produto custa R$ 800 e sofre dois descontos, de 15% e 5%. Preço final = 800 × 0,85 × 0,95 = R$ 646. Desconto total = 154/800 = 19,25%."],["Treino","1) R$ 1.500 a 3% simples por quatro meses: juros R$ 180. 2) Desconto de 10% seguido de 10%: desconto efetivo de 19%. 3) Para comparar duas ofertas, aplique os fatores na ordem; multiplicações de fatores independem da ordem."]]},{"d":9,"title":"Informática — Excel: referências e fórmulas copiadas","time":55,"parts":[["Referência relativa","Em A1, a fórmula =B1+C1, ao ser copiada uma coluna à direita, torna-se =C1+D1. As referências relativas deslocam linhas e colunas de acordo com o movimento."],["Referência absoluta","O cifrão fixa linha ou coluna. $A$1 fixa ambas; $A1 fixa a coluna A, mas permite mudar a linha; A$1 fixa a linha 1, mas permite mudar a coluna. O sinal $ fica antes da parte fixada."],["Exemplo passo a passo","A fórmula =$A5+B$2+$D$4 em C5 é copiada para E8: deslocamento de +2 colunas e +3 linhas. $A5 vira $A8; B$2 vira D$2; $D$4 permanece $D$4. Resultado: =$A8+D$2+$D$4."],["Intervalos e cópia","Na fórmula =SOMA(A$1:$B2), o primeiro extremo tem linha fixa e coluna relativa; o segundo tem coluna fixa e linha relativa. Ao copiar uma coluna à direita e uma linha abaixo, a fórmula vira =SOMA(B$1:$B3). Avalie cada referência separadamente."],["Função SE","=SE(A1>=60;\"Aprovado\";\"Revisar\") testa condição lógica e devolve um valor se verdadeiro e outro se falso. Dependendo da configuração regional, separadores podem ser ponto e vírgula ou vírgula. Não confunda SE com SOMASE."],["CONT.SE e SOMASE","CONT.SE(intervalo;critério) conta células que satisfazem condição. SOMASE(intervalo;critério;intervalo_soma) soma valores associados às ocorrências. Exemplo: =CONT.SE(B2:B10;\"Pago\") conta registros com texto Pago."],["Questão comentada","Se A1=10, A2=20, B1=5, B2=15, e C1 contém =SOMA(A$1:$B2), copiar para D2 produz =SOMA(B$1:$B3). Sem outros valores em B3, o resultado é 5+15=20. A pegadinha é a alteração dos extremos do intervalo."]]},{"d":10,"title":"Raciocínio Lógico — quantificadores e negação de proposições","time":55,"parts":[["Todo e algum","“Todos os A são B” significa que não existe A fora de B. “Algum A é B” afirma a existência de ao menos um elemento na interseção. Em lógica formal, “algum” significa pelo menos um, não necessariamente muitos."],["Negação de universal","A negação de “Todo servidor é pontual” é “Existe pelo menos um servidor que não é pontual”. Não é “Nenhum servidor é pontual”, que afirma algo muito mais forte."],["Negação de existencial","A negação de “Algum processo é urgente” é “Nenhum processo é urgente” ou “Todos os processos não são urgentes”. Troque quantificador e negue o predicado."],["Condicional","P → Q só é falsa quando P é verdadeira e Q é falsa. Sua negação é P ∧ ¬Q. Exemplo: “Se estudo, passo” nega-se por “Estudo e não passo”, não por “Se não estudo, não passo”."],["De Morgan","Negação de P ∧ Q: ¬P ∨ ¬Q. Negação de P ∨ Q: ¬P ∧ ¬Q. Exemplo: “O arquivo está assinado e autenticado” nega-se por “Não está assinado ou não está autenticado”."],["Equivalência útil","P → Q equivale a ¬P ∨ Q e à contrapositiva ¬Q → ¬P. Não equivale à recíproca Q → P. Exemplo: “Se é quadrado, é retângulo” não autoriza concluir que todo retângulo é quadrado."],["Treino com respostas","1) Negue “Alguns candidatos acertaram tudo”: “Nenhum candidato acertou tudo”. 2) Negue “Ana estuda ou trabalha”: “Ana não estuda e não trabalha”. 3) Negue “Se chover, fico em casa”: “Chove e não fico em casa”."]]},{"d":6,"title":"Legislação TJ-SP — leitura orientada de normas e organização judiciária","time":55,"parts":[["Escopo e fonte","Este é um capítulo de técnica de estudo, não uma transcrição das Normas da Corregedoria. Para memorizar regras de serventias, use sempre o texto oficial consolidado do TJ-SP e o recorte de artigos do edital vigente. Anote a versão da norma e a data de consulta."],["Quem faz o quê","Leia cada dispositivo identificando sujeito e verbo: juiz, escrivão, chefe de seção ou servidor; deverá, poderá ou é vedado. A banca pode trocar o responsável pelo ato ou transformar faculdade em obrigação."],["Documentação de atos","Rotinas processuais exigem atenção a registro, certificação, remessa e controle. Não presuma que um fluxo didático representa o procedimento oficial: compare cada etapa ao dispositivo específico da norma."],["Prazos e condições","Sublinhe os gatilhos de prazo: da ciência, do recebimento, da publicação, após a juntada. Um prazo sem marco inicial pode ser interpretado incorretamente. Verifique também hipóteses de exceção e competências delegadas."],["Exemplo fictício de interpretação","Norma hipotética: “Após a conferência, o chefe de seção deverá certificar a regularidade antes da remessa”. Perguntas: quem certifica? O chefe de seção. Quando? Depois da conferência e antes da remessa. O exemplo ensina leitura, mas não é artigo real do TJ-SP."],["Plano de leitura ativa","Para cada artigo efetivamente previsto no edital: 1) transcreva o verbo nuclear; 2) identifique o responsável; 3) destaque prazos; 4) marque exceções; 5) elabore uma questão invertendo um único detalhe; 6) confira a resposta no texto oficial."],["Alerta de precisão","Não use este capítulo como substituto da lei seca. A lista exata de normas e artigos depende do edital consolidado e suas retificações, que ainda não foram integralmente confrontados com esta apostila."]]}]);

 options.forEach((opt,i)=>{
  let explanation;
  if(i===right)explanation='Correta. '+x[6];
  else if(notes[i])explanation=notes[i];
  else explanation='Esta opção não corresponde ao gabarito. A justificativa específica ainda está em elaboração; compare o conceito desta alternativa com a regra explicada acima.';
  html+='<div class="answer-row '+(i===right?'right':i===picked?'mine':'')+'"><b>'+letters[i]+'. '+esc(opt)+(i===right?' ✓ Correta':i===picked?' ✕ Sua escolha':'')+'</b><span>'+esc(explanation)+'</span></div>';
 });
 return html+'</div>';

const renderBeforeV29=renderQuestion;
renderQuestion=function(){renderBeforeV29();if(!checked)return;const x=queue[idx];if(!x)return;const card=$('main').querySelector('.card');if(!card)return;const old=card.querySelector('.notice');if(old)old.remove();const nextButton=Array.from(card.querySelectorAll('button')).find(b=>b.textContent.includes('Próxima questão')||b.textContent.includes('Ver resultado'));if(nextButton)nextButton.insertAdjacentHTML('beforebegin',feedbackV29(x,selected));else card.insertAdjacentHTML('beforeend',feedbackV29(x,selected));};

// Correção de redação com IA: chave mantida exclusivamente no servidor.
(function(){
 const prev=draw;
 draw=function(){prev();if(tab==='Redação')setTimeout(addAiButton,0)};
 function addAiButton(){
  const target=document.getElementById('essayResult');if(!target||document.getElementById('essayAiBtn'))return;
  const wrap=document.createElement('div');wrap.className='card';
  wrap.innerHTML='<h3>Correção aprofundada com IA</h3><p class="muted tiny">Opcional e online. Seu texto será enviado ao serviço configurado pelo administrador. A nota é uma estimativa, não a nota oficial da Vunesp.</p><button id="essayAiBtn" class="btn primary">Corrigir com IA (online)</button><p id="essayAiStatus" class="muted tiny" role="status"></p><div id="essayAiFeedback"></div>';
  target.parentNode.insertBefore(wrap,target.nextSibling);
  document.getElementById('essayAiBtn').onclick=aiGrade;
 }
 async function aiGrade(){
  const btn=document.getElementById('essayAiBtn'),status=document.getElementById('essayAiStatus'),out=document.getElementById('essayAiFeedback');
  const essay=document.getElementById('essay')?.value||'';
  if(essay.trim().split(/\s+/).length<80){status.textContent='Escreva pelo menos 80 palavras para uma avaliação mais útil.';return}
  essaySave();btn.disabled=true;status.textContent='Enviando texto para análise...';out.innerHTML='';
  try{
   const res=await fetch('/api/corrigir-redacao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tema:essayTopics[Number(document.getElementById('essayTopic').value)]||'',texto:essay})});
   const data=await res.json();if(!res.ok)throw Error(data.erro||'Falha na correção');
   const safe=x=>esc(String(x??''));
   let html='<h3>Devolutiva da IA</h3><p><b>Nota estimada: '+safe(data.nota_estimada)+'/100</b></p><p>'+safe(data.resumo)+'</p>';
   for(const name of ['estrutura','argumentacao','coesao','gramatica','adequacao_ao_tema'])if(data[name])html+='<h4>'+safe(name.replaceAll('_',' '))+'</h4><p>'+safe(data[name])+'</p>';
   if(Array.isArray(data.trechos))html+='<h4>Trechos para revisar</h4>'+data.trechos.map(x=>'<div class="essay-feedback"><b>Trecho:</b> '+safe(x.trecho)+'<p><b>Problema:</b> '+safe(x.problema)+'</p><p><b>Sugestão:</b> '+safe(x.sugestao)+'</p></div>').join('');
   if(Array.isArray(data.proximos_passos))html+='<h4>Próximos passos</h4><ol>'+data.proximos_passos.map(x=>'<li>'+safe(x)+'</li>').join('')+'</ol>';
   out.innerHTML=html;status.textContent='Correção recebida. Resultado indicativo.';
  }catch(err){status.textContent='IA indisponível: '+String(err.message||err)+'. A correção offline continua disponível.'}
  finally{btn.disabled=false}
 }
 if(tab==='Redação')setTimeout(addAiButton,0);
})();
</script></body></html>
