<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AprovaTJ 3.0 — Correção IA</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172b49;background:#eef3fa}*{box-sizing:border-box}body{margin:0}.app{max-width:960px;margin:auto;min-height:100vh;background:#f8faff}.top{background:#163d7b;color:white;padding:24px 20px;border-radius:0 0 24px 24px}.top h1{margin:0;font-size:26px}.top p{margin:6px 0 0;color:#d7e6ff}.nav{display:flex;gap:7px;overflow:auto;padding:14px 12px;position:sticky;top:0;background:#f8faff;z-index:2;border-bottom:1px solid #e1e8f1}.nav button{border:0;border-radius:12px;padding:11px 13px;background:#e6eef9;color:#244b83;white-space:nowrap;font-weight:650}.nav button.active,.primary{background:#245db4!important;color:white!important}.main{padding:20px 16px 60px}.card{background:white;border:1px solid #e0e8f2;border-radius:18px;padding:19px;margin-bottom:14px;box-shadow:0 3px 12px #102a4a08}.card h2,.card h3{margin:0 0 12px}.muted{color:#60738f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:28px;font-weight:750;color:#1c55a4}.btn{border:0;border-radius:11px;padding:12px 16px;background:#e7effb;color:#1a4b92;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border:1px solid #cfdbeb;border-radius:12px;background:white;color:#1d3555;font-size:15px}.choice.selected{border:2px solid #2564c3;background:#ecf4ff}.choice.good{border:2px solid #1c9364;background:#e8fbf1}.choice.bad{border:2px solid #cb4556;background:#fff0f1}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eaf1fd;color:#2557a0;font-size:12px;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex-shrink:0}select,textarea,input{font:inherit;border:1px solid #cbd8e9;border-radius:11px;padding:11px;width:100%;background:white;color:#19345a}textarea{min-height:220px;resize:vertical}.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:#526883;margin-bottom:6px}progress{width:100%;height:12px;accent-color:#245db4}.tiny{font-size:12px}.notice{background:#fff6df;border:1px solid #f3d48c;padding:13px;border-radius:12px;color:#77510c}.subject{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f6}.subject:last-child{border:0}@media(max-width:520px){.main{padding:15px 12px 50px}.top{padding:20px 16px}.nav button{font-size:13px;padding:10px}.grid{grid-template-columns:1fr 1fr}}</style><style>
:root{--accent:#245db4} .top{background:linear-gradient(125deg,#122d5c,#2867bd)}.card{box-shadow:0 5px 20px #142a4b0a}.btn:focus-visible,.choice:focus-visible,.nav button:focus-visible{outline:3px solid #f2b84a;outline-offset:2px}.nav button{cursor:pointer}.statline{display:flex;justify-content:space-between;gap:12px;margin:12px 0 5px}.review-item{border-bottom:1px solid #e5ecf5;padding:12px 0}.review-item:last-child{border:0}.review-item p{margin:6px 0}.mini{font-size:13px}.success{color:#146b4a}.warning{color:#a45d16}.review-chip{font-size:12px;background:#e8f1ff;border-radius:20px;padding:4px 8px}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hero-grid>div{background:#f1f6ff;padding:12px 7px;border-radius:12px;text-align:center}.hero-grid b{display:block;font-size:23px;color:#1b5099}@media(max-width:520px){.hero-grid b{font-size:20px}}
</style></head><body><div class="app"><header class="top"><h1>📘 AprovaTJ</h1><p>Seu espaço de preparação para Escrevente TJ-SP</p></header><nav class="nav" id="nav"></nav><main class="main" id="main"></main></div><script>
const subjects=['Língua Portuguesa','Direito Penal','Direito Processual Penal','Direito Processual Civil','Direito Constitucional','Direito Administrativo','Legislação Interna e Normas da Corregedoria','Atualidades e Estatuto da Pessoa com Deficiência','Matemática','Informática','Raciocínio Lógico'];
const q=[
['p01',0,'Crase','Assinale a frase em que a crase está corretamente empregada.',['Entreguei o documento à ela.','Cheguei à pé.','Dirigi-me à secretaria.','Ficamos frente à frente.','Começou à estudar.'],2,"A preposição 'a', exigida por dirigir-se, combina-se com o artigo feminino 'a' de 'secretaria'."],
['p02',0,'Concordância','Assinale a alternativa de acordo com a norma-padrão.',['Fazem dois anos que estudo.','Houveram muitos candidatos.','Existe várias soluções.','Faz dois anos que estudo.','Devem haver vagas.'],3,"O verbo 'fazer' indicando tempo decorrido é impessoal e permanece no singular."],
['p03',0,'Pontuação','Em qual alternativa a vírgula separa corretamente um vocativo?',['Os alunos, chegaram cedo.','Maria, revise o texto.','O edital, foi publicado.','Precisamos, estudar mais.','A prova será, amanhã.'],1,"'Maria' é vocativo e deve ser isolado por vírgula."],
['m01',8,'Porcentagem','Em uma prova de 80 questões, um candidato acertou 60. Qual foi o percentual de acertos?',['65%','70%','72,5%','75%','80%'],3,'60 ÷ 80 = 0,75; multiplicando por 100, obtém-se 75%.'],
['m02',8,'Regra de três','Quatro servidores analisam 120 processos em 6 horas, no mesmo ritmo. Quantos processos seis servidores analisam em 6 horas?',['150','160','180','200','240'],2,'120 × 6 ÷ 4 = 180.'],
['i01',9,'Excel','No Excel, ao copiar a fórmula =$A1+B$2 da célula C3 para D4, qual será a fórmula resultante?',['=$A2+C$2','=$B2+C$3','=$A1+B$2','=$A2+B$2','=$B1+C$2'],0,'A coluna A permanece fixa; a linha 1 avança para 2. A coluna B avança para C; a linha 2 fica fixa.'],
['i02',9,'Segurança','Qual prática ajuda a proteger uma conta contra acesso não autorizado mesmo quando a senha é descoberta?',['Reutilizar a senha','Desativar atualizações','Compartilhar códigos por mensagem','Ativar autenticação multifator','Salvar a senha em arquivo público'],3,'A autenticação multifator exige outra forma de verificação além da senha.'],
['r01',10,'Proposições',"Qual é a negação lógica de 'Todos os documentos foram conferidos'?",['Nenhum documento foi conferido.','Todos os documentos não foram conferidos.','Pelo menos um documento não foi conferido.','Alguns documentos foram conferidos.','Exatamente um documento foi conferido.'],2,'A negação de uma afirmação universal é a existência de pelo menos um contraexemplo.'],
['r02',10,'Sequências','Qual é o próximo termo da sequência 3, 6, 12, 24, ...?',['30','36','42','48','54'],3,'Cada termo é o dobro do anterior: 24 × 2 = 48.'],
['m03',8,'Média aritmética','As notas de três avaliações foram 6, 8 e 10. Qual é a média aritmética?',['7','8','8,5','9','9,5'],1,'(6 + 8 + 10) ÷ 3 = 8.']];
// Questões autorais adicionais: material de demonstração, não extraído do edital.
q.push(
['dp01',1,'Princípios penais','Segundo o princípio da legalidade penal, é correto afirmar que:',['A analogia pode criar crimes.','Não há crime sem lei anterior que o defina.','Decretos podem criar penas.','O costume sempre define delitos.','A lei penal incriminadora retroage.'],1,'O art. 1º do Código Penal exige lei anterior para definir crime e pena.'],
['dpp01',2,'Inquérito policial','De acordo com o Código de Processo Penal, o inquérito policial é, em regra:',['Uma sentença condenatória.','Uma ação penal privada.','Um procedimento investigatório.','Um recurso judicial.','Uma execução de pena.'],2,'O inquérito é procedimento administrativo investigatório destinado à apuração de infrações penais e sua autoria.'],
['dpc01',3,'Prazos processuais','Segundo o CPC, na contagem de prazo processual em dias, estabelecido por lei ou pelo juiz, computam-se:',['Somente os dias úteis.','Todos os dias corridos.','Apenas os sábados.','Somente os feriados.','Apenas os dias de audiência.'],0,'O art. 219 do CPC determina a contagem somente em dias úteis dos prazos processuais em dias.'],
['dc01',4,'Direitos fundamentais','A Constituição Federal assegura que ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de:',['Portaria interna.','Ordem verbal.','Lei.','Costume administrativo.','Circular de serviço.'],2,'Trata-se da garantia de legalidade do art. 5º, II, da Constituição Federal.'],
['da01',5,'Administração pública','Qual princípio está expressamente previsto no caput do art. 37 da Constituição Federal?',['Autotutela.','Eficiência.','Continuidade.','Supremacia do interesse público.','Especialidade.'],1,'O art. 37, caput, enumera legalidade, impessoalidade, moralidade, publicidade e eficiência.'],
['li01',6,'Normas internas','Ao estudar normas internas de um tribunal, qual fonte deve prevalecer para verificar a redação vigente de um artigo?',['Resumo anônimo.','Mensagem de rede social.','Texto oficial consolidado e atualizações publicadas.','Comentário sem referência.','Material antigo sem data.'],2,'Normas internas podem sofrer alterações; deve-se consultar a publicação oficial e suas atualizações. Questão de método de estudo, não de artigo específico do edital.'],
['at01',7,'Acessibilidade','Segundo a Lei Brasileira de Inclusão, acessibilidade diz respeito à possibilidade e condição de alcance para utilização, com segurança e autonomia, de espaços e serviços por:',['Somente servidores públicos.','Pessoas com deficiência ou mobilidade reduzida.','Apenas pessoas idosas.','Somente usuários de transporte.','Apenas pessoas com deficiência visual.'],1,'A Lei 13.146/2015, art. 3º, I, inclui pessoas com deficiência ou mobilidade reduzida na definição de acessibilidade.']
);
const lessons={
0:['Crase e concordância','Crase: ocorre, em regra, quando a preposição a se funde ao artigo feminino a. Verifique a regência e a presença do artigo. Concordância: verbos impessoais como fazer (tempo decorrido) permanecem no singular.'],
1:['Legalidade penal','O art. 1º do Código Penal estabelece que não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal.'],
2:['Inquérito policial','É um procedimento investigatório, não uma sentença nem a própria ação penal. Consulte os dispositivos do Código de Processo Penal aplicáveis.'],
3:['Contagem de prazos','O art. 219 do CPC prevê contagem em dias úteis para prazos processuais fixados em dias. Atenção às exceções e regras específicas.'],
4:['Legalidade constitucional','O art. 5º, II, da Constituição garante que ninguém será obrigado a fazer ou deixar de fazer algo senão em virtude de lei.'],
5:['Princípios administrativos','O art. 37, caput, da Constituição enumera legalidade, impessoalidade, moralidade, publicidade e eficiência (LIMPE).'],
6:['Como estudar normas da Corregedoria','Use sempre a versão oficial consolidada e as alterações publicadas. O texto integral dos dispositivos exigidos depende de conferência do Anexo VIII.'],
7:['Lei Brasileira de Inclusão','A Lei 13.146/2015 trata de direitos da pessoa com deficiência, incluindo acessibilidade e barreiras. Verifique os artigos efetivamente exigidos no edital.'],
8:['Porcentagem','Para calcular porcentagem, divida a parte pelo total e multiplique por 100. Ex.: 10 de 250 = 4%.'],
9:['Referências no Excel','O cifrão fixa coluna e/ou linha: $A1 fixa a coluna; A$1 fixa a linha; $A$1 fixa ambas.'],
10:['Negação de proposições','A negação de “todos têm P” é “existe pelo menos um que não tem P”. Evite confundir com “nenhum tem P”.']};
const key='aprovatj_web_04';let db;try{db=JSON.parse(localStorage.getItem(key))||{answers:[],draft:'',sessions:[]}}catch(e){db={answers:[],draft:'',sessions:[]}};let tab='Início',filter='Todas',mode='normal',queue=[],idx=0,selected=null,checked=false,results=[];const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(db))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const navs=['Início','Estudar','Questões','Simulados','Redação','Revisões','Estatísticas','Configurações'];function go(t){tab=t;draw()}function draw(){ $('nav').innerHTML=navs.map(n=>`<button class="${tab===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('');let m=$('main');if(tab==='Início'){let a=db.answers,correct=a.filter(x=>x.correct).length;m.innerHTML=`<h2>Bem-vindo aos seus estudos 👋</h2><p class="muted">Continue no seu ritmo. Seu progresso fica salvo neste navegador.</p><div class="grid"><div class="card"><div class="stat">${a.length}</div><div class="muted">Respostas registradas</div></div><div class="card"><div class="stat">${a.length?Math.round(correct/a.length*100):0}%</div><div class="muted">Taxa de acertos</div></div></div><div class="card"><h3>O que vamos estudar hoje?</h3><p>Você tem ${q.length} questões autorais de demonstração distribuídas pelas 11 áreas.</p><button class="btn primary" onclick="go('Questões')">Começar treino →</button>${db.active?.ids?.length?'<p><button class="btn" onclick="resume()">Retomar treino salvo</button></p>':''}</div><div class="notice tiny">Protótipo web de teste. Não contém o edital integral nem simulados oficiais; as questões são autorais, não questões da Vunesp.</div>`}
else if(tab==='Estudar'){m.innerHTML=`<h2>Disciplinas</h2><p class="muted">Estrutura de 11 áreas. Os conteúdos ainda serão ampliados após validação do edital.</p><div class="card">${subjects.map((s,i)=>`<div class="subject"><div><b>${esc(s)}</b><div style="margin-top:6px"><button class="btn" onclick="openLesson(${i})">Ler aula</button></div><div class="tiny muted">${q.filter(x=>x[1]===i).length} questões disponíveis</div></div>${q.some(x=>x[1]===i)?`<button class="btn" onclick="start(${i})">Treinar</button>`:'<span class="pill">Em preparação</span>'}</div>`).join('')}</div>`}
else if(tab==='Questões'){if(queue.length&&mode==='practice')renderQuestion();else m.innerHTML=`<h2>Treino de questões</h2><div class="card"><div class="field"><label>Escolha uma disciplina</label><select id="sub"><option value="all">Todas as disponíveis</option>${subjects.map((s,i)=>q.some(x=>x[1]===i)?`<option value="${i}">${esc(s)}</option>`:'').join('')}</select></div><div class="field"><label>Assunto</label><select id="topic"><option value="all">Todos os assuntos</option>${[...new Set(q.map(x=>x[2]))].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><select id="qty"><option value="all">Todas disponíveis</option><option value="3">3 questões</option><option value="5">5 questões</option></select></div><p class="muted tiny">Questões originais de demonstração, com cinco alternativas e explicação.</p><button class="btn primary" onclick="start($('sub').value,'practice',$('topic').value,$('qty').value)">Iniciar treino</button>${db.active?.ids?.length?'<p><button class="btn" onclick="resume()">Retomar treino interrompido</button></p>':''}</div>`}
else if(tab==='Simulados'){m.innerHTML=`<h2>Simulados</h2><div class="card"><h3>Mini-simulado demonstrativo</h3><p>questões autorais de demonstração, cobrindo as 11 áreas, com resultado ao final.</p><button class="btn primary" onclick="start('all','simulation')">Iniciar mini-simulado</button></div><div class="notice">O simulado oficial de 70 questões ainda não está disponível: faltam questões verificadas em todas as disciplinas. Não vamos completar a prova com perguntas repetidas.</div>${db.sessions.length?`<div class="card"><h3>Histórico</h3>${db.sessions.slice().reverse().map(s=>`<p>${esc(s.date)} — ${s.correct}/${s.total} acertos</p>`).join('')}</div>`:''}`}
else if(tab==='Redação'){m.innerHTML=`<h2>Oficina de redação</h2><div class="card"><span class="pill">Tema autoral para treino</span><h3 style="margin-top:12px">Os desafios da inclusão digital no acesso aos serviços públicos</h3><p class="muted">Escreva um texto dissertativo-argumentativo. O rascunho é salvo localmente; ainda não há correção automatizada.</p><textarea id="essay" placeholder="Comece sua redação aqui...">${esc(db.draft)}</textarea><div class="row" style="justify-content:space-between;margin-top:10px"><span class="muted tiny" id="words"></span><button class="btn primary" onclick="saveDraft()">Salvar rascunho</button></div><p id="saved" class="muted tiny"></p></div>`;let e=$('essay');e.oninput=()=>{db.draft=e.value;save();wordCount()};wordCount()}
else if(tab==='Aula'){let i=Number(window.lessonIndex||0),l=lessons[i];m.innerHTML=`<button class="btn" onclick="go('Estudar')">← Disciplinas</button><div class="card" style="margin-top:14px"><span class="pill">Aula introdutória autoral</span><h2 style="margin-top:12px">${esc(subjects[i])}</h2><h3>${esc(l[0])}</h3><p style="line-height:1.8">${esc(l[1])}</p><p class="muted tiny">Material inicial. Não substitui o conteúdo integral do edital nem a consulta à legislação vigente.</p><button class="btn primary" onclick="start(${i})">Praticar esta disciplina</button></div>`}
else if(tab==='Revisões'){let wrong=[...new Set(db.answers.filter(a=>!a.correct).map(a=>a.id))];m.innerHTML=`<h2>Revisões</h2><div class="card"><h3>Questões que você errou</h3><p>${wrong.length?`Você tem ${wrong.length} questões para revisar.`:'Nenhum erro registrado ainda. Responda questões para alimentar suas revisões.'}</p><button class="btn primary" ${wrong.length?'':'disabled'} onclick="startWrong()">Revisar erros</button></div>`}
else if(tab==='Configurações'){m.innerHTML=`<h2>Configurações e dados</h2><div class="card"><h3>Backup local</h3><p class="muted">Exporte ou restaure seu progresso. A restauração substitui os dados atuais.</p><button class="btn primary" onclick="exportData()">Exportar backup</button><div class="field" style="margin-top:15px"><label>Restaurar arquivo JSON</label><input type="file" accept="application/json,.json" id="restoreFile" onchange="restoreData(this)"></div></div><div class="card"><h3>Privacidade</h3><p>O protótipo funciona offline. Seus dados são mantidos no armazenamento local deste navegador, sem envio para servidores.</p><button class="btn" onclick="resetData()">Apagar dados locais</button></div>`}
else if(tab==='Estatísticas'){let a=db.answers;m.innerHTML=`<h2>Seu desempenho</h2><div class="card"><h3>Acertos por disciplina</h3>${subjects.filter((s,i)=>a.some(x=>q.find(z=>z[0]===x.id)?.[1]===i)).map(s=>{let i=subjects.indexOf(s),r=a.filter(x=>q.find(z=>z[0]===x.id)?.[1]===i),n=r.filter(x=>x.correct).length;return `<p><b>${esc(s)}</b><span class="muted"> — ${n}/${r.length}</span></p><progress value="${n}" max="${r.length}"></progress>`}).join('')||'<p class="muted">Ainda não há respostas registradas.</p>'}</div><div class="card"><h3>Dados locais</h3><p class="muted">As respostas e redações ficam somente neste navegador.</p><button class="btn" onclick="exportData()">Exportar backup JSON</button></div>`}}
function openLesson(i){window.lessonIndex=i;go('Aula')}
function start(s='all',type='practice',topic='all',qty='all'){queue=q.filter(x=>(s==='all'||x[1]===Number(s))&&(topic==='all'||x[2]===topic));if(qty!=='all')queue=queue.slice(0,Number(qty));if(!queue.length)return;mode=type;idx=0;selected=null;checked=false;results=[];db.active={ids:queue.map(x=>x[0]),idx:0,selected:null,checked:false,results:[],type};save();tab=type==='simulation'?'Simulados':'Questões';renderQuestion();$('nav').innerHTML=navs.map(n=>`<button class="${tab===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('')}
function startWrong(){let ids=new Set(db.answers.filter(a=>!a.correct).map(a=>a.id));queue=q.filter(x=>ids.has(x[0]));mode='practice';idx=0;selected=null;checked=false;results=[];tab='Questões';db.active={ids:queue.map(x=>x[0]),idx:0,selected:null,checked:false,results:[],type:'practice'};save();renderQuestion()}
function resume(){let a=db.active;if(!a?.ids?.length)return;queue=a.ids.map(id=>q.find(x=>x[0]===id)).filter(Boolean);if(!queue.length)return;idx=Math.min(a.idx,queue.length-1);selected=a.selected??null;checked=!!a.checked;results=a.results||[];mode=a.type||'practice';tab=mode==='simulation'?'Simulados':'Questões';draw()}
function persistActive(){if(db.active){Object.assign(db.active,{idx,selected,checked,results});save()}}
function renderQuestion(){let x=queue[idx];if(!x){finish();return} $('main').innerHTML=`<div class="row" style="justify-content:space-between"><span class="pill">${esc(subjects[x[1]])}</span><span class="muted">${idx+1} de ${queue.length}</span></div><div style="margin:12px 0"><progress value="${idx}" max="${queue.length}"></progress></div><div class="card"><div class="muted tiny">${esc(x[2])}</div><h3 style="margin-top:12px">${esc(x[3])}</h3>${x[4].map((v,i)=>`<button class="choice ${checked?(i===x[5]?'good':i===selected?'bad':''):i===selected?'selected':''}" ${checked?'disabled':''} onclick="choose(${i})"><b>${'ABCDE'[i]}.</b> ${esc(v)}</button>`).join('')}${checked?`<div class="notice" style="margin-top:14px"><b>${selected===x[5]?'✓ Você acertou!':'Resposta correta: '+ 'ABCDE'[x[5]]}</b><p>${esc(x[6])}</p></div><button class="btn primary" onclick="next()">${idx+1===queue.length?'Ver resultado':'Próxima questão →'}</button>`:`<button class="btn primary" ${selected===null?'disabled':''} onclick="check()">Confirmar resposta</button>`}</div><button class="btn" onclick="stop()">Sair do treino</button>`}

const examPlan=[{subject:0,count:16},{subject:'law',count:30},{subject:7,count:4},{subject:8,count:4},{subject:9,count:9},{subject:10,count:7}];
function buildExam(){const parts=[];for(const b of examPlan){let pool=q.filter(x=>b.subject==='law'?(x[1]>=1&&x[1]<=6):x[1]===b.subject);if(pool.length<b.count)return null;parts.push(...pool.slice(0,b.count))}return parts}
function examStart(){const items=buildExam();if(!items){alert('Ainda não há questões suficientes para essa distribuição.');return}if(db.exam&&!confirm('Já existe um simulado em andamento. Deseja começar outro e substituir o anterior?'))return;db.exam={ids:items.map(x=>x[0]),marks:{},flagged:[],started:Date.now(),duration:5*60*60*1000,finished:false};save();examOpen(0)}
function examOpen(i){if(!db.exam||db.exam.finished)return;tab='Simulados';const ex=db.exam;ex.current=Math.max(0,Math.min(ex.ids.length-1,i));save();const x=q.find(y=>y[0]===ex.ids[ex.current]);if(!x)return;const elapsed=Date.now()-ex.started;const left=Math.max(0,ex.duration-elapsed);if(!left){examFinish();return}const m=Math.floor(left/60000),secs=Math.floor(left%60000/1000);$('main').innerHTML=`<h2>Simulado completo · autoral</h2><p class="muted">Questão ${ex.current+1} de ${ex.ids.length} · Tempo restante aproximado: ${Math.floor(m/60)}h ${m%60}min ${secs}s</p><div class="card"><span class="pill">${esc(subjects[x[1]])}</span><h3>${esc(x[3])}</h3>${x[4].map((v,j)=>`<button class="choice ${ex.marks[x[0]]===j?'selected':''}" onclick="examMark(${j})"><b>${'ABCDE'[j]}.</b> ${esc(v)}</button>`).join('')}<div class="row"><button class="btn" onclick="examOpen(${ex.current-1})" ${ex.current===0?'disabled':''}>Anterior</button><button class="btn primary" onclick="examOpen(${ex.current+1})" ${ex.current===ex.ids.length-1?'disabled':''}>Próxima</button></div><p><button class="btn" onclick="examFlag()">${ex.flagged.includes(x[0])?'★ Marcada para revisar':'☆ Marcar para revisar'}</button></p></div><div class="card"><b>Cartão-resposta</b><div class="exam-grid">${ex.ids.map((id,j)=>`<button class="exam-num ${ex.marks[id]!==undefined?'answered':''} ${ex.flagged.includes(id)?'flagged':''}" onclick="examOpen(${j})">${j+1}</button>`).join('')}</div><p class="muted tiny">${Object.keys(ex.marks).length} de 70 respondidas. Nenhum gabarito é exibido durante a prova.</p><button class="btn" onclick="go('Início')">Pausar visualização</button> <button class="btn primary" onclick="examFinishConfirm()">Finalizar e corrigir</button></div>`}

function examFlag(){const ex=db.exam;if(!ex)return;const id=ex.ids[ex.current];ex.flagged=ex.flagged.includes(id)?ex.flagged.filter(x=>x!==id):[...ex.flagged,id];save();examOpen(ex.current)}
function examFinishConfirm(){const ex=db.exam;if(!ex)return;const unanswered=70-Object.keys(ex.marks).length;if(unanswered&&!confirm(`Ainda há ${unanswered} questões sem resposta. Finalizar mesmo assim?`))return;examFinish()}
function examFinish(){const ex=db.exam;if(!ex)return;const items=ex.ids.map(id=>q.find(x=>x[0]===id));const marks=ex.marks;const groups=[{name:'Português',arr:items.filter(x=>x[1]===0),min:8},{name:'Direito',arr:items.filter(x=>x[1]>=1&&x[1]<=6),min:15},{name:'Conhecimentos gerais',arr:items.filter(x=>x[1]>=7),min:null}];let total=0;const rows=groups.map(g=>{const correct=g.arr.filter(x=>marks[x[0]]===x[5]).length;total+=correct;return {...g,correct}});const passed=total>=35&&rows[0].correct>=8&&rows[1].correct>=15;const attempt={date:new Date().toLocaleString('pt-BR'),correct:total,total:70,type:'exam',breakdown:rows.map(r=>({name:r.name,correct:r.correct,total:r.arr.length})),answers:ex.ids.map(id=>({id,selected:marks[id]??null}))};db.sessions.push(attempt);for(const x of items){const selected=marks[x[0]];if(selected!==undefined){const a={id:x[0],correct:selected===x[5],selected,date:new Date().toISOString()};db.answers.push(a);if(typeof scheduleReview==='function')scheduleReview(x[0],a.correct)}}db.exam=null;save();tab='Simulados';draw();$('main').innerHTML=`<h2>Resultado do simulado</h2><div class="card"><div class="stat">${total}/70</div><p>${rows.map(r=>`${r.name}: ${r.correct}/${r.arr.length}`).join(' · ')}</p><p><b>${passed?'Atingiu os mínimos configurados':'Não atingiu os mínimos configurados'}</b></p><p class="muted tiny">Critérios provisórios de treino, sujeitos à conferência do edital e retificações. Não representa aprovação real.</p><button class="btn primary" onclick="examReview(${db.sessions.length-1})">Conferir gabarito comentado</button></div>`}
function examReview(index){const s=db.sessions[index];if(!s||!s.answers)return;tab='Simulados';$('main').innerHTML=`<h2>Correção comentada</h2><button class="btn" onclick="go('Simulados')">Voltar</button>`+s.answers.map((a,i)=>{const x=q.find(y=>y[0]===a.id);return x?`<div class="card"><p class="muted tiny">${i+1}. ${esc(subjects[x[1]])} · ${esc(x[2])}</p><h3>${esc(x[3])}</h3><p>Sua resposta: <b>${a.selected===null?'Em branco':'ABCDE'[a.selected]}</b> · Correta: <b>${'ABCDE'[x[5]]}</b></p><p>${esc(x[6])}</p></div>`:''}).join('')}
const drawV10=draw;draw=function(){drawV10();if(tab==='Simulados'&&!queue.length){const m=$('main');const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>Simulado de 70 questões</h3><p>16 de Português, 30 de Direito e 24 de Conhecimentos Gerais. Questões autorais, sem repetição e sem gabarito durante a prova.</p><p class="muted tiny">Duração-alvo: 5 horas. Este treino objetivo não inclui a redação nem substitui a prova oficial.</p><button class="btn primary" onclick="examStart()">Iniciar simulado completo</button>${db.exam?'<button class="btn" onclick="examOpen(db.exam.current||0)">Retomar simulado</button>':''}`;m.prepend(card);const h=db.sessions.filter(x=>x.type==='exam');if(h.length){const history=document.createElement('div');history.className='card';history.innerHTML='<h3>Simulados concluídos</h3>'+db.sessions.map((x,i)=>x.type==='exam'?`<p>${esc(x.date)} — ${x.correct}/70 <button class="btn" onclick="examReview(${i})">Correção</button></p>`:'').join('');m.appendChild(history)}}if(tab==='Início'&&db.exam){const m=$('main');const c=document.createElement('div');c.className='card';c.innerHTML='<h3>Simulado em andamento</h3><p>Suas respostas estão salvas neste navegador.</p><button class="btn primary" onclick="examOpen(db.exam.current||0)">Retomar simulado</button>';m.prepend(c)}};

// v1.1 — aulas explicativas, preservando dados e questões anteriores.
const detailedLessons=[["Crase, regência e interpretação", "Crase é a fusão da preposição “a” com o artigo feminino “a” ou com determinados demonstrativos. Primeiro verifique se o termo anterior exige preposição; depois, se o termo seguinte admite artigo.", "Em “Dirigi-me à secretaria”, o verbo dirigir-se exige “a” e “secretaria” admite artigo: a + a = à. Já “fui a pé” não leva crase, pois “pé” é masculino.", "Troque o termo feminino por um masculino: se surgir “ao”, geralmente há crase. Não use esse teste mecanicamente com nomes próprios e locuções.", "Leia um parágrafo e identifique a tese, as relações entre frases e as inferências que realmente decorrem do texto."], ["Legalidade e crimes contra a Administração", "O princípio da legalidade impede que condutas sejam tratadas como crimes sem lei anterior que as defina. Na parte especial, é essencial distinguir a conduta do servidor, a exigência de vantagem e a solicitação de vantagem.", "No Código Penal, concussão envolve exigir vantagem indevida em razão da função (art. 316); corrupção passiva envolve solicitar, receber ou aceitar promessa de vantagem indevida (art. 317).", "A banca pode trocar “exigir” por “solicitar” para testar a distinção entre tipos penais. Leia o verbo do enunciado com atenção.", "Consulte os arts. 1º, 316 e 317 do Código Penal, conferindo o recorte do edital."], ["Inquérito policial e ação penal", "O inquérito policial é um procedimento administrativo de investigação voltado a reunir elementos sobre autoria e materialidade. Não é julgamento nem, por si só, ação penal.", "Uma notícia de crime pode iniciar diligências policiais; o Ministério Público avalia os elementos disponíveis para eventual oferecimento de denúncia nos casos de ação penal pública.", "Diferencie indícios investigativos de prova produzida sob contraditório judicial. Há exceções legais para provas cautelares, não repetíveis e antecipadas.", "Leia o art. 155 do CPP e os dispositivos de inquérito e ação penal exigidos no edital."], ["Prazos, citação e contraditório", "No processo civil, a citação convoca o réu, executado ou interessado a integrar a relação processual. O contraditório assegura ciência e oportunidade de manifestação.", "Para prazos processuais contados em dias, o art. 219 do CPC estabelece a contagem somente em dias úteis. Isso não significa que todo prazo de qualquer natureza seja contado assim.", "Antes de calcular um prazo, identifique se ele é processual, seu termo inicial e a existência de regra especial.", "Estude os arts. 9º, 10, 219 e 238 do CPC, observando o conteúdo exigido no edital."], ["Direitos fundamentais e Administração Pública", "O art. 5º da Constituição reúne direitos e garantias fundamentais. O art. 37 estabelece princípios expressos da Administração Pública: legalidade, impessoalidade, moralidade, publicidade e eficiência.", "Um ato administrativo que favorece uma pessoa por amizade pode contrariar a impessoalidade, mesmo quando formalmente divulgado.", "Memorize LIMPE, mas pratique a aplicação em casos concretos. Publicidade não significa divulgação irrestrita de dados pessoais.", "Consulte os arts. 5º e 37 da Constituição Federal."], ["Atos administrativos e seus princípios", "A Administração deve atuar dentro da lei e observar finalidade pública. A anulação é relacionada à ilegalidade; a revogação, em regra, à conveniência e oportunidade de ato válido, respeitados limites jurídicos.", "Um ato com vício de legalidade pode ser anulado; uma autorização válida pode, em certas condições, ser revogada por motivo de interesse público.", "Não confunda anulação com revogação, nem suponha que todo ato pode ser revogado. Atos vinculados e situações consolidadas exigem análise específica.", "Revise o art. 37 da Constituição e a jurisprudência aplicável, conforme o edital."], ["Como estudar as Normas da Corregedoria", "Normas internas disciplinam procedimentos administrativos e judiciais. A resposta correta depende da redação vigente e do artigo efetivamente incluído no edital.", "Ao encontrar uma regra sobre escrituração ou atendimento, registre: quem é responsável, qual providência é exigida, qual prazo existe e quais exceções se aplicam.", "Não decore resumos desatualizados. Confira o texto consolidado oficial e as retificações antes de memorizar artigos.", "A lista exata de artigos desta disciplina ainda precisa ser validada contra o Anexo VIII oficial."], ["Acessibilidade e barreiras", "A Lei Brasileira de Inclusão (Lei 13.146/2015) define acessibilidade e diferentes tipos de barreiras. Acessibilidade abrange o uso de espaços, serviços, informações e comunicação com segurança e autonomia.", "Uma repartição com rampa, mas sem atendimento comunicacional acessível, ainda pode apresentar barreiras à participação da pessoa com deficiência.", "A banca costuma explorar distinções entre barreiras arquitetônicas, urbanísticas, tecnológicas, de comunicação e atitudinais.", "Consulte o art. 3º da Lei 13.146/2015 e confira os demais dispositivos previstos no edital."], ["Porcentagem, razão e regra de três", "Porcentagem representa uma razão por cem. Para saber a porcentagem de uma parte em relação ao total, divida parte por total e multiplique por 100.", "Se 10 de 250 processos foram devolvidos, a taxa é (10 ÷ 250) × 100 = 4%. Um aumento de 15% sobre 200 produz 230.", "Aumento de 20% seguido de desconto de 20% não volta ao valor inicial: 100 → 120 → 96.", "Resolva exercícios com descontos sucessivos, médias e proporcionalidade direta e inversa."], ["Referências de células e segurança digital", "Em planilhas, referências relativas se deslocam quando a fórmula é copiada. O símbolo $ fixa a coluna, a linha ou ambas. Em segurança, autenticação multifator reduz o risco de invasão por senha vazada.", "Copiando =$A1+B$2 de C3 para D4, a fórmula passa a =$A2+C$2. A coluna A e a linha 2 permanecem fixas.", "Leia cada referência separadamente: $A1, A$1 e $A$1 têm comportamentos diferentes.", "Pratique Excel e identifique mensagens fraudulentas que tentam obter senhas e códigos."], ["Negação de proposições e equivalências", "Em lógica, negar uma afirmação universal exige um contraexemplo. A negação de “todos são P” é “existe pelo menos um que não é P”. Para uma conjunção, aplica-se a lei de De Morgan.", "A negação de “Ana estuda e Bruno trabalha” é “Ana não estuda ou Bruno não trabalha”. Não é necessário que as duas ações sejam falsas.", "Cuidado: negar “e” resulta em “ou”, e negar “ou” resulta em “e”, com a negação de cada parcela.", "Monte tabelas-verdade simples para confirmar equivalências e negações."]];

 const a=detailedLessons[i];if(!a)return;
 window.lessonIndex=i;tab='Aula';
 const chaptersHtml=(typeof chapters!=='undefined'&&chapters[i])?chapters[i].map(c=>'<span class="pill">'+esc(c[0])+'</span>').join(' '):'';
 $('main').innerHTML=`<button class="btn" onclick="go('Estudar')">← Voltar às disciplinas</button><div class="card" style="margin-top:14px"><span class="pill">Aula explicativa • material autoral</span><h2>${esc(subjects[i])}</h2><h3>${esc(a[0])}</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn ${lessonDepth==='simples'?'primary':''}" onclick="lessonDepth='simples';showDetailedLesson(${i})">Explicação simples</button><button class="btn ${lessonDepth==='aprofundada'?'primary':''}" onclick="lessonDepth='aprofundada';showDetailedLesson(${i})">Aprofundar</button></div><h3>Entenda o assunto</h3><p style="line-height:1.85">${esc(a[1])}</p><div class="notice"><b>Exemplo resolvido</b><p style="line-height:1.8">${esc(a[2])}</p></div><h3>Como isso aparece na prova</h3><p style="line-height:1.8">${esc(a[3])}</p>${lessonDepth==='aprofundada'?`<h3>Roteiro de aprofundamento</h3><p style="line-height:1.8">${esc(a[4])}</p><p class="muted tiny">Confira sempre a legislação vigente e o recorte do edital antes de utilizar referências normativas.</p>`:''}<h3>Capítulos relacionados</h3><div style="display:flex;flex-wrap:wrap;gap:7px">${chaptersHtml}</div><p class="muted tiny" style="margin-top:16px">Estas aulas são introdutórias, não equivalem à cobertura integral do edital nem substituem material jurídico revisado.</p><button class="btn primary" onclick="start(${i})">Praticar questões desta matéria →</button></div>`;

const fullCourse = [["Crase: aprenda a decidir", [["O que é crase", "Crase é a fusão da preposição a com o artigo feminino a (ou as). Não é simplesmente qualquer palavra feminina precedida de a. Em “Entreguei o formulário à servidora”, o verbo entregar pede a preposição a para indicar destinatário; “servidora” admite o artigo a. Daí a + a = à."], ["Método em três passos", "1. Descubra a regência: o verbo ou nome exige a preposição a? 2. Veja se o termo seguinte aceita artigo feminino a/as. 3. Se os dois ocorrerem, use à/às. Em “Começou a estudar”, o segundo termo é verbo, portanto não recebe artigo: sem crase."], ["Teste do masculino", "Troque o substantivo feminino por masculino equivalente: se aparecer “ao”, normalmente haverá crase no feminino. “Dirigiu-se à diretora” → “Dirigiu-se ao diretor”. O teste ajuda, mas não substitui a análise de regência."], ["Casos importantes", "Não há crase antes de verbos, de pronomes pessoais como ela, nem em expressões com palavras repetidas (“frente a frente”). Em locuções adverbiais femininas, como “à noite” e “às vezes”, geralmente ocorre crase. Antes de possessivo feminino singular, o uso pode ser facultativo quando o artigo também o for."], ["Exemplo resolvido", "“O servidor encaminhou o ofício ___ chefia e começou ___ revisar o processo.” A primeira lacuna é “à”: encaminhar algo a alguém, e chefia admite artigo. A segunda é “a”: revisar é verbo, não recebe artigo."], ["Armadilha de prova", "A banca costuma misturar regência, pronomes e locuções. Não decida só porque a palavra seguinte é feminina; identifique as duas ocorrências de a."]]], ["Direito Penal: legalidade e crimes", [["Princípio da legalidade", "O art. 1º do Código Penal estabelece: não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal. Isso significa que a punição criminal exige previsão legal anterior ao fato."], ["Anterioridade e taxatividade", "Uma lei penal incriminadora não pode, em regra, alcançar fatos anteriores à sua vigência. A descrição do crime deve ser suficientemente precisa; o julgador não pode criar crime por analogia em prejuízo do acusado."], ["Lei penal mais benéfica", "A Constituição, art. 5º, XL, determina que a lei penal não retroagirá, salvo para beneficiar o réu. Exemplo: se uma lei posterior deixa de considerar determinada conduta crime, isso pode repercutir sobre condenações anteriores, conforme as regras legais."], ["Estrutura de análise", "Ao ler uma situação, identifique: a conduta narrada, a data, a lei aplicável, os elementos do tipo penal e possíveis causas que afastem a ilicitude ou a culpabilidade. Evite concluir pelo nome popular do ato."], ["Exemplo resolvido", "Uma portaria administrativa cria uma “nova pena criminal”. Isso não basta: a definição de crimes e penas depende de lei em sentido exigido pelo princípio da legalidade."], ["Atenção", "Este capítulo introduz princípios gerais. Os artigos específicos de crimes exigidos pelo edital precisam ser conferidos no Anexo VIII."]]], ["Processo Penal: inquérito", [["Finalidade", "O inquérito policial é procedimento administrativo investigativo destinado à apuração de infração penal e de sua autoria. Ele não é sentença nem equivale ao processo judicial."], ["Investigação e ação penal", "A investigação busca elementos informativos. A ação penal é proposta pelo legitimado, observados os requisitos legais. Nem todo processo exige necessariamente inquérito prévio."], ["Contraditório e defesa", "O inquérito, em regra, não apresenta o contraditório pleno próprio da instrução judicial. Isso não elimina garantias constitucionais, direitos do investigado ou prerrogativas da defesa."], ["Exemplo", "A polícia colhe depoimentos e documentos para esclarecer uma ocorrência. Esse trabalho pode integrar o inquérito; a decisão sobre condenação compete ao Poder Judiciário, após o devido processo."], ["Como estudar", "Diferencie investigação, denúncia/queixa, recebimento da acusação e instrução. Confira os dispositivos do CPP indicados pelo edital."]]], ["Processo Civil: contagem de prazos", [["Regra central", "O art. 219 do CPC determina que, na contagem de prazo em dias, estabelecido por lei ou pelo juiz, computam-se somente os dias úteis. A regra aplica-se aos prazos processuais."], ["Começo e vencimento", "A contagem também depende das regras de início, publicação, intimação, suspensão e feriados. Não basta excluir sábados e domingos sem saber o termo inicial."], ["Exemplo didático", "Suponha prazo processual de 3 dias úteis, com início de contagem na terça-feira e sem feriados: terça, quarta e quinta correspondem aos três dias. O exemplo pressupõe que o termo inicial já foi determinado."], ["Pegadinha", "Não aplique automaticamente o art. 219 a prazos de natureza material. Identifique o tipo de prazo antes de contar."]]], ["Constitucional: direitos e garantias", [["Legalidade", "O art. 5º, II, da Constituição diz que ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de lei. É uma garantia contra imposições arbitrárias."], ["Administração e particulares", "Para o particular, a legalidade funciona como proteção da liberdade. Para a Administração Pública, a atuação deve observar a competência e os limites fixados pelo ordenamento jurídico."], ["Exemplo", "Uma ordem administrativa não pode criar, sem fundamento jurídico, uma obrigação incompatível com a lei. Em prova, examine a fonte e o alcance da obrigação."], ["Como revisar", "Compare legalidade, igualdade, devido processo legal e acesso à Justiça, sem confundir o texto de cada inciso constitucional."]]], ["Administrativo: princípios do art. 37", [["LIMPE", "O caput do art. 37 da Constituição explicita legalidade, impessoalidade, moralidade, publicidade e eficiência. A sigla LIMPE ajuda a memorizar, mas é preciso compreender cada princípio."], ["Diferenças", "Legalidade: agir conforme o ordenamento. Impessoalidade: finalidade pública e tratamento sem favorecimentos indevidos. Moralidade: probidade e ética administrativa. Publicidade: transparência, ressalvados sigilos legais. Eficiência: qualidade e boa utilização de recursos."], ["Exemplo resolvido", "Uma campanha institucional promove pessoalmente o agente público em vez de informar o cidadão. O problema envolve especialmente a impessoalidade, sem excluir eventual violação de outros princípios."], ["Pegadinha", "Nem todo princípio relevante está escrito no caput do art. 37. Autotutela e continuidade do serviço público são exemplos de princípios reconhecidos no Direito Administrativo."]]], ["Normas da Corregedoria: leitura orientada", [["O que são normas internas", "As Normas de Serviço da Corregedoria Geral da Justiça disciplinam rotinas e procedimentos administrativos e cartorários. A redação vigente e o recorte cobrado devem ser verificados nas fontes oficiais."], ["Como ler um artigo", "Identifique sujeito da obrigação, ação exigida, prazo, exceções e autoridade competente. Marque verbos como “deverá”, “poderá” e “é vedado”: eles alteram o sentido da norma."], ["Exemplo de técnica", "Ao encontrar “o servidor deverá registrar X”, pergunte quem registra, o que registra, quando, em qual sistema e se existem exceções. Não memorize um resumo sem conferir o dispositivo."], ["Limite desta aula", "Não reproduzo artigos específicos sem conferir a edição consolidada e o Anexo VIII. Esta é uma aula de método, não substitui a lei seca."]]], ["Atualidades e inclusão: acessibilidade", [["Conceito", "A Lei Brasileira de Inclusão (Lei 13.146/2015) define acessibilidade em relação à possibilidade e condição de alcance e utilização, com segurança e autonomia, de espaços, mobiliários, transportes, informação e comunicação, entre outros."], ["Barreiras", "Barreiras são entraves, obstáculos, atitudes ou comportamentos que limitem ou impeçam a participação social da pessoa com deficiência. Podem ser urbanísticas, arquitetônicas, nos transportes, nas comunicações, atitudinais e tecnológicas."], ["Exemplo", "Um serviço digital incompatível com leitor de tela pode impor barreira tecnológica. Acessibilidade não se limita à construção de rampas."], ["Atualidades", "Para fatos recentes, registre data e fonte confiável. Notícias mudam; esta parte deve ser atualizada e vinculada ao período efetivamente cobrado no edital."]]], ["Matemática: porcentagem sem decorar", [["Conceito", "Porcentagem significa “por cento”: 10% = 10/100 = 0,10. Para descobrir quanto uma parte representa do total, divida parte por total e multiplique por 100."], ["Exemplo resolvido", "Você tem 250 unidades e separa 10: 10 ÷ 250 = 0,04; 0,04 × 100 = 4%. Confira: 4% de 250 = 10."], ["Aumento e desconto", "Um aumento de 20% multiplica o valor por 1,20. Um desconto de 20% multiplica por 0,80. Aumentar 20% e depois diminuir 20% não retorna ao valor inicial: 100 → 120 → 96."], ["Variação percentual", "Se uma previsão era 8.000 e o resultado foi 9.200, a diferença é 1.200. Variação = 1.200 ÷ 8.000 × 100 = 15%. O denominador é a base de comparação."], ["Armadilha", "“10% de 250” pede 250 × 0,10 = 25. “10 é quantos por cento de 250?” pede 10 ÷ 250 × 100 = 4%. São perguntas diferentes."]]], ["Informática: referências do Excel", [["Três tipos de referência", "A1 é relativa: coluna e linha mudam ao copiar. $A$1 é absoluta: ambas ficam fixas. $A1 fixa só a coluna; A$1 fixa só a linha."], ["Deslocamento", "Copiar de C5 para E8 significa deslocar 2 colunas à direita e 3 linhas para baixo. Referências relativas acompanham esse deslocamento; as partes com cifrão permanecem fixas."], ["Exemplo resolvido", "Em C5: =$A5+B$2+$D$4. Copiando para E8, resulta =$A8+D$2+$D$4. A linha 5 vira 8; a coluna B vira D; D4 permanece absoluta."], ["Pegadinha", "O cifrão antes da letra fixa a coluna; antes do número fixa a linha. Uma fórmula pode combinar partes relativas, mistas e absolutas."]]], ["Raciocínio lógico: quantificadores", [["Todos e algum", "“Todos os processos foram conferidos” significa que cada processo do universo considerado foi conferido. Para negar, basta existir pelo menos um processo não conferido."], ["Negação correta", "Negação de “Todos são P”: “Pelo menos um não é P”. Negação de “Existe algum P”: “Nenhum é P”. Negar não significa trocar automaticamente “todos” por “nenhum”."], ["Exemplo resolvido", "Afirmação: “Todos os servidores chegaram cedo”. Negação: “Ao menos um servidor não chegou cedo”. Mesmo que muitos tenham chegado cedo, a negação pode ser verdadeira."], ["Conectivos", "A negação de “P e Q” é “não P ou não Q”; a negação de “P ou Q” é “não P e não Q” (considerando ou inclusivo). São as leis de De Morgan."]]]];
