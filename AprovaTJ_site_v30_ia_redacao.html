digitalModules.push(...[{"d":0,"title":"Português — período composto: coordenação e subordinação","time":55,"parts":[["O que é uma oração","Oração é uma estrutura organizada em torno de verbo ou locução verbal. Em “O servidor conferiu os autos e registrou a movimentação”, há dois núcleos verbais e duas orações. Período simples possui uma oração; período composto, duas ou mais. A contagem deve considerar locuções como “vai analisar” como um único núcleo."],["Coordenação: independência sintática","Orações coordenadas não exercem função sintática umas em relação às outras. Em “Estudou bastante, mas errou a questão”, a segunda contrapõe a primeira. Coordenadas sindéticas classificam-se em aditivas (e), adversativas (mas), alternativas (ou), conclusivas (portanto) e explicativas (porque, pois, conforme o contexto)."],["Subordinação substantiva","Uma oração subordinada substantiva desempenha papel semelhante ao de um substantivo: “É necessário que todos compareçam”. A oração “que todos compareçam” funciona como sujeito de “é necessário”. Teste útil: substitua toda a oração por “isso”: “Isso é necessário”."],["Subordinação adjetiva","A oração adjetiva caracteriza um nome antecedente: “Os candidatos que estudaram passaram”. Sem vírgulas, é restritiva: delimita quais candidatos. “Os candidatos, que estudaram, passaram” tem leitura explicativa: a informação sobre estudar é apresentada como adicional. A pontuação altera o sentido."],["Subordinação adverbial","A oração adverbial expressa circunstâncias como causa, condição, concessão, finalidade e tempo. “Embora estivesse cansado, revisou o conteúdo” é concessiva: o cansaço não impediu a revisão. “Se houver tempo, revisará” é condicional. A classificação depende da relação de sentido, não apenas da conjunção."],["Questão resolvida","Em “Embora o sistema estivesse lento, o escrevente concluiu o cadastro”, a oração iniciada por “embora” é concessiva, não causal. A lentidão representa obstáculo superado. Substituir “embora” por “porque” muda a relação lógica."],["Armadilhas da banca","“Pois” pode ser explicativo ou conclusivo conforme a posição e o contexto. “Como” pode indicar causa, comparação ou conformidade. Não decore uma equivalência rígida entre conectivo e classificação; interprete a frase inteira."],["Fixação","Classifique: (a) “Não saiu porque chovia”; (b) “Saiu, embora chovesse”; (c) “Disse que voltaria”. Respostas: causal, concessiva e subordinada substantiva objetiva direta, respectivamente."]]},{"d":0,"title":"Português — vozes verbais e partícula se","time":55,"parts":[["Voz ativa e passiva","Na voz ativa, o sujeito pratica a ação: “O servidor assinou o documento”. Na passiva analítica, o sujeito sofre a ação: “O documento foi assinado pelo servidor”. A mudança conserva o conteúdo essencial, mas desloca o foco da informação."],["Passiva sintética","Forma-se geralmente com verbo transitivo direto ou direto e indireto mais “se”: “Publicaram-se os editais”. “Os editais” é sujeito paciente e o verbo concorda com ele. Equivale a “Os editais foram publicados”."],["Índice de indeterminação do sujeito","Com verbo intransitivo, transitivo indireto ou de ligação, “se” pode indeterminar o sujeito: “Precisa-se de servidores”. O verbo permanece na terceira pessoa do singular. “De servidores” é objeto indireto, não sujeito."],["Contraste essencial","“Vendem-se apartamentos” admite “Apartamentos são vendidos”: passiva sintética e concordância no plural. “Necessita-se de apartamentos” não admite essa transformação: sujeito indeterminado e verbo no singular."],["Voz reflexiva","Em “O candidato se preparou”, o sujeito pratica e recebe a ação em sentido reflexivo. Nem todo “se” indica passiva ou indeterminação; observe a transitividade e o sentido."],["Exemplo comentado","Questão: “Alugam-se salas” está correto? Sim, porque “salas” é sujeito paciente plural. “Aluga-se salas” seria inadequado na norma-padrão quando “se” é partícula apassivadora."],["Treino","Complete: “___-se documentos” (arquiva/arquivam). Resposta: “Arquivam-se documentos”, porque “documentos” é sujeito paciente plural."],["Revisão","Teste primeiro se existe transformação natural para “ser + particípio”. Se sim, provavelmente há passiva sintética; se não, analise a indeterminação do sujeito ou outra função do pronome."]]},{"d":1,"title":"Direito Penal — tipicidade, ilicitude e culpabilidade","time":55,"parts":[["Estrutura analítica do crime","Na concepção tripartida frequentemente utilizada no ensino, crime é fato típico, ilícito e culpável. Há divergências doutrinárias, portanto a redação da questão e a abordagem exigida importam. O fato típico costuma envolver conduta, resultado quando exigido, nexo causal e tipicidade."],["Tipicidade","Tipicidade é a adequação do fato ao modelo legal incriminador. Não basta considerar uma conduta reprovável: em Direito Penal, a criminalização depende de lei anterior que defina o crime. Uma conduta pode ser socialmente censurável sem corresponder a um tipo penal."],["Dolo e culpa","O art. 18 do Código Penal distingue crime doloso, quando o agente quis o resultado ou assumiu o risco de produzi-lo, e culposo, quando deu causa ao resultado por imprudência, negligência ou imperícia. Crime culposo só é punível quando houver previsão expressa."],["Excludentes de ilicitude","O art. 23 do CP prevê estado de necessidade, legítima defesa, estrito cumprimento de dever legal e exercício regular de direito. A presença de uma dessas hipóteses pode afastar a ilicitude, sem eliminar necessariamente a ocorrência material do fato."],["Legítima defesa","Conforme art. 25 do CP, exige-se reação moderada, com meios necessários, contra injusta agressão atual ou iminente a direito próprio ou alheio. Não se confunde com vingança posterior à agressão. O excesso doloso ou culposo pode gerar responsabilização."],["Culpabilidade e erro","Culpabilidade envolve a possibilidade de reprovação pessoal. O erro de proibição inevitável isenta de pena; se evitável, pode diminuí-la, conforme art. 21 do CP. Não confunda erro de proibição com erro de tipo, disciplinado no art. 20."],["Exemplo resolvido","Alguém reage a uma agressão atual usando meios necessários moderadamente. A análise pode conduzir à legítima defesa. Se a agressão cessou e a pessoa passa a atacar por retaliação, a justificativa deixa de se aplicar aos novos atos."],["Atenção Vunesp","A banca pode trocar “atual ou iminente” por “passada ou futura” ou suprimir a exigência de moderação. Leia os elementos cumulativos das excludentes e confira a literalidade legal."]]},{"d":2,"title":"Processo Penal — ação penal e condições de procedibilidade","time":55,"parts":[["O que é ação penal","Ação penal é o instrumento para provocar a jurisdição criminal. O CPP diferencia ação penal pública, promovida pelo Ministério Público, e ação penal privada, promovida pelo ofendido ou legitimado, conforme previsão legal."],["Ação penal pública","A ação penal pública é, em regra, incondicionada. Em hipóteses legais, depende de representação do ofendido ou requisição do Ministro da Justiça. A representação não transforma o Ministério Público em mero representante da vítima."],["Representação","A representação manifesta a vontade de autorizar a persecução quando exigida por lei. O prazo decadencial, em regra, é de seis meses contados do conhecimento da autoria, ressalvadas disposições específicas. Confira o art. 38 do CPP e a lei do delito."],["Ação penal privada","Na ação privada, o ofendido apresenta queixa-crime. Não confunda queixa com notícia-crime ou representação. A iniciativa privada não significa que o processo deixa de ser jurisdicional ou que o Ministério Público não tenha as funções previstas em lei."],["Princípios e exceções","Na ação penal pública, estudam-se obrigatoriedade e indisponibilidade, com as soluções consensuais e exceções legalmente previstas. Na privada, aparecem oportunidade e disponibilidade, além de institutos como renúncia, perdão e perempção."],["Decadência e prescrição","Decadência refere-se à perda do direito de agir ou representar dentro de prazo legal; prescrição incide sobre a pretensão punitiva ou executória conforme o Código Penal. Os termos não são sinônimos."],["Exemplo resolvido","Uma questão afirma que toda ação penal pública exige representação da vítima. Está errada: a regra é a ação pública incondicionada; a exigência de representação depende de previsão legal."],["Fixação","Pergunta: quem oferece denúncia na ação penal pública? O Ministério Público. Quem apresenta queixa-crime na ação penal privada? O ofendido ou legitimado. Verifique sempre exceções previstas em lei."]]},{"d":3,"title":"Processo Civil — citação, intimação e nulidades","time":55,"parts":[["Citação","Nos termos do CPC, citação é o ato pelo qual são convocados o réu, o executado ou o interessado para integrar a relação processual (art. 238). Sua regularidade é fundamental ao contraditório."],["Intimação","Intimação é o ato pelo qual se dá ciência a alguém dos atos e termos do processo (art. 269). A distinção central é funcional: citação chama para integrar o processo; intimação comunica atos e termos."],["Efeitos e comparecimento","O comparecimento espontâneo do réu ou executado supre a falta ou nulidade da citação, observados os efeitos e o termo inicial para defesa do art. 239, §1º, do CPC. Não generalize para toda nulidade processual."],["Formas de comunicação","O CPC disciplina comunicação eletrônica e outras modalidades de citação e intimação. As regras sofreram alterações legislativas; para prazos e prioridades, confira a redação atualizada dos dispositivos aplicáveis."],["Nulidades processuais","Nem todo defeito formal leva automaticamente à anulação. O CPC valoriza finalidade do ato, contraditório e ausência ou presença de prejuízo, conforme as regras específicas. O estudo deve distinguir irregularidade, nulidade e saneamento."],["Exemplo resolvido","“O autor foi intimado da sentença” descreve ciência de um ato. “O réu foi citado para integrar a relação processual” descreve chamamento inicial. Trocar esses termos em prova pode tornar a alternativa incorreta."],["Armadilhas","Não confunda citação com publicação, intimação com conclusão, ou ciência do advogado com ciência pessoal quando a lei exigir esta última. Identifique destinatário, meio e efeito do ato."],["Revisão","Monte uma tabela com: finalidade, destinatário, momento e consequência da falta. Releia CPC arts. 238, 239 e 269 antes de memorizar prazos especiais."]]},{"d":4,"title":"Direito Constitucional — controle de constitucionalidade","time":55,"parts":[["Supremacia constitucional","A Constituição ocupa posição superior no ordenamento. Leis e atos normativos devem ser compatíveis com ela. O controle de constitucionalidade examina essa compatibilidade por procedimentos e órgãos previstos no sistema jurídico."],["Controle difuso","No controle difuso, a questão constitucional pode surgir incidentalmente em um caso concreto, no âmbito de competência de juízes e tribunais. Em tribunais, atenção à reserva de plenário do art. 97 da Constituição e à jurisprudência aplicável."],["Controle concentrado","No controle concentrado, ações específicas levam diretamente ao tribunal competente a discussão abstrata sobre constitucionalidade, com legitimidade e requisitos próprios. No âmbito federal, o STF julga ações como ADI e ADC nos termos constitucionais."],["ADI e ADC","A ação direta de inconstitucionalidade busca a declaração de incompatibilidade de norma com a Constituição; a ação declaratória de constitucionalidade busca confirmação de constitucionalidade nos casos legalmente previstos. Os requisitos não são intercambiáveis."],["Efeitos das decisões","As decisões em controle concentrado podem ter eficácia contra todos e efeito vinculante conforme a Constituição e legislação. A modulação de efeitos depende dos pressupostos legais; não é consequência automática de qualquer decisão."],["Reserva de plenário","O art. 97 da CF exige voto da maioria absoluta dos membros do tribunal ou do órgão especial para declarar inconstitucionalidade de lei ou ato normativo do Poder Público, ressalvadas situações tratadas pela jurisprudência."],["Exemplo resolvido","Afirmar que um juiz de primeira instância nunca pode examinar constitucionalidade é incorreto: existe controle difuso. Outra coisa é dizer que esse juiz pode julgar ADI federal originariamente, o que não corresponde à competência constitucional."],["Revisão","Compare difuso e concentrado segundo: objeto, via processual, órgão competente, legitimidade e efeitos. Evite decorar efeitos sem observar o tipo de decisão."]]},{"d":5,"title":"Direito Administrativo — licitações e contratos: fundamentos","time":55,"parts":[["Por que licitar","A licitação é procedimento destinado a selecionar proposta apta a gerar resultado vantajoso para a Administração, assegurando isonomia e observância das regras legais. A Lei 14.133/2021 é referência central, sujeita às regras de âmbito e transição pertinentes."],["Princípios","A Lei 14.133/2021 enumera princípios como legalidade, impessoalidade, moralidade, publicidade, eficiência, planejamento, transparência, segregação de funções e julgamento objetivo. Segregação procura reduzir risco de erros e fraudes por concentração de tarefas incompatíveis."],["Fases da licitação","O art. 17 estabelece sequência de fases, incluindo preparatória, divulgação do edital, apresentação de propostas e lances quando cabível, julgamento, habilitação, recursal e homologação. Há possibilidades legais de alteração da ordem em hipóteses específicas."],["Modalidades","Pregão, concorrência, concurso, leilão e diálogo competitivo são modalidades previstas no art. 28. Modalidade não é a mesma coisa que critério de julgamento; menor preço e técnica e preço, por exemplo, são critérios."],["Contratação direta","Dispensa e inexigibilidade não são sinônimos. Na inexigibilidade, há inviabilidade de competição nas hipóteses legais. Na dispensa, a lei permite contratação direta em situações previstas, mesmo quando a competição poderia ser viável."],["Agentes e fiscalização","A lei distribui atribuições entre agentes e prevê controles e fiscalização da execução contratual. Não se deve concentrar, sem cautela, funções de autorização, execução e controle na mesma pessoa."],["Exemplo resolvido","Questão: “Menor preço é modalidade de licitação”. Errado. É critério de julgamento. “Pregão é modalidade” está correto. Essa distinção aparece frequentemente em alternativas aparentemente semelhantes."],["Cuidado com o edital","Este capítulo é complementar: a incidência exata da Lei 14.133/2021 depende do conteúdo programático oficial do concurso. Não presuma que todos os seus artigos serão cobrados."]]},{"d":8,"title":"Matemática — estatística: média, mediana e moda","time":55,"parts":[["Média aritmética","Some os valores e divida pela quantidade. Para 5, 7 e 12: média = (5+7+12)/3 = 8. A média é sensível a valores extremos, o que pode distorcer a percepção do conjunto."],["Média ponderada","Quando cada valor possui peso, calcule soma dos produtos dividida pela soma dos pesos. Notas 6 com peso 2 e 9 com peso 3: (6×2+9×3)/(2+3)=39/5=7,8."],["Mediana","Ordene os valores. Se a quantidade for ímpar, escolha o termo central; se par, faça a média dos dois centrais. Em 2, 4, 9, 11, a mediana é (4+9)/2=6,5."],["Moda","É o valor mais frequente. Em 2, 2, 3, 4, 4, 4, 5, a moda é 4. Um conjunto pode não ter moda ou apresentar mais de uma moda."],["Amplitude","Amplitude total é a diferença entre o maior e o menor valor. Para 3, 8, 10 e 15, a amplitude é 15−3=12. Não confunda amplitude com desvio padrão."],["Questão resolvida","Os tempos de atendimento foram 4, 5, 5, 6 e 20 minutos. Média = 40/5=8; mediana = 5; moda = 5. O atendimento de 20 minutos elevou a média, mas não a mediana."],["Erros frequentes","Para mediana, ordene antes. Para média ponderada, divida pela soma dos pesos, não pela quantidade de notas. Para moda, conte frequências, não magnitude."],["Treino","Dados 1, 3, 3, 7, 11: média 5, mediana 3, moda 3, amplitude 10. Refaça os cálculos sem olhar as respostas."]]},{"d":9,"title":"Informática — Excel: CONT.SE, SOMASE e SE com exemplos","time":55,"parts":[["Referências relativas e absolutas","A1 muda ao copiar fórmula; $A$1 fixa linha e coluna; $A1 fixa a coluna; A$1 fixa a linha. Em =$A2+B$1 copiada uma coluna à direita e duas linhas abaixo, a fórmula vira =$A4+C$1."],["Função SE","=SE(A2>=7;\"Aprovado\";\"Revisar\") retorna “Aprovado” se A2 for pelo menos 7; caso contrário, “Revisar”. Os separadores podem variar conforme idioma e configuração do Excel."],["CONT.SE","=CONT.SE(B2:B10;\"Pago\") conta células do intervalo B2:B10 cujo conteúdo atende ao critério “Pago”. Não soma valores monetários: conta ocorrências."],["SOMASE","=SOMASE(A2:A10;\"Material\";B2:B10) soma os valores em B2:B10 cujas linhas correspondentes em A2:A10 contenham “Material”. Intervalo de critério e intervalo de soma têm funções distintas."],["SOMA e MÉDIA","=SOMA(C2:C6) adiciona os números do intervalo. =MÉDIA(C2:C6) calcula a média dos valores numéricos, observando as regras da função quanto a células vazias e textos."],["Erros típicos","#DIV/0! costuma indicar divisão por zero; #N/D pode indicar valor não encontrado em buscas; #REF! indica referência inválida. Não confunda erro de fórmula com resultado lógico FALSO."],["Exemplo resolvido","A2:A4 contém “Papel”, “Caneta”, “Papel”; B2:B4 contém 10, 7 e 5. =CONT.SE(A2:A4;\"Papel\") retorna 2. =SOMASE(A2:A4;\"Papel\";B2:B4) retorna 15."],["Fixação","Se A1=12, a fórmula =SE(A1>10;\"Maior\";\"Menor ou igual\") retorna “Maior”. Se a fórmula for copiada para outra linha, confira quais referências são relativas."]]},{"d":10,"title":"Raciocínio Lógico — tabelas-verdade e equivalências","time":55,"parts":[["Proposição","Uma proposição é enunciado declarativo que admite valor verdadeiro ou falso. Perguntas e ordens, em geral, não são proposições. Letras p e q representam proposições simples."],["Negação","¬p inverte o valor lógico de p. Se p é verdadeira, ¬p é falsa. A negação de “Todos compareceram” é “Pelo menos um não compareceu”, e não “Ninguém compareceu”."],["Conjunção","p ∧ q (“p e q”) só é verdadeira quando ambas são verdadeiras. Se uma é falsa, a conjunção é falsa. Exemplo: “Estudei e fiz a prova” exige que as duas afirmações ocorram."],["Disjunção inclusiva","p ∨ q (“p ou q”, inclusivo) só é falsa quando ambas são falsas. Em lógica proposicional clássica, pode ser verdadeira quando as duas são verdadeiras; a linguagem cotidiana nem sempre segue esse uso."],["Condicional","p → q é falsa apenas quando p é verdadeira e q é falsa. É equivalente a ¬p ∨ q e à contrapositiva ¬q → ¬p. Não equivale, em geral, à conversa q → p."],["Leis de De Morgan","¬(p ∧ q) equivale a ¬p ∨ ¬q; ¬(p ∨ q) equivale a ¬p ∧ ¬q. Ao negar “João estuda e trabalha”, obtenha “João não estuda ou não trabalha”."],["Exemplo resolvido","Negue: “Se há expediente, então o sistema funciona”. A negação de p → q é p ∧ ¬q: “Há expediente e o sistema não funciona”. Não basta inverter as duas partes."],["Exercício","Se p=V e q=F, calcule p∧q=F, p∨q=V, p→q=F, q→p=V. Monte as quatro linhas da tabela para confirmar."]]},{"d":7,"title":"Atualidades — leitura crítica de indicadores econômicos","time":55,"parts":[["Inflação","Inflação é aumento generalizado e persistente do nível de preços. Um índice positivo menor do que antes indica desaceleração da inflação, não necessariamente queda dos preços. Deflação é variação negativa do nível geral de preços no período."],["PIB","Produto Interno Bruto mede o valor de bens e serviços finais produzidos em determinado território e período. Crescimento do PIB não implica automaticamente distribuição igualitária de renda ou melhoria uniforme de qualidade de vida."],["Taxa de desemprego","A taxa de desocupação relaciona pessoas desocupadas à força de trabalho, segundo metodologia da pesquisa. Não equivale à proporção de toda a população que não trabalha; estudantes fora da força de trabalho, por exemplo, exigem análise distinta."],["Juros","Taxas de juros influenciam crédito, consumo, investimentos e financiamento público. Não é correto afirmar que qualquer aumento de juros reduz instantaneamente todos os preços ou resolve sozinho problemas econômicos."],["Porcentagem e pontos percentuais","Se um indicador vai de 8% a 10%, cresce 2 pontos percentuais, mas a variação relativa é 25%: (10−8)/8×100. Essa distinção é recorrente em interpretação de notícias."],["Fonte e data","Para uma questão de atualidades, observe a data da notícia, o período de referência do indicador e o órgão que produziu a informação. Dado antigo não deve ser tratado como situação presente."],["Exemplo resolvido","Uma reportagem afirma que a inflação anual caiu de 6% para 4%. Isso representa queda da taxa de inflação em 2 pontos percentuais, mas não significa, por si só, que o nível de preços caiu."],["Revisão","Ao ler um gráfico, identifique eixo, unidade, período, fonte e base de comparação. Diferencie correlação de causalidade e evite inferir conclusões não sustentadas pelos dados."]]},{"d":6,"title":"Legislação institucional — como ler normas cartorárias com precisão","time":55,"parts":[["O papel das normas","As normas de serviço detalham rotinas e responsabilidades de unidades judiciais. Para concurso, é essencial estudar os dispositivos efetivamente listados no edital, pois numeração, redação e organização podem sofrer atualizações."],["Identificação de sujeitos","Em cada artigo, sublinhe quem pratica o ato: juiz, escrevente, escrivão, chefe de seção, unidade ou usuário externo. A banca pode manter a ação correta e alterar apenas o responsável."],["Verbos normativos","“Deverá” indica comando; “poderá”, faculdade condicionada; “é vedado”, proibição. Uma alternativa que troca obrigação por possibilidade pode inverter o sentido do dispositivo."],["Sequência de atos","Protocolo, autuação, juntada, conclusão, publicação, intimação e arquivamento não são equivalentes. Desenhe o fluxo da rotina para entender o momento de cada providência."],["Prazos","Para qualquer prazo, registre termo inicial, unidade de contagem, destinatário e eventual exceção. Não importe automaticamente regras de prazos processuais para procedimentos administrativos internos."],["Exceções e ressalvas","Termos como “salvo”, “exceto”, “mediante autorização” e “preferencialmente” são decisivos. Monte fichas com regra, exceção e autoridade competente."],["Exemplo hipotético","Se uma norma fictícia disser “O servidor deverá registrar a ocorrência no primeiro dia útil, salvo indisponibilidade”, seria incorreto dizer “poderá registrar em dois dias corridos”. O exemplo serve apenas para treinar leitura, não descreve norma real do TJ-SP."],["Limite deste capítulo","Este é um método de leitura, não uma reprodução das Normas de Serviço da CGJ. Aulas sobre artigos concretos exigem a lista oficial consolidada do edital e o texto normativo atualizado."]]}]);

function renderSubjectHome(){tab='Estudar';selectedStudySubject=null;const read=readChapters();document.getElementById('main').innerHTML=`<h2>📚 Estudar por matéria</h2><p class="muted">Escolha uma disciplina para ler os capítulos em ordem e responder às questões. A Biblioteca Virtual continua disponível para pesquisa.</p><div class="card"><button class="btn primary" onclick="renderDigitalLibrary()">🔎 Pesquisar na Biblioteca Virtual</button></div><div class="subject-grid">${subjects.map((name,i)=>{const items=chaptersOfSubject(i);const done=items.filter(a=>read[a.index]).length;const percent=items.length?Math.round(done/items.length*100):0;return `<button class="subject-tile" onclick="renderSubjectChapters(${i})"><div class="subject-caption">MATÉRIA ${String(i+1).padStart(2,'0')}</div><h3>${esc(name)}</h3><div class="subject-caption">${items.length} capítulos • ${done} lidos</div><div class="subject-meter"><div style="width:${percent}%"></div></div><div class="subject-caption" style="margin-top:7px">${percent}% de leitura registrada</div></button>`}).join('')}</div><p class="muted tiny">O progresso mede capítulos marcados como lidos, não o domínio da matéria. O conteúdo ainda está em desenvolvimento e não foi integralmente validado contra o edital.</p>`}
function renderSubjectChapters(i){if(!subjects[i])return;selectedStudySubject=i;tab='Materia';const items=chaptersOfSubject(i),read=readChapters();const done=items.filter(a=>read[a.index]).length;document.getElementById('main').innerHTML=`<button class="btn subject-back" onclick="renderSubjectHome()">← Todas as matérias</button><h2>${esc(subjects[i])}</h2><p class="muted">${items.length} capítulos disponíveis • ${done} marcados como lidos</p><div class="card"><h3>Índice da apostila</h3>${items.length?items.map(({x,index},j)=>`<div class="subject-chapter"><div><div class="subject-caption">Capítulo ${j+1} • ${x.time} min estimados</div><b>${esc(x.title)}</b><div class="subject-caption">${x.parts.length} seções ${read[index]?'• ✓ Lido':''}</div></div><button class="btn ${read[index]?'':'primary'}" onclick="openDigitalLesson(${index})">${read[index]?'Revisar':'Ler'}</button></div>`).join(''):'<p>Os capítulos desta matéria ainda estão sendo preparados.</p>'}</div><button class="btn" onclick="start(${i})">Resolver questões da matéria</button>`;window.scrollTo(0,0)}
const drawBeforeSubjects=draw;
draw=function(){if(tab==='Estudar'){document.getElementById('nav').innerHTML=navs.map(n=>`<button class="${tab===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('');renderSubjectHome();return;}if(tab==='Materia'){if(selectedStudySubject!==null)renderSubjectChapters(selectedStudySubject);return;}drawBeforeSubjects();};
const openLessonBeforeSubjects=openDigitalLesson;
openDigitalLesson=function(i){selectedStudySubject=digitalModules[i]?.d??null;openLessonBeforeSubjects(i);const first=document.querySelector('#main > button');if(first&&selectedStudySubject!==null){first.textContent='← Voltar aos capítulos de '+subjects[selectedStudySubject];first.setAttribute('onclick',`saveReaderPosition();activeReader=null;renderSubjectChapters(${selectedStudySubject})`);} };
const markReadBeforeSubjects=markDigitalRead;
markDigitalRead=function(i){markReadBeforeSubjects(i)};

document.title='AprovaTJ 2.1 — Apostila por matérias';draw();
</script>

<script>
// v2.2: capitulos aprofundados, integrados ao indice por materia.
digitalModules.push(...[{"d": 0, "title": "Crase — guia completo com decisões e exceções", "time": 56, "parts": [["Entenda o fenômeno", "Crase é a fusão da preposição a com o artigo feminino a ou com o a inicial de determinados demonstrativos. A grafia à registra essa fusão. O acento não é colocado por causa de uma palavra feminina isoladamente: primeiro é preciso verificar se o termo anterior exige a preposição e se o termo seguinte admite o artigo."], ["Teste do masculino", "Troque a palavra feminina por uma masculina equivalente. Se surgir ao, normalmente haverá à: “Entreguei o formulário à diretora” → “ao diretor”. O teste é uma pista prática, mas não substitui a análise da regência. “Começou a estudar” não leva crase: estudar é verbo, e não há artigo feminino."], ["Horas e locuções", "Em “A reunião começará às 14 horas”, a indicação de horário determinado costuma exigir crase. Em locuções adverbiais femininas como “à noite”, “às vezes” e “à direita”, usa-se o acento. Atenção: “a partir de” não leva crase, pois partir é verbo."], ["Casos proibidos", "Em regra, não se usa crase antes de palavras masculinas, verbos, pronomes pessoais e artigos indefinidos. Exemplos: “a prazo”, “a analisar”, “a ela”, “a uma pessoa”. Em “frente a frente”, não se coloca acento; a repetição de palavras afasta a construção com artigo."], ["Casos facultativos", "O uso pode ser facultativo antes de nome próprio feminino que admita artigo, antes de possessivo feminino singular acompanhado de substantivo e depois da preposição até, quando o artigo for possível. Exemplo: “Enviei a carta a/à Maria” pode variar conforme o uso do artigo. Em provas, observe a construção e a norma adotada."], ["Questão comentada", "Analise: I. “Compareceu à reunião.” II. “Começou à trabalhar.” III. “Chegou às oito horas.” Apenas I e III estão corretas. Em II, trabalhar é verbo e não admite artigo. Para resolver, localize a exigência da preposição e a possibilidade do artigo."], ["Revisão ativa", "Explique em voz alta: por que “à diretora” tem crase e “a ela” não? Reescreva três frases de sua rotina com horários, locuções e verbos. Depois resolva questões que misturem usos obrigatórios, proibidos e facultativos."]]}, {"d": 0, "title": "Interpretação textual — inferência, pressuposto e sentido", "time": 56, "parts": [["Informação explícita", "A resposta literal está diretamente no texto. Evite marcar alternativa apenas porque parece verdadeira no mundo real. Em prova, uma afirmação só é sustentada se o texto a autorizar."], ["Inferência", "Inferir é concluir algo que não foi declarado literalmente, mas decorre das informações. Se o texto afirma que “a procura aumentou apesar do preço”, pode-se inferir que o preço não impediu o aumento da demanda; não se pode concluir que todos os consumidores ficaram satisfeitos."], ["Pressupostos", "O pressuposto é uma informação tomada como anterior ou compartilhada pela frase. “O servidor voltou a estudar” pressupõe que ele estudava antes. “Até o diretor compareceu” sugere que a presença do diretor era menos esperada."], ["Conectivos", "Mas, porém e contudo introduzem oposição. Portanto e logo sinalizam conclusão. Porque e visto que indicam causa em muitos contextos. Embora e ainda que indicam concessão. Trocar um conectivo pode alterar a relação lógica mesmo que as palavras principais permaneçam."], ["Ironia e opinião", "A ironia cria distância entre o sentido literal e a intenção comunicativa. Identifique pistas de contexto, exagero e contradição. Diferencie opinião (“a medida foi injusta”) de informação verificável (“a medida entrou em vigor em maio”)."], ["Método de resolução", "Leia primeiro o comando: “de acordo com o texto”, “infere-se”, “a expressão indica”. Em seguida, procure o trecho correspondente. Elimine alternativas que exageram (“sempre”, “nunca”), invertem causa e consequência ou introduzem fatos externos."], ["Exercício comentado", "Texto: “Embora o atendimento tenha sido ampliado, as filas persistiram.” Conclusão correta: a ampliação não foi suficiente para eliminar as filas. Incorreto afirmar que a ampliação piorou as filas, pois isso não está dito nem necessariamente implícito."]]}, {"d": 1, "title": "Crimes funcionais — peculato, concussão e corrupção", "time": 56, "parts": [["Ponto de partida", "O Código Penal reúne crimes praticados por funcionário público contra a Administração Pública. Para fins penais, o conceito de funcionário público é mais amplo que o uso cotidiano: consulte o art. 327. É essencial diferenciar o verbo nuclear de cada tipo penal."], ["Peculato — art. 312", "No peculato-apropriação, o agente se apropria de dinheiro, valor ou outro bem móvel, público ou particular, de que tem a posse em razão do cargo. No peculato-desvio, dá destinação diversa em proveito próprio ou alheio. Exemplo: servidor que usa valores sob sua guarda para pagar despesas pessoais."], ["Concussão — art. 316", "O verbo central é EXIGIR vantagem indevida, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela. Exemplo: agente público exige pagamento para praticar ato de sua competência. A exigência distingue a concussão de outras figuras."], ["Corrupção passiva — art. 317", "Os verbos são SOLICITAR, RECEBER ou ACEITAR PROMESSA de vantagem indevida em razão da função. Exemplo: servidor solicita dinheiro para agilizar atendimento. Na concussão há exigência; na corrupção passiva, solicitação, recebimento ou aceitação de promessa."], ["Prevaricação — art. 319", "Consiste em retardar ou deixar de praticar, indevidamente, ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal. A finalidade especial é indispensável. Exemplo: deixar de cumprir ato devido para favorecer alguém por amizade pessoal."], ["Quadro comparativo", "Peculato: apropriar-se ou desviar bem em razão do cargo. Concussão: exigir vantagem indevida. Corrupção passiva: solicitar, receber ou aceitar promessa de vantagem. Prevaricação: agir ou omitir-se indevidamente para satisfazer interesse ou sentimento pessoal. Identifique primeiro o verbo e depois o contexto funcional."], ["Caso comentado", "Um servidor diz: “Se você não me pagar, não libero o documento”. A palavra “exige” aponta para concussão. Se ele apenas pede pagamento indevido, a análise pode apontar corrupção passiva. A qualificação final depende dos demais elementos do caso concreto."]]}, {"d": 2, "title": "Inquérito policial — finalidade, características e direitos", "time": 56, "parts": [["Finalidade", "O inquérito policial é procedimento de investigação destinado a reunir elementos informativos sobre materialidade e autoria de infração penal. Não é julgamento e não equivale à ação penal. O Código de Processo Penal trata do tema especialmente nos arts. 4º e seguintes."], ["Características", "É procedimento administrativo, em regra escrito e inquisitivo. A ausência de contraditório pleno na investigação não autoriza violação de direitos fundamentais. Elementos colhidos no inquérito não se confundem automaticamente com provas produzidas em juízo."], ["Instauração", "As formas de instauração variam conforme a natureza da infração e da ação penal. Em crimes de ação penal pública incondicionada, há hipóteses de instauração de ofício. Em outras situações, podem ser necessárias representação ou requerimento, conforme a lei."], ["Sigilo e defesa", "O sigilo pode proteger a investigação, mas não é absoluto. A defesa tem direito de acesso aos elementos já documentados que digam respeito ao exercício da defesa, observados os limites legais e a jurisprudência aplicável. Diligências em andamento podem demandar proteção."], ["Arquivamento", "A autoridade policial não pode simplesmente determinar o arquivamento do inquérito. O procedimento legal envolve o Ministério Público e mecanismos de controle previstos na legislação. Evite memorizar fluxos antigos sem conferir a redação vigente e decisões judiciais."], ["Exemplo resolvido", "Questão: “O inquérito policial é indispensável para toda denúncia?” Não. Se já houver elementos suficientes de justa causa, a acusação pode ser proposta sem inquérito. O essencial é a base informativa legalmente adequada."], ["Fixação", "Compare: inquérito = investigação; processo penal = procedimento jurisdicional com garantias próprias. Anote três direitos que devem ser respeitados na investigação e explique por que a autoridade policial não julga o investigado."]]}, {"d": 3, "title": "Processo Civil — contagem de prazos e atos processuais", "time": 56, "parts": [["Dias úteis", "No CPC, a contagem de prazo processual em dias considera somente dias úteis (art. 219). A regra refere-se a prazos processuais, não a todo prazo de direito material. A distinção é frequentemente explorada em provas."], ["Exclusão e inclusão", "Na contagem dos prazos, em regra, exclui-se o dia do começo e inclui-se o do vencimento (art. 224), observadas regras sobre publicação, intimação, feriados e indisponibilidade. É preciso identificar corretamente o marco inicial antes de contar."], ["Prazos e feriados", "O vencimento em dia sem expediente forense ou com indisponibilidade nas hipóteses legais pode ser prorrogado. Para exercícios, use sempre o calendário indicado no enunciado e não presuma feriados locais não informados."], ["Suspensão", "O art. 220 prevê suspensão do curso dos prazos processuais de 20 de dezembro a 20 de janeiro, inclusive, com as ressalvas legais. A suspensão não significa necessariamente paralisação integral de todas as atividades do Poder Judiciário."], ["Exemplo resolvido", "Imagine prazo de cinco dias úteis com início de contagem numa terça-feira, sem feriados: terça (1), quarta (2), quinta (3), sexta (4), segunda (5). O exemplo supõe que o marco inicial foi definido previamente e que não houve interrupções."], ["Pegadinhas", "A banca pode confundir prazo processual com material, publicação com início de contagem e suspensão com interrupção. Suspensão preserva o período já transcorrido; interrupção, quando prevista, reinicia a contagem."], ["Revisão", "Ao resolver questões, escreva: qual é o prazo? qual o evento inicial? dias úteis ou corridos? há suspensão ou feriado? Somente depois faça a contagem."]]}, {"d": 4, "title": "Direitos fundamentais — garantias e remédios constitucionais", "time": 56, "parts": [["Estrutura do art. 5º", "O art. 5º da Constituição Federal apresenta direitos e garantias individuais e coletivos. Direitos são posições protegidas; garantias são instrumentos de proteção. Muitas questões cobram a identificação da garantia adequada a uma situação."], ["Habeas corpus", "Protege a liberdade de locomoção diante de ilegalidade ou abuso de poder, inclusive quando houver ameaça. Não é instrumento genérico para discutir qualquer direito administrativo ou patrimonial."], ["Mandado de segurança", "Destina-se a proteger direito líquido e certo, não amparado por habeas corpus ou habeas data, contra ilegalidade ou abuso de poder nas hipóteses constitucionais. O direito deve poder ser demonstrado por prova pré-constituída."], ["Habeas data", "Tem como objeto, nas hipóteses legais, o conhecimento de informações relativas à pessoa do impetrante constantes de registros ou bancos de dados e a retificação dessas informações. Não se confunde com pedido genérico de acesso a documento público."], ["Mandado de injunção", "É cabível quando a falta de norma regulamentadora torna inviável o exercício de direitos e liberdades constitucionais ou prerrogativas inerentes à nacionalidade, soberania e cidadania. Identifique a omissão normativa e seu efeito concreto."], ["Ação popular", "Pode ser proposta por cidadão, observados os requisitos legais, para anular ato lesivo aos bens jurídicos protegidos constitucionalmente, como patrimônio público e moralidade administrativa. Não confunda legitimidade do cidadão com legitimidade de qualquer pessoa jurídica."], ["Caso comentado", "Pessoa ameaçada de prisão ilegal: pense em habeas corpus. Candidato com direito demonstrável violado por autoridade: avalie mandado de segurança. Falta de regulamentação que inviabiliza exercício de direito constitucional: avalie mandado de injunção."]]}, {"d": 5, "title": "Atos administrativos — atributos, invalidação e efeitos", "time": 56, "parts": [["Conceito", "Atos administrativos são manifestações da Administração sob regime jurídico de direito público destinadas a produzir efeitos jurídicos. Nem todo ato praticado pela Administração é necessariamente ato administrativo em sentido técnico."], ["Elementos", "A doutrina costuma sistematizar competência, finalidade, forma, motivo e objeto. Competência responde quem pode agir; finalidade, para quê; forma, como; motivo, por quê; objeto, o que o ato determina."], ["Presunção de legitimidade", "Em regra, o ato administrativo nasce com presunção relativa de legitimidade e veracidade. Essa presunção admite prova em contrário e não impede controle administrativo ou judicial."], ["Autoexecutoriedade e imperatividade", "Nem todo ato possui todos os atributos. Imperatividade é a possibilidade de impor obrigações independentemente da concordância do destinatário, nos casos cabíveis. Autoexecutoriedade é a execução direta em hipóteses autorizadas pela lei ou por urgência, conforme o regime aplicável."], ["Anulação", "A anulação decorre de ilegalidade. Pode ocorrer na própria Administração, no exercício da autotutela, e está sujeita aos limites legais, inclusive proteção da confiança e prazos quando previstos."], ["Revogação", "A revogação incide sobre ato válido por razões de conveniência e oportunidade, em hipóteses permitidas. Não é a mesma coisa que anular ato ilegal. Atos vinculados e situações com direitos adquiridos exigem atenção às restrições."], ["Caso comentado", "Um ato é contrário à lei: o problema é de validade e a medida adequada pode ser anulação. Um ato válido deixa de ser conveniente: pode haver revogação, se juridicamente cabível. A banca troca esses fundamentos para induzir erro."]]}, {"d": 8, "title": "Excel — fórmulas, referências e funções na prática", "time": 56, "parts": [["Referências relativas", "A referência A1 muda quando a fórmula é copiada para outra posição. Exemplo: =A1+B1 em C1, copiada para C2, torna-se =A2+B2. A mudança acompanha o deslocamento de linha e coluna."], ["Referências absolutas", "O símbolo $ fixa a dimensão seguinte: $A$1 fixa coluna A e linha 1. Ao copiar =$A$1*B2 uma linha abaixo, a primeira referência permanece e a segunda vira B3."], ["Referências mistas", "Em $A1, a coluna é fixa e a linha varia. Em A$1, a coluna varia e a linha é fixa. Copiar de C5 para E8 desloca duas colunas à direita e três linhas para baixo."], ["Exemplo resolvido", "Fórmula em C5: =$A5+B$2+$D$4. Copiando para E8: =$A8+D$2+$D$4. Primeiro termo: linha 5 vira 8. Segundo: coluna B vira D. Terceiro: ambas as dimensões ficam fixas."], ["SOMA e MÉDIA", "=SOMA(A1:A5) soma valores do intervalo. =MÉDIA(A1:A5) calcula a média aritmética dos valores numéricos considerados. Intervalos são definidos por dois pontos; argumentos podem ser separados conforme configuração regional."], ["SE e CONT.SE", "=SE(A1>=60;\"Aprovado\";\"Revisar\") testa condição e devolve resultados alternativos. =CONT.SE(B1:B10;\"Sim\") conta células que atendem ao critério. Em prova, observe sintaxe e referências."], ["Erros frequentes", "Confundir $A1 com A$1; esquecer deslocamento diagonal; tratar referência absoluta como célula que nunca muda de valor (ela fixa endereço, não conteúdo); confundir SOMA com CONT.SE. Sempre desenhe a origem e o destino da cópia."]]}, {"d": 9, "title": "Porcentagem e variações sucessivas — problemas resolvidos", "time": 56, "parts": [["Conceito", "Porcentagem significa “por cem”. Para achar 12% de 250, calcule 250 × 12/100 = 30. Para descobrir que percentual 10 representa de 250, faça 10/250 × 100 = 4%."], ["Aumento percentual", "Um valor de R$ 800 com aumento de 15% passa a 800 × 1,15 = R$ 920. O fator multiplicativo de aumento de p% é 1 + p/100."], ["Desconto percentual", "Um valor de R$ 500 com desconto de 20% passa a 500 × 0,80 = R$ 400. O fator de desconto é 1 − p/100."], ["Variações sucessivas", "Aumentar 20% e depois diminuir 20% não devolve o valor original: 100 × 1,20 × 0,80 = 96. Houve redução líquida de 4%. Não some percentuais quando as bases mudam."], ["Variação em relação à previsão", "Se a previsão era R$ 8.000 e o realizado foi R$ 9.200, a variação é R$ 1.200. A taxa sobre a previsão é 1.200/8.000 × 100 = 15%. O denominador é a base indicada no enunciado."], ["Percentual inverso", "Se um produto passou de R$ 200 para R$ 250, houve aumento de 25%. Para voltar de 250 a 200, o desconto necessário é 50/250 = 20%. A base da segunda operação é diferente."], ["Exercício comentado", "Uma loja vende 300 unidades e 18 são devolvidas. Taxa de devolução = 18/300 × 100 = 6%. Se a pergunta fosse “18 é quantos por cento de 282?”, a resposta mudaria. Leia cuidadosamente qual é o total de referência."]]}, {"d": 10, "title": "Lógica proposicional — negação, equivalência e argumentos", "time": 64, "parts": [["Proposição", "Proposição é uma sentença declarativa à qual se pode atribuir valor lógico verdadeiro ou falso. Perguntas e ordens não são proposições no sentido clássico. A análise depende da estrutura, não da plausibilidade cotidiana."], ["Conjunção", "P ∧ Q (“P e Q”) só é verdadeira quando ambas são verdadeiras. Se uma delas for falsa, a conjunção será falsa. Exemplo: “O edital foi publicado e a prova foi marcada”."], ["Disjunção inclusiva", "P ∨ Q (“P ou Q”) é falsa apenas quando ambas são falsas. O “ou” lógico inclusivo admite que as duas proposições sejam verdadeiras simultaneamente."], ["Condicional", "P → Q (“se P, então Q”) é falsa apenas quando P é verdadeira e Q é falsa. Exemplo: “Se estudo, então reviso” não é refutado por um dia em que não estudo; é refutado por estudar e não revisar."], ["Negação da condicional", "A negação de “Se P, então Q” é “P e não Q”. Não é “Se não P, então não Q”. Para negar uma implicação, construa o caso que a torna falsa."], ["Leis de De Morgan", "Negação de “P e Q” = “não P ou não Q”. Negação de “P ou Q” = “não P e não Q”. Ao negar, troque e/ou e negue cada parcela."], ["Equivalência", "P → Q equivale a “não P ou Q” e à contrapositiva “se não Q, então não P”. Não equivale, em geral, à recíproca “se Q, então P”."], ["Questão comentada", "Negue “Se o candidato estudou, então acertou”. Resposta: “O candidato estudou e não acertou”. A frase apresenta exatamente a situação em que a condicional original seria falsa."]]}] );

<script>
// Avaliação local por indicadores textuais; não é correção semântica por IA nem nota oficial.
const essayTopics=[
'Os desafios da inclusão digital no acesso aos serviços públicos',
'A importância da transparência na administração pública',
'Os desafios da acessibilidade nos serviços públicos',
'O papel da educação no combate à desinformação'];
const essayTerms=[['digital','internet','tecnologia','acesso','serviços','inclusão','conectividade','públic'],['transparência','informação','controle','públic','gestão','dados','fiscalização','sociedade'],['acessibilidade','deficiência','inclusão','barreiras','atendimento','direitos','mobilidade','públic'],['educação','desinformação','informação','mídia','notícias','crítica','escola','fontes']];
function essayWords(t){return (t.match(/[\p{L}\p{N}]+(?:[-’'][\p{L}\p{N}]+)*/gu)||[])}
function essayAnalyze(t,topic){
 const clean=t.trim(),words=essayWords(clean),n=words.length;
 const paragraphs=clean.split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean);
 const sentences=clean.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);
 const lower=clean.toLocaleLowerCase('pt-BR');
 const terms=essayTerms[topic]||essayTerms[0];
 const hits=terms.filter(x=>lower.includes(x)).length;
 const connectors=['além disso','portanto','entretanto','contudo','porém','assim','desse modo','dessa forma','por conseguinte','em primeiro lugar','em segundo lugar','por outro lado','nesse sentido','logo','consequentemente','ademais','em síntese','diante disso'];
 const used=connectors.filter(x=>lower.includes(x));
 const hasConclusion=/(portanto|conclui-se|em síntese|diante disso|assim|desse modo|por fim|logo)/i.test(paragraphs.at(-1)||'');
 const hasProposal=/(deve|devem|necessári|precis|fundamental|importante|investir|promover|garantir|ampliar|implementar|capacitar|criar)/i.test(paragraphs.at(-1)||'');
 const repetition=words.length?new Set(words.map(x=>x.toLowerCase())).size/words.length:0;
 const veryLong=sentences.filter(x=>essayWords(x).length>45).length;
 const veryShort=sentences.filter(x=>essayWords(x).length<5).length;
 const criteria=[
 {name:'Desenvolvimento do tema',score:Math.min(20,Math.round((Math.min(hits,5)/5*12)+(n>=180?8:n>=100?5:n>=50?2:0))),why:`${hits} de ${terms.length} indicadores temáticos encontrados. Isso mede vocabulário relacionado ao tema, não a qualidade dos argumentos.`},
 {name:'Estrutura dissertativa',score:Math.min(20,(paragraphs.length>=4?12:paragraphs.length===3?10:paragraphs.length===2?6:paragraphs.length===1?2:0)+(hasConclusion?4:0)+(hasProposal?4:0)),why:`${paragraphs.length} parágrafo(s); ${hasConclusion?'há':'não há'} marcador de conclusão; ${hasProposal?'há':'não há'} indício textual de encaminhamento.`},
 {name:'Coesão e progressão',score:Math.min(20,Math.round(Math.min(used.length,4)*3+(paragraphs.length>=3?5:1)+(n>=150?3:0))),why:`${used.length} conectivo(s) identificado(s): ${used.join(', ')||'nenhum dos conectivos monitorados'}. O sistema não avalia a adequação de cada uso.`},
 {name:'Extensão e desenvolvimento',score:Math.min(20,n>=220&&n<=420?20:n>=160&&n<220?16:n>420&&n<=550?14:n>=100?10:n>=50?5:0),why:`${n} palavras. Faixas são parâmetros de treino, não limites confirmados do edital.`},
 {name:'Clareza textual (indicadores)',score:Math.max(0,Math.min(20,12+(sentences.length>=5?4:0)+(repetition>.42?4:0)-veryLong*3-Math.min(veryShort,3))),why:`${sentences.length} período(s), ${veryLong} período(s) com mais de 45 palavras. Não há revisão gramatical completa.`}
 ];
 const total=criteria.reduce((a,c)=>a+c.score,0);
 const suggestions=[];
 if(n<160)suggestions.push('Desenvolva melhor a tese e os argumentos: o texto está curto para este parâmetro de treino.');
 if(paragraphs.length<3)suggestions.push('Separe introdução, desenvolvimento e conclusão em parágrafos distintos.');
 if(hits<3)suggestions.push('Aproxime o texto do tema com argumentos e exemplos concretos; não apenas repetindo palavras-chave.');
 if(used.length<2)suggestions.push('Use conectivos adequados para mostrar relações de causa, contraste e conclusão.');
 if(!hasConclusion)suggestions.push('Construa um encerramento que retome a tese e sintetize os argumentos.');
 if(!hasProposal)suggestions.push('Considere apresentar um encaminhamento concreto na conclusão, quando pertinente.');
 if(veryLong)suggestions.push('Revise períodos muito longos: dividi-los pode melhorar a clareza.');
 if(!suggestions.length)suggestions.push('Revise a precisão dos argumentos, a pontuação e a adequação ao tema; estes aspectos exigem leitura humana.');
 return {total,criteria,suggestions,n,paragraphs:paragraphs.length,used:used.length,date:new Date().toLocaleString('pt-BR'),topic};
}

<style>
.essay-issue{border-left:3px solid var(--accent,#64748b);padding:10px 12px;margin:9px 0;background:rgba(120,120,120,.07);border-radius:6px}.essay-issue blockquote{margin:6px 0;padding:7px 10px;border-left:2px solid #999;font-style:italic}.essay-tag{font-size:.8rem;font-weight:700;opacity:.8}.essay-section{margin-top:18px}.essay-metrics{display:flex;flex-wrap:wrap;gap:8px}.essay-metrics span{padding:7px 10px;border:1px solid #9995;border-radius:8px;font-size:.85rem}.essay-check{margin:8px 0;padding:8px;border-bottom:1px solid #9993}
</style><script>
// 2.4: diagnóstico heurístico offline. Não substitui correção humana.
function essayDeepCheck(text,topic){
 const paragraphs=text.split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean);
 const sentences=(text.match(/[^.!?\n]+[.!?]?/g)||[]).map(x=>x.trim()).filter(Boolean);
 const words=essayWords(text),issues=[];
 const add=(type,quote,why,action)=>issues.push({type,quote:quote.slice(0,190),why,action});
 const norm=x=>x.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const stop=new Set('para como sobre entre ainda muito mesmo quando onde porque assim isso essa esse estas estes uma umas uns com sem dos das nos nas que por seu sua seus suas foi ser tem mais menos pelo pela eles elas voce você também apenas então cada todos todas muito muita muitas muitos está estão seria sendo foram esse essa isso aquele aquela aqueles aquelas'.split(' '));
 const freq={};for(const w of words){let a=norm(w.replace(/[^\p{L}]/gu,''));if(a.length>=5&&!stop.has(a))freq[a]=(freq[a]||0)+1}
 Object.entries(freq).filter(([w,n])=>n>=Math.max(4,Math.ceil(words.length*.035))).sort((a,b)=>b[1]-a[1]).slice(0,5).forEach(([w,n])=>add('Vocabulário repetido',w,`A palavra aparece ${n} vezes. A repetição pode ser intencional, mas merece revisão.`, 'Experimente reformular frases ou substituir por termos equivalentes sem perder precisão.'));
 sentences.forEach((s,i)=>{const n=essayWords(s).length;if(n>42)add('Período longo',s,`A frase ${i+1} tem aproximadamente ${n} palavras e pode dificultar a leitura.`,'Considere dividir em duas frases e explicitar a relação lógica entre elas.');if(n>=8&&!/[.!?…]$/.test(s)&&i<sentences.length-1)add('Pontuação a conferir',s,'Este trecho pode estar sem pontuação final.','Revise o limite entre os períodos.');});
 const patterns=[[/\bmais\s+(?:eu|ele|ela|nós|nos|isso|o|a|os|as)\b/gi,'Possível troca de mas/mais','“Mas” indica oposição; “mais” indica quantidade.'],[/\ba\s+gente\s+(?:vamos|fomos|iremos)\b/gi,'Registro informal','Em redação formal, avalie substituir “a gente” por “nós”, ajustando a concordância.'],[/\b(?:pra|pro|tá|né|tipo assim)\b/gi,'Linguagem coloquial','Prefira formas adequadas ao registro formal, respeitando o contexto.'],[/\b(?:concerteza|derrepente|apartir|agente)\b/gi,'Grafia ou expressão a conferir','Confira a grafia e o sentido: “com certeza”, “de repente”, “a partir”; “a gente” é diferente de “agente”.'],[/\b(?:há|fazem)\s+\d+\s+anos\b/gi,'Expressão temporal','Confira se a construção temporal está adequada; “há” e “faz” podem indicar tempo decorrido.']];
 for(const [re,type,action] of patterns){for(const match of text.matchAll(re)){if(issues.filter(x=>x.type===type).length>=3)break;add(type,match[0],'Expressão identificada por uma regra de revisão. Pode haver falsos positivos.',action)}}
 const open=(text.match(/\(/g)||[]).length,close=(text.match(/\)/g)||[]).length;if(open!==close)add('Sinais gráficos','( )','A quantidade de parênteses abertos e fechados é diferente.','Verifique se todos os parênteses foram fechados.');
 paragraphs.forEach((p,i)=>{const n=essayWords(p).length;if(n<28)add('Parágrafo pouco desenvolvido',p,`O parágrafo ${i+1} tem ${n} palavras.`,'Acrescente explicação, relação com a tese ou exemplo pertinente; não aumente apenas por aumentar.');if(n>190)add('Parágrafo extenso',p,`O parágrafo ${i+1} tem ${n} palavras.`,'Avalie separar ideias distintas em parágrafos, preservando a progressão.');});
 const starters=['primeiramente','em primeiro lugar','além disso','por outro lado','entretanto','contudo','portanto','assim','desse modo','em síntese','dessa forma'];
 const used=starters.filter(x=>norm(text).includes(x));
 const topicText=typeof essayTopics!=='undefined'?essayTopics[topic]||'':'';
 const topicTerms=norm(topicText).split(/[^a-z]+/).filter(w=>w.length>4&&!stop.has(w));
 const matches=[...new Set(topicTerms)].filter(w=>norm(text).includes(w));
 return {paragraphs,sentences,words,issues,used,topicText,topicTerms,matches};
}
function essayDeepGrade(){const e=$('essay');if(!e)return;essaySave();const text=e.value,words=essayWords(text);if(words.length<35){$('essayResult').innerHTML='<div class="notice">Escreva pelo menos 35 palavras para receber o diagnóstico. Para uma análise mais útil, escreva o texto completo.</div>';return}
 const topic=Number($('essayTopic').value),r=essayAnalyze(text,topic),d=essayDeepCheck(text,topic);
 db.essayHistory=db.essayHistory||[];db.essayHistory.unshift({...r,text:text.slice(0,120),title:essayTopics[topic],diagnosticIssues:d.issues.length});db.essayHistory=db.essayHistory.slice(0,15);save();
 const htmlIssues=d.issues.length?d.issues.slice(0,18).map(x=>`<div class="essay-issue"><span class="essay-tag">${esc(x.type)}</span><blockquote>${esc(x.quote)}</blockquote><p>${esc(x.why)}</p><p><b>Como revisar:</b> ${esc(x.action)}</p></div>`).join(''):'<p>Não foram encontrados alertas nas regras disponíveis. Isso não significa ausência de erros gramaticais ou argumentativos.</p>';
 const roles=['Introdução — apresenta o recorte do tema e a tese?','Desenvolvimento — apresenta argumento, justificativa e exemplo?','Desenvolvimento ou conclusão — progride sem repetir a mesma ideia?','Conclusão — retoma a tese e fecha o raciocínio?'];
 const paragraphReview=d.paragraphs.map((p,i)=>`<div class="essay-issue"><b>Parágrafo ${i+1}</b> · ${essayWords(p).length} palavras<p class="tiny muted">${esc(p.slice(0,220))}${p.length>220?'…':''}</p><p><b>Verifique:</b> ${esc(i===0?roles[0]:i===d.paragraphs.length-1?roles[3]:roles[1])}</p></div>`).join('');
 const checklist=[['Tese explícita','O primeiro parágrafo apresenta um posicionamento claro, não apenas o assunto?'],['Argumentos sustentados','Cada argumento explica por que a tese é defensável, com exemplo pertinente?'],['Progressão','Os parágrafos acrescentam ideias novas em vez de repetir as anteriores?'],['Coerência','Não há contradições entre a introdução, o desenvolvimento e a conclusão?'],['Conclusão','O encerramento responde ao problema apresentado sem abrir assunto novo?']];
 $('essayResult').innerHTML=`<div class="card"><h3>Diagnóstico de redação — offline</h3><div class="essay-score">${r.total}/100 <span class="muted tiny">índice heurístico, não nota de banca</span></div><p class="muted">A pontuação é produzida por indicadores mecânicos; não avalia com segurança a qualidade da argumentação, a gramática completa nem a adequação ao tema. Use principalmente os alertas e a lista de revisão.</p><div class="essay-metrics"><span>${d.words.length} palavras</span><span>${d.paragraphs.length} parágrafos</span><span>${d.sentences.length} períodos aproximados</span><span>${d.issues.length} alertas</span></div><div class="essay-section"><h3>Critérios indicativos</h3><div class="essay-criteria">${r.criteria.map(c=>`<div><b>${esc(c.name)}</b><div class="stat">${c.score}/20</div><p class="tiny muted">${esc(c.why)}</p></div>`).join('')}</div></div><div class="essay-section"><h3>Trechos para revisar</h3>${htmlIssues}</div><div class="essay-section"><h3>Leitura por parágrafo</h3>${paragraphReview}</div><div class="essay-section"><h3>Relação com o tema</h3><p>Palavras do tema encontradas no texto: <b>${d.matches.length} de ${[...new Set(d.topicTerms)].length}</b>. A presença de palavras não comprova que você desenvolveu o assunto.</p><p><b>Conectivos identificados:</b> ${d.used.length?esc(d.used.join(', ')):'nenhum dos conectivos monitorados'}. Não insira conectivos artificialmente apenas para aumentar a contagem.</p></div><div class="essay-section"><h3>Revisão argumentativa (autoavaliação)</h3>${checklist.map(([a,b])=>`<div class="essay-check"><label><input type="checkbox"> <b>${esc(a)}</b></label><p class="tiny muted">${esc(b)}</p></div>`).join('')}</div><div class="essay-section"><h3>Prioridades de melhoria</h3>${r.suggestions.map(x=>`<div class="essay-feedback">${esc(x)}</div>`).join('')}</div><p class="tiny muted">Diagnóstico salvo no histórico local. Nenhum texto foi enviado à internet.</p></div>`;
 essayRenderHistory();
}
const essayDrawV24=essayDraw;essayDraw=function(){essayDrawV24();const b=document.querySelector('button[onclick="essayGrade()"]');if(b){b.setAttribute('onclick','essayDeepGrade()');b.textContent='Analisar redação offline'}const notice=document.querySelector('#main .notice.tiny');if(notice)notice.innerHTML='<b>Correção offline:</b> identifica indícios e trechos para revisão, mas não substitui correção humana. A nota é apenas um índice de treino, não uma previsão da Vunesp.'};
if(tab==='Redação')essayDraw();

<script>
// Curso de redação: aulas autorais e prática offline.
const essayCourse=[{"title": "01 · Entenda a proposta", "subtitle": "Tema, recorte e comando", "parts": [["O que a banca espera", "Uma redação dissertativo-argumentativa apresenta uma posição sobre um tema e a defende com razões. Antes de escrever, identifique o assunto geral, o recorte específico e o que a proposta pede. Tema não é título: o tema delimita o problema; o título é uma escolha de apresentação, quando permitida."], ["Método de leitura em três perguntas", "Pergunte: (1) Sobre o que preciso escrever? (2) Qual problema ou tensão está em debate? (3) Que posição consigo defender? Exemplo: no tema “Desafios da inclusão digital no acesso aos serviços públicos”, o assunto é inclusão digital; o recorte é o acesso aos serviços públicos; o problema é a exclusão de pessoas sem internet, equipamentos ou habilidades."], ["Erro frequente", "Falar apenas sobre vantagens da tecnologia pode fugir do recorte: é necessário discutir o acesso aos serviços públicos. Evite repetir o enunciado sem desenvolver um ponto de vista."], ["Pratique", "Reescreva o tema em uma frase começando por “O problema central é...”. Depois liste duas causas e duas consequências relacionadas ao recorte."]]}, {"title": "02 · Planejamento antes de escrever", "subtitle": "Tese e mapa de argumentos", "parts": [["A tese", "Tese é a ideia central que o texto defenderá. Deve responder ao problema apresentado. Exemplo: “A digitalização dos serviços públicos amplia a eficiência, mas a falta de conectividade e de orientação presencial impede que parte da população aproveite esses benefícios.” Essa frase apresenta uma posição debatível e duas linhas de desenvolvimento."], ["Mapa de quatro partes", "Planeje: introdução com contexto e tese; desenvolvimento 1 sobre a primeira causa; desenvolvimento 2 sobre a segunda causa ou consequência; conclusão que retoma a tese e fecha o raciocínio. Esse esquema é uma ferramenta de treino, não uma exigência universal de quatro parágrafos."], ["Escolha de argumentos", "Prefira argumentos que consiga explicar. “A internet é importante” é genérico. “A exigência de cadastro digital pode excluir pessoas sem acesso contínuo à rede” permite mostrar causa, mecanismo e consequência."], ["Pratique", "Escreva uma tese de até duas frases sobre o tema escolhido na oficina. Sublinhe mentalmente as duas ideias que serão desenvolvidas nos parágrafos seguintes."]]}, {"title": "03 · Introdução eficaz", "subtitle": "Contextualização, problema e tese", "parts": [["Função da introdução", "A introdução orienta o leitor: apresenta o assunto, delimita o problema e indica o posicionamento do autor. Não precisa trazer citações famosas. Uma contextualização objetiva e pertinente costuma ser mais segura do que repertório decorado."], ["Exemplo comentado", "“A ampliação dos serviços públicos digitais facilita procedimentos cotidianos. Entretanto, parte da população ainda enfrenta obstáculos de acesso à internet e de familiaridade com plataformas eletrônicas. Assim, a modernização precisa ser acompanhada de medidas que evitem a exclusão de usuários.” A primeira frase contextualiza; a segunda apresenta a tensão; a terceira formula a tese."], ["O que evitar", "Evite começar com “Desde os primórdios da humanidade” ou frases vagas que serviriam para qualquer tema. Não anuncie argumentos que não serão desenvolvidos."], ["Pratique", "Crie uma introdução de três a cinco frases e identifique nela contexto, problema e tese."]]}, {"title": "04 · Desenvolvimento", "subtitle": "Argumento, explicação e consequência", "parts": [["Parágrafo argumentativo", "Uma estrutura útil é: ideia principal → explicação do mecanismo → exemplo pertinente → consequência → ligação com a tese. Não é uma fórmula obrigatória, mas impede que o parágrafo seja apenas uma afirmação solta."], ["Exemplo comentado", "“A desigualdade de conectividade dificulta o acesso a serviços públicos digitais. Em regiões com cobertura instável ou para famílias sem equipamentos adequados, agendamentos e solicitações eletrônicas podem se tornar obstáculos. Desse modo, uma solução criada para agilizar o atendimento corre o risco de ampliar diferenças já existentes.” Observe que a segunda frase explica como o problema acontece e a terceira mostra sua consequência."], ["Argumentação fraca e forte", "Fraco: “A tecnologia é boa, mas tem problemas”. Mais forte: “A adoção exclusiva de canais digitais pode reduzir custos administrativos, porém exige alternativas para quem não possui acesso ou domínio das ferramentas”. A segunda formulação apresenta uma tensão concreta."], ["Pratique", "Escolha um argumento e escreva quatro frases: afirmação, explicação, exemplo hipotético plausível e consequência."]]}, {"title": "05 · Coesão e coerência", "subtitle": "Como ligar ideias sem exagerar", "parts": [["Coesão", "Coesão é a ligação linguística entre partes do texto. Use pronomes, repetições controladas, substituições vocabulares e conectivos. “Entretanto” introduz contraste; “portanto”, conclusão; “além disso”, adição; “por exemplo”, exemplificação."], ["Coerência", "Coerência é a compatibilidade lógica das ideias. Um texto pode ter muitos conectivos e ainda ser contraditório. Se a tese defende atendimento híbrido, a conclusão não deve exigir atendimento exclusivamente digital sem justificar a mudança."], ["Armadilha comum", "Evite começar todos os parágrafos com “Além disso”. O conectivo precisa expressar a relação real. “Portanto” não deve introduzir um argumento novo como se fosse consequência do anterior."], ["Pratique", "Revise um parágrafo e explique por que cada conectivo foi escolhido. Se puder removê-lo sem prejudicar a compreensão, talvez esteja sobrando."]]}, {"title": "06 · Conclusão", "subtitle": "Fechamento sem ideias novas", "parts": [["O papel da conclusão", "A conclusão sintetiza o percurso argumentativo e reforça a posição central. Em algumas propostas, uma sugestão de encaminhamento é útil, mas não se deve presumir que a banca exige o modelo de intervenção do Enem. Siga os critérios específicos do edital."], ["Exemplo comentado", "“Portanto, a transformação digital do serviço público deve considerar as diferenças de acesso entre os cidadãos. A manutenção de canais alternativos e a oferta de orientação aos usuários podem conciliar eficiência administrativa e inclusão.” O trecho retoma a tese e apresenta um encaminhamento coerente."], ["Erros frequentes", "Não introduza uma causa completamente nova na última frase. Evite conclusões vazias como “todos devem fazer sua parte” sem relação com os argumentos anteriores."], ["Pratique", "Escreva uma conclusão de duas a quatro frases que retome sua tese sem copiá-la literalmente."]]}, {"title": "07 · Norma-padrão e revisão", "subtitle": "Clareza, pontuação e concordância", "parts": [["Revisão em camadas", "Primeira leitura: confira se respondeu ao tema. Segunda: examine a sequência dos argumentos. Terceira: revise concordância, regência, crase, pontuação, grafia e repetição. Revisar uma dimensão por vez costuma facilitar a identificação de problemas."], ["Pontuação na prática", "Não separe sujeito e verbo com vírgula: “A falta de acesso à internet, dificulta o atendimento” está inadequado; prefira “A falta de acesso à internet dificulta o atendimento”. A vírgula pode isolar uma expressão deslocada: “Em muitas regiões, o acesso é limitado”."], ["Precisão vocabular", "Evite “coisa”, “negócio”, “muito importante” sem especificação. Prefira palavras precisas: “atendimento”, “procedimento”, “barreira de acesso”, “orientação ao usuário”. Não use palavras difíceis apenas para parecer formal."], ["Pratique", "Leia seu texto em voz baixa, procure frases muito longas e revise se cada pronome tem referente claro. A ferramenta offline ajuda a encontrar indícios, mas não substitui essa leitura."]]}, {"title": "08 · Redação sob tempo de prova", "subtitle": "Planejamento, escrita e conferência", "parts": [["Distribua o tempo", "Treine uma rotina de escrita: leitura e planejamento; primeira versão; revisão final. O tempo exato disponível e as regras da prova devem ser conferidos no edital. Não gaste todo o período planejando e deixe minutos para reler."], ["Rascunho funcional", "Não é necessário escrever uma redação inteira duas vezes. Um esquema com tese, argumento 1, argumento 2 e fechamento pode ser suficiente para começar a versão final com segurança."], ["Checklist final", "Confira: respondi ao recorte? A tese está clara? Cada parágrafo desenvolve uma ideia? Há exemplos pertinentes? A conclusão corresponde ao desenvolvimento? Corrigi pontuação, concordância e palavras repetidas?"], ["Pratique", "Escreva um texto cronometrado sobre um dos temas da oficina. Depois faça uma segunda versão apenas dos parágrafos que ficaram menos claros."]]}];
let essayLessonOpen=null;
function essayCourseHome(){essayLessonOpen=null;essayCourseRender()}
function essayCourseLesson(i){essayLessonOpen=i;essayCourseRender();document.getElementById('essayCourse').scrollIntoView({block:'start',behavior:'smooth'})}
function essayCourseComplete(i){db.essayCourseRead=db.essayCourseRead||{};db.essayCourseRead[i]=true;save();essayCourseRender()}
function essayCourseRender(){const root=document.getElementById('essayCourse');if(!root)return;const read=db.essayCourseRead||{};const done=Object.keys(read).filter(k=>read[k]).length;let content='';if(essayLessonOpen===null){content=`<p class="muted">Aprenda a escrever uma dissertação argumentativa e depois pratique na oficina abaixo. ${done} de ${essayCourse.length} aulas marcadas como lidas.</p><div class="grid">${essayCourse.map((x,i)=>`<div class="card"><span class="pill">Aula ${i+1}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.subtitle)}</p><button class="btn primary" onclick="essayCourseLesson(${i})">${read[i]?'Revisar aula':'Ler aula'}</button></div>`).join('')}</div>`}else{const x=essayCourse[essayLessonOpen];content=`<button class="btn" onclick="essayCourseHome()">← Voltar ao índice</button><h3>${esc(x.title)}</h3><p class="muted">${esc(x.subtitle)}</p>${x.parts.map(([h,t])=>`<div class="lesson-block"><h3>${esc(h)}</h3><p style="line-height:1.85;white-space:pre-wrap">${esc(t)}</p></div>`).join('')}<div class="notice"><b>Exercício de fixação:</b> escreva a resposta sugerida na aula e aplique a técnica na oficina de redação, logo abaixo.</div><button class="btn primary" onclick="essayCourseComplete(${essayLessonOpen})">${read[essayLessonOpen]?'✓ Aula estudada':'Marcar aula como estudada'}</button> <button class="btn" onclick="essayCourseLesson(${Math.min(essayCourse.length-1,essayLessonOpen+1)})">Próxima aula →</button>`}root.innerHTML=`<div class="card"><h2>📖 Curso de Redação</h2>${content}</div>`}
const essayDrawV25=essayDraw;essayDraw=function(){essayDrawV25();const m=document.getElementById('main');const course=document.createElement('section');course.id='essayCourse';course.style.marginBottom='16px';const heading=m.querySelector('h2');if(heading)heading.after(course);else m.prepend(course);essayCourseRender()};
