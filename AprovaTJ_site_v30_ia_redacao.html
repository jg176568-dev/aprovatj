<script>
// v1.7 — 12 capítulos didáticos autorais, leitura e exercícios no leitor existente
digitalModules.push(...[{"d": 0, "title": "Pontuação — vírgula, ponto e vírgula e dois-pontos", "time": 55, "parts": [["Regra central", "A vírgula não representa simplesmente uma pausa da fala: ela marca relações sintáticas. Em regra, não se separa sujeito de verbo nem verbo de complemento. Em “Os servidores do cartório analisaram os documentos”, a vírgula após “cartório” seria inadequada, pois separaria sujeito e predicado."], ["Enumeração e termos coordenados", "Use vírgulas para separar itens de uma enumeração: “O candidato revisou português, matemática, informática e direito”. Antes de “e” a vírgula geralmente é dispensável em enumeração simples, mas pode surgir para marcar mudança de sujeito ou efeito expressivo, conforme o contexto."], ["Adjuntos adverbiais deslocados", "Em “Na manhã de segunda-feira, a equipe conferiu os autos”, o adjunto adverbial antecipado aparece isolado. Adjuntos curtos podem admitir pontuação facultativa em certos contextos. A posição e a extensão do termo importam mais que a mera presença de uma expressão de tempo."], ["Orações explicativas e restritivas", "Compare: “Os candidatos que estudaram foram aprovados” (somente os que estudaram) e “Os candidatos, que estudaram, foram aprovados” (o trecho entre vírgulas apresenta informação explicativa sobre todos os candidatos mencionados). A pontuação altera o alcance do sentido."], ["Vocativo e aposto", "O vocativo chama o interlocutor: “Colegas, leiam o comunicado”. O aposto explicativo esclarece um termo: “A Vunesp, banca organizadora, divulgou orientações”. Ambos costumam ser isolados por vírgulas. Não confunda aposto explicativo com complemento indispensável."], ["Dois-pontos e ponto e vírgula", "Os dois-pontos anunciam esclarecimento, enumeração ou fala: “A regra é simples: não separe sujeito e verbo”. O ponto e vírgula separa unidades coordenadas extensas, especialmente quando já existem vírgulas internas: “Ana revisou direito penal, pela manhã; Bruno, informática, à tarde”."], ["Questão comentada", "Assinale a pontuação adequada: “Os documentos, chegaram ontem” ou “Os documentos chegaram ontem”? A segunda. “Os documentos” é sujeito de “chegaram”; a vírgula indevida rompe a estrutura básica. Antes de decidir, identifique verbo e sujeito."], ["Checklist Vunesp", "Ao revisar uma frase, localize o verbo, identifique seu sujeito, reconheça orações subordinadas e verifique se o trecho isolado é explicativo, deslocado ou vocativo. Questões difíceis costumam testar mudança de sentido, e não só correção gramatical."]]}, {"d": 0, "title": "Pronomes relativos e colocação pronominal", "time": 55, "parts": [["Relativos retomam antecedentes", "“O processo que foi distribuído” contém pronome relativo “que”, retomando “processo”. “O servidor a quem entreguei o documento” usa “quem” precedido da preposição exigida por “entregar algo a alguém”. O pronome relativo conecta orações e desempenha função sintática."], ["Onde e aonde", "“Onde” indica localização estática: “O setor onde trabalho”. “Aonde” é usado com ideia de destino, quando o verbo exige a preposição a: “Aonde você pretende ir?”. Em linguagem formal, evite usar “onde” para conceitos abstratos como “a situação onde ocorreu o erro”; prefira “em que”."], ["Cujo: posse e concordância", "“O candidato cujo recurso foi deferido” significa “o recurso do candidato”. “Cujo” concorda com o elemento possuído, não com o possuidor. Não se usa artigo imediatamente depois de “cujo”: “cujo o recurso” é inadequado."], ["Próclise", "A próclise coloca o pronome antes do verbo: “Não se admite atraso”. Palavras negativas, certos pronomes relativos e conjunções subordinativas frequentemente atraem o pronome: “Quando me chamarem, responderei”. Observe a construção inteira, não uma palavra isolada."], ["Ênclise e mesóclise", "Na ênclise, o pronome vem depois do verbo: “Entregou-se o documento”. A mesóclise ocorre em construções formais com futuro do presente ou do pretérito, quando não há fator de próclise: “Entregar-se-á o relatório”. A norma e o registro importam para a análise."], ["Exemplo resolvido", "Compare “O relatório que me enviaram” e “O relatório que enviaram-me”. Na norma-padrão tradicional, o relativo “que” favorece a próclise, portanto “que me enviaram” é a forma esperada."], ["Armadilhas de prova", "Não trate todas as ocorrências de “se” como pronome apassivador: ele pode integrar verbo pronominal, indicar indeterminação do sujeito ou ter outras funções. Analise transitividade, concordância e sentido."], ["Revisão ativa", "Crie três frases com “cujo”, três com “onde/aonde” e três com fator de próclise. Explique por que escolheu cada construção antes de conferir a norma."]]}, {"d": 1, "title": "Direito Penal — peculato, concussão e corrupção passiva", "time": 55, "parts": [["Ponto de partida", "O Código Penal disciplina crimes praticados por funcionário público contra a Administração Pública. Para fins penais, o conceito de funcionário público é amplo, conforme o art. 327. A condição funcional e o vínculo entre a conduta e o cargo são centrais na análise."], ["Peculato — art. 312", "No peculato-apropriação, o funcionário se apropria de dinheiro, valor ou bem móvel de que tem posse em razão do cargo. No peculato-desvio, dá ao bem destinação indevida, em proveito próprio ou alheio. Atenção: a posse funcional diferencia essas figuras de outras condutas."], ["Peculato-furto", "O §1º do art. 312 contempla hipótese em que o funcionário, sem ter a posse do bem, o subtrai ou concorre para a subtração, valendo-se de facilidade proporcionada pela qualidade de funcionário. Não confunda com o caput, que pressupõe posse em razão do cargo."], ["Concussão — art. 316", "O núcleo é “exigir” vantagem indevida, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela. “Exigir” envolve imposição; não é sinônimo de pedir."], ["Corrupção passiva — art. 317", "Os núcleos são solicitar, receber ou aceitar promessa de vantagem indevida em razão da função. A solicitação pode consumar a figura correspondente sem que a vantagem seja efetivamente entregue. É indispensável distinguir o verbo da conduta."], ["Quadro comparativo em palavras", "Peculato: apropriar-se ou desviar bem sob posse funcional; concussão: exigir vantagem indevida; corrupção passiva: solicitar, receber ou aceitar promessa. O objeto, a posse e o verbo empregado no enunciado orientam a resposta."], ["Caso resolvido", "Um agente público diz ao usuário: “Só libero seu documento se você me pagar R$ 300”. A palavra-chave é “exigir” vantagem indevida em razão da função: em tese, concussão. Se o enunciado descrevesse mero pedido, a análise poderia se aproximar de corrupção passiva."], ["Como revisar a lei", "Leia os arts. 312, 316, 317 e 327 na redação atualizada. Faça uma tabela própria com sujeito ativo, núcleo do tipo, objeto, elemento funcional e exemplos. A tipificação definitiva depende de todos os fatos do caso."]]}, {"d": 2, "title": "Processo Penal — prisão em flagrante e garantias", "time": 55, "parts": [["O que é flagrante", "O CPP, no art. 302, descreve hipóteses de flagrante delito, como estar cometendo a infração, acabar de cometê-la, ser perseguido logo após em circunstâncias indicativas de autoria e ser encontrado logo depois com instrumentos, armas, objetos ou papéis que façam presumir autoria."], ["Flagrante próprio e impróprio", "A doutrina costuma chamar de próprio o flagrante de quem está cometendo ou acaba de cometer; impróprio, o de quem é perseguido logo após. O flagrante presumido relaciona-se à localização logo depois com objetos ou instrumentos relevantes. Essas classificações ajudam a memorizar o art. 302."], ["Quem pode prender", "O art. 301 do CPP prevê que qualquer pessoa do povo poderá prender quem seja encontrado em flagrante delito; autoridades policiais e seus agentes deverão fazê-lo. Note a diferença entre faculdade do particular e dever funcional dos agentes."], ["Auto e controle judicial", "A prisão em flagrante desencadeia procedimentos documentais e controle judicial. O art. 310 trata das providências judiciais ao receber o auto, incluindo avaliação da legalidade e da necessidade de medidas cautelares. A disciplina deve ser estudada na redação atualizada, com atenção às decisões dos tribunais."], ["Direitos fundamentais", "A Constituição, no art. 5º, assegura direitos relacionados à prisão, incluindo comunicação e assistência. A existência de flagrante não afasta garantias nem autoriza automaticamente qualquer medida posterior."], ["Caso comentado", "Uma pessoa é surpreendida enquanto subtrai um objeto. A situação se enquadra, em princípio, no art. 302, I. Já alguém localizado dias depois, sem perseguição contínua nem outros requisitos, não se torna automaticamente preso em flagrante só porque foi identificado como suspeito."], ["Pegadinhas", "“Qualquer pessoa deve prender em flagrante” está incorreto: para qualquer pessoa do povo, a redação legal usa “poderá”. “Todo flagrante implica manutenção da prisão” também é incorreto: há controle judicial e análise de medidas cabíveis."], ["Roteiro de leitura", "Estude em conjunto os arts. 301 a 310 do CPP e o art. 5º da Constituição. Faça fichas separando hipótese de flagrante, procedimento, direitos e decisão judicial."]]}, {"d": 3, "title": "Processo Civil — competência, partes e capacidade", "time": 55, "parts": [["Jurisdição e competência", "Jurisdição é a função estatal de solucionar conflitos nos termos do ordenamento; competência é a parcela dessa atividade atribuída a determinado órgão. As regras de competência são distribuídas pela Constituição e pelo CPC."], ["Competência absoluta e relativa", "A competência absoluta, em regra ligada a matéria, pessoa ou função, atende a interesses de organização judiciária; a relativa, frequentemente territorial ou de valor em hipóteses previstas, protege interesses das partes. O CPC disciplina alegação e reconhecimento, com nuances e exceções."], ["Regra territorial geral", "O art. 46 do CPC prevê, como regra geral para ação fundada em direito pessoal ou direito real sobre bens móveis, o foro de domicílio do réu, ressalvadas hipóteses especiais. Não generalize essa regra a todas as ações."], ["Capacidade de ser parte e processual", "É útil distinguir a aptidão para figurar no processo da capacidade para praticar atos processuais por si. A representação ou assistência pode ser necessária em casos previstos na lei. O CPC disciplina capacidade e representação processual nos arts. 70 e seguintes."], ["Legitimidade e interesse", "O art. 17 do CPC estabelece que, para postular em juízo, é necessário ter interesse e legitimidade. Legitimidade se relaciona à pertinência subjetiva da demanda; interesse envolve necessidade e utilidade da tutela pretendida, conforme a construção processual aplicável."], ["Exemplo resolvido", "Uma cobrança contratual comum, sem regra especial aplicável, normalmente parte da regra territorial do domicílio do réu. Antes de escolher foro, contudo, confira se há regra específica, eleição válida de foro ou outra particularidade."], ["Questões de banca", "A Vunesp pode trocar “réu” por “autor” no enunciado sobre o art. 46, ou afirmar que toda incompetência pode ser reconhecida de ofício da mesma maneira. Releia o dispositivo e identifique se a regra é geral ou excepcional."], ["Estudo dirigido", "Leia os arts. 17, 46, 62 a 65 e 70 a 76 do CPC em texto atualizado. Faça um mapa com conceitos, alegação, efeitos e exceções."]]}, {"d": 4, "title": "Constitucional — organização dos Poderes e funções", "time": 55, "parts": [["Separação dos Poderes", "O art. 2º da Constituição afirma que Legislativo, Executivo e Judiciário são Poderes da União, independentes e harmônicos entre si. Independência não significa ausência de controles recíprocos."], ["Funções típicas e atípicas", "O Legislativo tem como funções típicas legislar e fiscalizar; o Executivo, administrar e executar políticas públicas; o Judiciário, exercer jurisdição. Cada Poder também desempenha funções atípicas, como atos administrativos internos."], ["Controle e equilíbrio", "A Constituição prevê mecanismos como veto presidencial, fiscalização parlamentar, controle jurisdicional de constitucionalidade e nomeações sujeitas a procedimentos específicos. Não é correto afirmar que um Poder jamais interfere na atuação de outro."], ["Congresso Nacional", "No âmbito federal, o Legislativo é exercido pelo Congresso Nacional, composto pela Câmara dos Deputados e pelo Senado Federal. Cada Casa tem composição e competências próprias; determinadas matérias dependem de atuação conjunta."], ["Judiciário e tribunais", "O art. 92 da Constituição enumera órgãos do Poder Judiciário. A organização judiciária estadual e as competências específicas dependem de normas constitucionais e legais. O TJ-SP integra a Justiça estadual, não a estrutura de tribunais federais."], ["Caso comentado", "Se uma questão afirmar que o Executivo só pode executar leis e nunca editar atos normativos, ela simplifica indevidamente o sistema. Existem competências normativas previstas na Constituição e na legislação, sujeitas a limites."], ["Pegadinhas", "“Independentes” não quer dizer “sem fiscalização”; “harmônicos” não quer dizer “subordinados”. Cuidado também para não confundir Congresso Nacional com Câmara dos Deputados."], ["Leitura complementar", "Leia os arts. 2º, 44, 59, 76 e 92 da Constituição. Relacione cada artigo ao órgão, à função e a um exemplo concreto."]]}, {"d": 5, "title": "Administrativo — poderes da Administração e abuso", "time": 55, "parts": [["Poder-dever", "A expressão poder-dever indica que certas competências administrativas são atribuídas para atender ao interesse público, e não para conveniência pessoal do agente. O exercício deve observar legalidade, finalidade e demais princípios aplicáveis."], ["Poder hierárquico", "Permite organizar, distribuir e supervisionar funções dentro da estrutura administrativa, nos limites legais. Hierarquia não se confunde com vinculação entre entidades da administração indireta, sujeitas a formas próprias de controle."], ["Poder disciplinar", "Relaciona-se à apuração e sanção de infrações funcionais ou de pessoas submetidas a vínculo jurídico específico com a Administração. O exercício exige devido processo, contraditório e ampla defesa quando cabíveis."], ["Poder regulamentar", "Refere-se à edição de atos normativos administrativos nos limites da competência constitucional e legal. Regulamentos, em regra, não podem criar obrigações primárias sem base jurídica adequada."], ["Poder de polícia", "Consiste na atividade estatal que condiciona ou restringe direitos e atividades em benefício de interesses coletivos juridicamente protegidos. Licenças, fiscalizações e sanções podem integrar esse campo, segundo a lei."], ["Abuso de poder", "Desvio de finalidade ocorre quando a competência é usada para objetivo diverso do previsto; excesso de poder ocorre quando o agente ultrapassa os limites de sua competência. Ambos podem comprometer a validade do ato."], ["Caso resolvido", "Um servidor autorizado a fiscalizar um estabelecimento aplica medida que a lei não permite, ultrapassando sua competência. Há indício de excesso de poder. Se usa competência formalmente existente para perseguir desafeto, o problema é de finalidade."], ["Revisão", "Monte um quadro com hierárquico, disciplinar, regulamentar e polícia. Para cada um, escreva uma definição, um exemplo e um limite jurídico."]]}, {"d": 6, "title": "Legislação interna — método para estudar normas do TJ-SP", "time": 55, "parts": [["Por que estudar o texto exato", "Normas internas variam por tribunal e podem ser alteradas. Para responder com segurança, identifique no edital consolidado quais provimentos, capítulos, artigos e resoluções são cobrados. Este capítulo ensina o método de leitura; não substitui o texto oficial."], ["Mapa de competências", "Ao ler cada dispositivo, destaque o sujeito da norma: juiz, escrivão, servidor, chefia ou unidade. Em seguida, registre o verbo: deve, pode, compete, é vedado. A banca costuma inverter sujeito ou modalidade."], ["Prazos e marcos", "Para cada prazo, anote quantidade, unidade de contagem, termo inicial, possibilidade de prorrogação e destinatário. Evite decorar um número isolado: uma questão pode trocar dias úteis por corridos ou mudar o evento inicial."], ["Rotinas de cartório", "Organize as normas por fluxo: recebimento, registro, movimentação, comunicação, guarda e arquivamento. Quando houver regras específicas para processo digital, separe-as das regras gerais de tramitação física."], ["Exemplo de técnica", "Suponha que uma norma diga “a unidade deverá registrar o recebimento no sistema”. Um item que diga “a unidade poderá registrar” muda dever para faculdade. Mesmo sem alterar o objeto, a troca do verbo pode tornar a assertiva falsa."], ["Fichamento eficiente", "Crie uma ficha com: referência do artigo, quem age, o que faz, prazo, exceção e consequência. Depois transforme em pergunta de recuperação: “Quem registra?”, “Em que prazo?”, “Quando há exceção?”."], ["Controle de atualização", "Sempre compare a versão consolidada com as alterações indicadas pela fonte oficial. Em especial, não memorize dispositivos revogados ou renumerados a partir de materiais antigos."], ["Prática guiada", "Escolha um artigo efetivamente listado no edital e explique-o com suas palavras sem mudar o comando normativo. Depois escreva uma alternativa correta e três erradas trocando sujeito, prazo ou exceção."]]}, {"d": 7, "title": "Atualidades — leitura crítica de indicadores e notícias", "time": 55, "parts": [["Fato, interpretação e opinião", "Uma notícia pode misturar dado verificável, interpretação e opinião. “O índice foi divulgado em determinada data” é fato verificável; “o resultado demonstra sucesso absoluto” já é avaliação que exige critérios."], ["Fonte primária", "Prefira consultar comunicados oficiais, institutos de estatística, tribunais e órgãos públicos para confirmar números e decisões. Veículos jornalísticos ajudam a contextualizar, mas não substituem a leitura da fonte quando a pergunta exige precisão."], ["Variação percentual", "Se um indicador vai de 100 para 115, a alta é de 15%. Se cai de 115 para 100, a queda é de aproximadamente 13,04%, pois a base agora é 115. Mudanças de base são armadilhas comuns."], ["Inflação e deflação", "Inflação é aumento generalizado de preços medido por índices específicos; desaceleração da inflação não significa queda do nível de preços. Deflação é variação negativa do índice no período considerado."], ["Competência institucional", "Antes de concluir quem pode adotar uma medida, verifique se a decisão cabe a município, estado, União, tribunal ou órgão regulador. Notícias frequentemente envolvem propostas ainda não convertidas em normas."], ["Meio ambiente e dados", "Separe eventos isolados de tendências medidas por séries históricas. Ao avaliar afirmações ambientais, procure período analisado, metodologia e limites dos dados."], ["Exemplo resolvido", "“Desemprego caiu de 8% para 7%”: a diferença é de 1 ponto percentual; a redução relativa é de 12,5% em relação aos 8% iniciais. As duas medidas não são intercambiáveis."], ["Rotina semanal", "Registre cinco acontecimentos com data, fonte, fato principal, atores e consequências. Uma semana depois, revise sem consultar. Para prova, confira sempre o recorte temporal e temático previsto no edital."]]}, {"d": 8, "title": "Matemática — equações do primeiro grau e problemas", "time": 55, "parts": [["Ideia de equação", "Equação é uma igualdade que contém incógnita. Resolver significa encontrar valores que tornam a igualdade verdadeira. Em 3x + 5 = 20, subtraia 5 dos dois lados e divida por 3: x = 5."], ["Princípio de equivalência", "Uma operação aplicada igualmente aos dois membros preserva a igualdade, desde que seja válida. Em 2(x − 3) = 10, distribua ou divida por 2: x − 3 = 5, então x = 8."], ["Tradução do enunciado", "“O dobro de um número aumentado de 7 é 25” normalmente representa 2x + 7 = 25; x = 9. Leia com atenção: “o dobro da soma de um número com 7” seria 2(x + 7), outra expressão."], ["Problemas de idade", "Ana tem o triplo da idade de Bruno; juntos somam 48. Se Bruno tem x, Ana tem 3x. Logo 4x = 48, x = 12 e Ana tem 36. Confira: 12 + 36 = 48."], ["Sistemas simples", "Se dois produtos somam R$ 30 e um custa R$ 6 a mais que o outro, escreva x + y = 30 e x = y + 6. Substituindo: 2y + 6 = 30; y = 12 e x = 18."], ["Frações na equação", "Para resolver x/3 + 2 = 7, subtraia 2: x/3 = 5; multiplique por 3: x = 15. Se houver vários denominadores, o mínimo múltiplo comum pode simplificar as contas."], ["Erros frequentes", "Evite “passar para o outro lado e trocar o sinal” sem compreender a operação. Esse atalho costuma gerar erro com multiplicação, divisão e parênteses. Escreva cada transformação e confira substituindo o resultado."], ["Treino guiado", "Resolva 5x − 4 = 21 (x = 5), 4(x + 2) = 28 (x = 5) e x/2 + x/3 = 10 (x = 12). Depois explique por que cada resposta satisfaz a igualdade original."]]}, {"d": 9, "title": "Informática — Word, estilos e revisão de documentos", "time": 55, "parts": [["Estrutura do documento", "Editores de texto permitem separar conteúdo e apresentação. Um documento profissional usa títulos, subtítulos, parágrafos e listas consistentes. Formatação manual repetida pode dificultar revisões futuras."], ["Estilos", "Estilos aplicam conjuntos de formatação a elementos do documento. Usar “Título 1”, “Título 2” e “Normal” ajuda a manter hierarquia e pode facilitar a criação de sumário automático."], ["Quebra de página e seção", "Quebra de página inicia nova página sem criar necessariamente uma seção independente. Quebras de seção permitem, conforme o tipo, alterar características como cabeçalhos, rodapés e orientação de páginas em partes distintas."], ["Localizar e substituir", "A ferramenta de localizar identifica ocorrências de palavras ou expressões; substituir permite alterar ocorrências selecionadas ou todas. Antes de substituir tudo, verifique se a expressão também aparece em contextos em que não deve ser alterada."], ["Comentários e controle de alterações", "Comentários registram observações. Controle de alterações destaca inserções, exclusões e outras modificações para posterior aceitação ou rejeição. Uma alteração registrada não equivale automaticamente a alteração aprovada."], ["Cabeçalhos, rodapés e numeração", "Cabeçalhos e rodapés exibem informações repetidas, como título e número de página. A configuração pode variar por seção, primeira página e páginas pares/ímpares, conforme o editor e a versão."], ["Exemplo prático", "Para produzir um relatório com sumário: aplique estilos de título aos capítulos; insira sumário automático; edite os capítulos; atualize o sumário. Digitar manualmente os números das páginas torna a manutenção mais difícil."], ["Revisão Vunesp", "Questões podem confundir quebra de página com quebra de seção, comentários com controle de alterações ou sumário manual com automático. Confira a versão do programa prevista no edital, pois nomes de comandos variam."]]}, {"d": 10, "title": "Raciocínio Lógico — argumentos e validade", "time": 55, "parts": [["Proposição e argumento", "Proposição é enunciado ao qual se pode atribuir valor lógico verdadeiro ou falso. Um argumento reúne premissas e conclusão. A validade depende da estrutura: não é sinônimo de premissas verdadeiras."], ["Modus ponens", "Estrutura válida: “Se P, então Q”; “P”; logo, “Q”. Exemplo: “Se o sistema está indisponível, o atendimento é suspenso”; “O sistema está indisponível”; logo, “O atendimento é suspenso”."], ["Modus tollens", "Estrutura válida: “Se P, então Q”; “não Q”; logo, “não P”. Exemplo: “Se o documento foi autenticado, existe registro”; “Não existe registro”; logo, “O documento não foi autenticado”, supondo as premissas como dadas."], ["Afirmação do consequente", "Falácia: “Se P, então Q”; “Q”; logo, “P”. Exemplo: “Se chove, a rua fica molhada”; “A rua está molhada”; logo, “choveu”. A rua pode estar molhada por outra causa."], ["Negação do antecedente", "Falácia: “Se P, então Q”; “não P”; logo, “não Q”. Exemplo: “Se estudo, melhoro”; “Não estudei”; logo, “Não melhorei”. A melhora pode ocorrer por outras razões."], ["Contrapositiva", "“Se P, então Q” é logicamente equivalente a “Se não Q, então não P”. Não confunda com a recíproca “Se Q, então P”, que não é equivalente em geral."], ["Questão resolvida", "Premissas: “Todo técnico é servidor”; “Carlos é técnico”. Conclusão: “Carlos é servidor”. É válida, pois o pertencimento de Carlos ao conjunto dos técnicos implica pertencimento ao conjunto dos servidores."], ["Treino", "Classifique: (1) Se P então Q; P; Q — válido. (2) Se P então Q; Q; P — inválido. (3) Se P então Q; não Q; não P — válido. Explique a estrutura antes de olhar os exemplos."]]}] );

<script>

digitalModules.push(...[{"d": 0, "title": "Interpretação de textos — coesão, coerência e conectivos", "time": 65, "parts": [["Compreensão literal", "Primeiro identifique o que o texto efetivamente afirma. A banca pode apresentar uma alternativa plausível no mundo real, mas sem apoio no trecho. Em uma passagem que diga “parte dos usuários relatou demora”, não é correto concluir que “todos os usuários enfrentaram demora”."], ["Inferência", "Inferir é extrair conclusão sustentada por pistas do texto, sem inventar informação. Se o autor afirma que o atendimento digital cresceu enquanto o presencial diminuiu, pode-se inferir uma mudança na distribuição dos canais; não se pode afirmar, sem dados, que o presencial foi extinto."], ["Coesão referencial", "Pronomes, expressões sinônimas e elipses retomam termos anteriores. Em “A servidora conferiu os autos e os encaminhou”, “os” retoma “autos”. Para resolver questões, substitua mentalmente o pronome pelo referente e verifique se a frase mantém sentido."], ["Conectivos e relações", "“Embora” introduz concessão; “portanto”, conclusão; “porque”, causa ou explicação conforme o contexto; “contudo”, oposição; “à medida que”, proporcionalidade. A troca de conectivo pode modificar o argumento mesmo que a frase continue gramatical."], ["Coerência e contradição", "Coerência é a articulação lógica das ideias. Um texto pode estar gramaticalmente correto e ser contraditório: “Todos compareceram, mas ninguém esteve presente”. Em provas, identifique incompatibilidades e mudanças indevidas de escopo."], ["Pressuposto e subentendido", "Em “O setor voltou a funcionar”, pressupõe-se funcionamento anterior e interrupção. O pressuposto está acionado pela expressão “voltou a”; o subentendido depende mais do contexto e da intenção comunicativa."], ["Exemplo resolvido", "Trecho: “Apesar da redução de filas, o tempo médio de atendimento permaneceu estável”. É correta a conclusão de que as filas diminuíram, mas não a de que cada atendimento ficou mais rápido. “Apesar de” indica contraste entre fatos."], ["Questão de fixação", "Enunciado: “Embora o sistema tenha sido atualizado, alguns erros persistiram.” Qual relação o conectivo estabelece? A) causa B) concessão C) finalidade D) condição. Gabarito: B. “Embora” admite um fato contrário à expectativa sem negar a oração principal."]]}, {"d": 0, "title": "Sintaxe — sujeito, predicado, complementos e adjuntos", "time": 65, "parts": [["Identificação do verbo", "Comece localizando o núcleo verbal e pergunte quem pratica ou sofre a ação. Em “Chegaram ao fórum novos servidores”, o sujeito é “novos servidores”, posposto ao verbo; por isso “chegaram” está no plural."], ["Sujeito simples e composto", "O sujeito simples tem um núcleo: “O escrevente protocolou”. O composto tem mais de um: “O escrevente e a chefia conferiram”. Sujeito não é sinônimo de primeiro termo da frase."], ["Sujeito indeterminado", "Em “Precisa-se de servidores”, o verbo é transitivo indireto e “se” funciona como índice de indeterminação; a forma fica no singular. Compare com “Vendem-se livros”, em que “livros” é sujeito paciente e o verbo concorda no plural."], ["Verbos transitivos", "Verbo transitivo direto pede complemento sem preposição obrigatória: “analisou o processo”. Indireto exige preposição: “assistiu ao julgamento” no sentido de presenciar. Alguns verbos mudam a regência conforme o sentido."], ["Objeto e predicativo", "Em “Consideraram o relatório adequado”, “o relatório” é objeto direto e “adequado” é predicativo do objeto, pois atribui qualidade ao relatório. Em “O relatório parece adequado”, “adequado” é predicativo do sujeito."], ["Adjunto adverbial", "Indica circunstâncias como tempo, lugar, modo e causa: “Ontem, no cartório, a equipe trabalhou rapidamente”. A posição do adjunto pode justificar vírgulas, mas não autoriza separar sujeito e verbo."], ["Voz passiva", "Em “O juiz analisou o pedido”, a voz passiva analítica é “O pedido foi analisado pelo juiz”. O objeto direto da ativa passa a sujeito paciente. Nem todo verbo admite passiva."], ["Exercício resolvido", "“Divulgaram-se os resultados.” O termo “os resultados” é sujeito paciente; o verbo concorda no plural. Já “Necessita-se de informações” mantém singular porque “de informações” é complemento preposicionado."]]}, {"d": 1, "title": "Direito Penal — concurso de pessoas e culpabilidade", "time": 65, "parts": [["Estrutura do crime", "Na teoria analítica frequentemente adotada, examinam-se fato típico, ilicitude e culpabilidade. A análise é sucessiva: conduta típica pode não ser ilícita se houver legítima defesa, por exemplo."], ["Concurso de pessoas", "O art. 29 do Código Penal estabelece, em regra, que quem concorre para o crime incide nas penas a ele cominadas na medida de sua culpabilidade. É preciso distinguir autoria, coautoria e participação conforme o caso."], ["Vínculo subjetivo", "Em regra, a participação exige consciência de colaborar com a infração. Duas pessoas que agem independentemente, sem liame subjetivo, não formam automaticamente concurso de agentes."], ["Participação de menor importância", "O art. 29, §1º, prevê redução de pena de um sexto a um terço quando a participação for de menor importância. Não confunda a minorante com a inexistência de responsabilidade."], ["Circunstâncias pessoais", "O art. 30 dispõe que circunstâncias e condições de caráter pessoal não se comunicam, salvo quando elementares do crime. Exemplo clássico: qualidade funcional pode ser elementar em crime próprio, conforme requisitos do caso."], ["Culpabilidade", "Imputabilidade, potencial consciência da ilicitude e exigibilidade de conduta diversa integram a análise tradicional. Ausência de um desses requisitos pode excluir culpabilidade, ainda que haja fato típico e ilícito."], ["Erro de proibição", "Pelo art. 21, desconhecimento da lei é inescusável; erro sobre a ilicitude do fato, se inevitável, isenta de pena, e, se evitável, pode diminuí-la de um sexto a um terço. Não confundir com erro de tipo do art. 20."], ["Exemplo e fixação", "Um agente entrega conscientemente ferramenta a outro para facilitar furto, aderindo ao plano: pode responder como partícipe. Se desconhece a finalidade ilícita, a conclusão muda. Leia os arts. 20, 21, 29 e 30 do CP."]]}, {"d": 2, "title": "Processo Penal — citação, intimação e resposta à acusação", "time": 65, "parts": [["Citação e intimação", "Citação comunica formalmente a acusação e chama o acusado ao processo. Intimação dá ciência de atos e decisões processuais. A distinção é relevante porque cada ato tem finalidade e consequências próprias."], ["Citação pessoal", "O CPP disciplina modalidades de citação e situações especiais. Verifique os arts. 351 e seguintes, distinguindo citação por mandado, edital e hora certa conforme requisitos legais."], ["Citação por edital", "Quando cabível, a citação editalícia é excepcional. O art. 366 prevê, em certas condições, suspensão do processo e do prazo prescricional quando o acusado citado por edital não comparece nem constitui advogado; a análise concreta exige atenção à jurisprudência e limites."], ["Resposta à acusação", "Nos procedimentos a que se aplica o art. 396-A, o acusado pode arguir preliminares, alegar tudo que interesse à defesa, oferecer documentos, justificar provas e arrolar testemunhas conforme regras do rito."], ["Prazo da resposta", "O art. 396 estabelece prazo de 10 dias para resposta à acusação, observadas as regras aplicáveis. Não confunda esse prazo com outros prazos do CPP ou com procedimentos especiais."], ["Absolvição sumária", "O art. 397 prevê hipóteses de absolvição sumária, como existência manifesta de causa excludente da ilicitude ou da culpabilidade (ressalvada inimputabilidade), fato evidentemente não constituir crime e extinção da punibilidade."], ["Exemplo resolvido", "Uma questão afirma que a resposta à acusação serve exclusivamente para negar os fatos. Está errada: o art. 396-A permite preliminares, documentos, especificação de provas e rol de testemunhas."], ["Treino", "Compare: citação = chamamento formal; intimação = ciência; resposta à acusação = exercício inicial de defesa. Consulte a redação atual dos arts. 351–370 e 396–397 do CPP."]]}, {"d": 3, "title": "Processo Civil — prazos, contagem e atos processuais", "time": 65, "parts": [["Prazos processuais", "Prazos podem ser legais ou fixados pelo juiz nos limites normativos. Não é seguro decorar um prazo genérico para todo ato: o CPC prevê prazos específicos e regras subsidiárias."], ["Dias úteis", "O art. 219 do CPC determina que, na contagem de prazo em dias estabelecido por lei ou pelo juiz, computam-se somente dias úteis, aplicando-se a regra aos prazos processuais. Não estenda automaticamente a prazos de direito material."], ["Exclusão e inclusão", "O art. 224 prevê, salvo disposição em contrário, excluir o dia do começo e incluir o do vencimento. A identificação do começo do prazo depende também das regras de intimação e publicação."], ["Prazo subsidiário", "O art. 218, §3º, prevê prazo de cinco dias para ato processual a cargo da parte quando não houver preceito legal nem prazo determinado pelo juiz. Trata-se de regra subsidiária, não universal."], ["Preclusão", "Preclusão é a perda da faculdade processual em razão de prazo, prática de ato incompatível ou exercício anterior, conforme a modalidade. Diferencie preclusão de prescrição, que diz respeito à pretensão material."], ["Negócios processuais", "O art. 190 admite, em determinadas condições, negócios jurídicos processuais sobre ônus, poderes, faculdades e deveres processuais. Não se trata de liberdade irrestrita: o juiz controla validade nas hipóteses legais."], ["Exemplo resolvido", "Um prazo processual de cinco dias que se inicia segundo a regra de intimação não deve ser contado simplesmente somando cinco dias corridos. É preciso aplicar arts. 219, 224 e a regra pertinente ao termo inicial."], ["Revisão", "Faça tabela com arts. 218, 219, 220, 224 e 231 do CPC. Para cada um, escreva objeto da regra, exceções e um exemplo de aplicação."]]}, {"d": 4, "title": "Constitucional — remédios constitucionais e garantias", "time": 65, "parts": [["Habeas corpus", "Art. 5º, LXVIII: protege a liberdade de locomoção contra violência ou coação por ilegalidade ou abuso de poder, atual ou ameaçada. Não serve como instrumento geral para discutir qualquer direito."], ["Mandado de segurança", "Art. 5º, LXIX: protege direito líquido e certo não amparado por habeas corpus ou habeas data, contra ilegalidade ou abuso de poder de autoridade, conforme requisitos legais. A prova deve ser pré-constituída."], ["Mandado de segurança coletivo", "Art. 5º, LXX: pode ser impetrado por legitimados constitucionais, como partido político com representação no Congresso e certas organizações, conforme condições previstas."], ["Habeas data", "Art. 5º, LXXII: tutela conhecimento e retificação de informações pessoais em registros ou bancos de dados de entidades governamentais ou de caráter público, nos termos da lei."], ["Mandado de injunção", "Art. 5º, LXXI: cabível quando falta de norma regulamentadora inviabiliza exercício de direitos e liberdades constitucionais e prerrogativas inerentes à nacionalidade, soberania e cidadania."], ["Ação popular", "Art. 5º, LXXIII: cidadão pode propor ação para anular ato lesivo aos bens e valores constitucionalmente indicados, observada a legislação. Cidadão, para esse fim, não é qualquer pessoa jurídica."], ["Questão comparativa", "Uma pessoa quer corrigir dado pessoal em banco público: pense em habeas data. Se quer proteção de locomoção contra prisão ilegal: habeas corpus. Se há direito líquido e certo sem esses enquadramentos: examine mandado de segurança."], ["Leitura dirigida", "Leia art. 5º, incisos LXVIII a LXXIII, e faça quadro: direito protegido, legitimidade, requisito e exemplo. A Vunesp pode trocar as finalidades dos instrumentos."]]}, {"d": 5, "title": "Administrativo — responsabilidade civil do Estado", "time": 65, "parts": [["Base constitucional", "O art. 37, §6º, da Constituição prevê responsabilidade das pessoas jurídicas de direito público e das de direito privado prestadoras de serviços públicos pelos danos que seus agentes, nessa qualidade, causarem a terceiros."], ["Responsabilidade objetiva", "Na regra constitucional, a vítima não precisa demonstrar culpa do agente para responsabilizar a pessoa jurídica; deve haver dano e nexo causal, observadas peculiaridades e excludentes aplicáveis."], ["Teoria do risco administrativo", "A responsabilidade objetiva não equivale a responsabilidade automática em qualquer situação. Culpa exclusiva da vítima e outros fatores podem romper o nexo causal conforme o caso."], ["Ação regressiva", "O próprio art. 37, §6º, assegura direito de regresso contra o responsável nos casos de dolo ou culpa. Diferencie a responsabilidade objetiva perante a vítima da responsabilidade subjetiva no regresso."], ["Condutas omissivas", "A responsabilidade por omissão envolve distinções relevantes na jurisprudência, inclusive dever específico de agir. Evite afirmar que toda omissão gera responsabilidade objetiva ou subjetiva sem examinar o contexto."], ["Agente nessa qualidade", "A norma exige relação entre a atuação do agente e a função pública. Um dano inteiramente desvinculado dessa qualidade não se enquadra automaticamente no art. 37, §6º."], ["Exemplo resolvido", "Viatura oficial, conduzida por agente em serviço, causa dano a terceiro. A análise inicial da responsabilidade estatal concentra-se em dano, nexo e atuação funcional; eventual ação regressiva examinará dolo ou culpa do agente."], ["Fixação", "Complete: vítima contra o Estado = regra de responsabilidade objetiva; Estado contra agente em regresso = exige dolo ou culpa. Leia literalmente o §6º do art. 37."]]}, {"d": 8, "title": "Matemática — análise combinatória e probabilidade", "time": 65, "parts": [["Princípio multiplicativo", "Se uma tarefa tem 3 opções independentes para primeira etapa e 4 para segunda, existem 3 × 4 = 12 combinações. Antes de multiplicar, confira se as escolhas realmente são independentes."], ["Permutação", "Para organizar 4 objetos distintos em fila, há 4! = 4×3×2×1 = 24 ordens. Se objetos são repetidos, a fórmula muda: para letras de “ANA”, são 3!/2! = 3 arranjos distintos."], ["Arranjo", "Quando ordem importa e escolhemos p entre n elementos distintos, A(n,p)=n!/(n−p)!. Exemplo: presidente e vice entre 5 pessoas: 5×4=20 possibilidades."], ["Combinação", "Quando ordem não importa, C(n,p)=n!/[p!(n−p)!]. Uma comissão de 2 pessoas entre 5 pode ser formada de C(5,2)=10 maneiras."], ["Probabilidade básica", "Em resultados equiprováveis, P(evento)=casos favoráveis/casos possíveis. Em dado justo, P(número par)=3/6=1/2. O pressuposto de equiprobabilidade precisa ser justificado."], ["Evento complementar", "P(não A)=1−P(A). Para calcular probabilidade de pelo menos um sucesso em duas tentativas independentes, frequentemente é mais fácil subtrair a probabilidade de nenhum sucesso."], ["Exemplo resolvido", "Uma urna tem 3 bolas azuis e 2 vermelhas. Sem reposição, probabilidade de retirar duas azuis = 3/5 × 2/4 = 3/10. Com reposição, seria 3/5 × 3/5 = 9/25."], ["Armadilhas", "“Escolher” costuma sugerir combinação; “ordenar”, arranjo ou permutação. Verifique se há reposição, se a ordem importa e se os eventos são independentes."]]}, {"d": 9, "title": "Informática — Excel: SE, CONT.SE, SOMASE e PROCV", "time": 65, "parts": [["Sintaxe das fórmulas", "Em Excel configurado em português, funções frequentemente usam ponto e vírgula como separador. A sintaxe pode variar conforme idioma e configurações. Referências A1 e $A$1 seguem regras distintas de cópia."], ["Função SE", "=SE(A1>=7;\"Aprovado\";\"Revisar\") testa condição lógica e devolve um resultado para verdadeiro e outro para falso. Não confunda o teste com o valor retornado."], ["Função CONT.SE", "=CONT.SE(B2:B20;\"Pago\") conta células do intervalo que satisfazem o critério. Não soma valores monetários; conta ocorrências."], ["Função SOMASE", "=SOMASE(A2:A10;\"Sul\";B2:B10) soma valores em B2:B10 apenas quando o critério “Sul” é atendido em A2:A10. Intervalos devem estar coerentes."], ["Função PROCV", "=PROCV(E2;A2:C20;3;FALSO) procura o valor de E2 na primeira coluna do intervalo A2:C20 e retorna o valor da terceira coluna na linha encontrada, exigindo correspondência exata."], ["PROCV e correspondência", "O quarto argumento FALSO exige correspondência exata; VERDADEIRO permite aproximada em condições específicas. PROCV tradicional busca pela primeira coluna da matriz, não por qualquer coluna arbitrária."], ["Referências mistas", "Em =$A1+B$2, ao copiar uma coluna à direita e duas linhas abaixo, obtém-se =$A3+C$2. O cifrão fixa somente a dimensão à qual está associado."], ["Exemplo resolvido", "A2:A5 contém “Sim”, “Não”, “Sim”, “Sim”. =CONT.SE(A2:A5;\"Sim\") resulta em 3. Se B2:B5 vale 10, 20, 30, 40, =SOMASE(A2:A5;\"Sim\";B2:B5) resulta em 80."]]}, {"d": 10, "title": "Raciocínio Lógico — quantificadores e diagramas", "time": 65, "parts": [["Universal afirmativa", "“Todo A é B” significa que o conjunto A está contido em B. Não significa que todo B é A, nem que A e B sejam idênticos."], ["Existencial afirmativa", "“Algum A é B” afirma existência de ao menos um elemento na interseção. Não significa maioria nem exclusividade."], ["Universal negativa", "“Nenhum A é B” afirma interseção vazia entre os conjuntos. É diferente de “Nem todo A é B”, que admite alguns elementos em comum."], ["Negação de todo", "Negação de “Todos os servidores são pontuais” é “Pelo menos um servidor não é pontual”. Não é “Nenhum servidor é pontual”."], ["Negação de algum", "Negação de “Algum documento está assinado” é “Nenhum documento está assinado”, ou equivalentemente “Todos os documentos não estão assinados”."], ["Implicação de conjuntos", "Se todo A é B e todo B é C, então todo A é C. Mas, se algum A é B e algum B é C, não se conclui necessariamente que algum A é C."], ["Exemplo resolvido", "Premissas: “Todos os escreventes são servidores”; “Alguns servidores trabalham remotamente”. Não é possível concluir que alguns escreventes trabalham remotamente, pois os servidores remotos podem não ser escreventes."], ["Questão de fixação", "Negue: “Todos os processos foram digitalizados”. Resposta: “Pelo menos um processo não foi digitalizado”. A negação deve produzir contradição exata, sem exagerar o alcance."]]}, {"d": 6, "title": "Legislação institucional — como interpretar deveres e competências", "time": 65, "parts": [["Delimitação", "Este é um capítulo de técnica de leitura normativa, não transcrição das Normas da Corregedoria. Para estudar o conteúdo exigido, é indispensável conferir os dispositivos e versões expressamente indicados no edital oficial."], ["Verbos de comando", "“Deverá” exprime obrigação; “poderá” indica faculdade condicionada ao contexto; “é vedado” estabelece proibição; “compete” atribui responsabilidade. A substituição de um verbo por outro altera a regra."], ["Sujeitos e atribuições", "Sublinhe quem deve praticar cada ato: magistrado, chefia, escrivão, escrevente, servidor ou unidade. Uma questão pode manter a atividade correta e trocar a autoridade competente."], ["Condições e exceções", "Marque “salvo”, “exceto”, “desde que” e “somente”. Exemplo hipotético: “É permitida a consulta, salvo em sigilo”. Dizer “consulta sempre permitida” elimina exceção e torna o item incorreto."], ["Prazos", "Registre início, duração, unidade de contagem, prorrogação e destinatário. Prazos de atos administrativos e processuais podem obedecer a regras distintas."], ["Processos digitais", "Ao comparar rotina física e eletrônica, identifique o sistema, a atribuição e o registro exigido pela norma específica. Evite importar procedimentos antigos sem verificar atualização."], ["Caso didático", "Norma hipotética: “A chefia deverá registrar a ocorrência em até dois dias”. Alternativa “qualquer servidor poderá registrar em cinco dias” altera sujeito, modalidade e prazo; há três erros independentes."], ["Plano de estudo", "Para cada artigo oficial: copie referência; resuma sujeito, verbo, objeto, prazo e exceção; crie duas questões, uma correta e outra com uma única alteração. Revise com o texto atualizado ao lado."]]}, {"d": 7, "title": "Atualidades — organização do Estado e leitura de indicadores", "time": 65, "parts": [["Três esferas federativas", "União, estados, Distrito Federal e municípios possuem competências constitucionais próprias. Uma notícia sobre lei municipal não significa mudança nacional automática."], ["Proposta versus norma vigente", "Projeto de lei, decisão judicial, decreto e lei promulgada são atos distintos. Ao ler notícia, pergunte se a medida foi apenas anunciada, aprovada, sancionada, publicada ou efetivamente entrou em vigor."], ["Inflação e juros", "Inflação mede variação de preços em índice e período determinados. Juros são preço do crédito ou remuneração do capital. Aumento de juros não implica queda imediata dos preços."], ["PIB e renda", "PIB mede produção de bens e serviços finais em um período, não a riqueza total acumulada. Crescimento do PIB não implica automaticamente melhora igual de renda para todas as famílias."], ["Ponto percentual", "Taxa que sobe de 6% para 9% aumenta 3 pontos percentuais, ou 50% em termos relativos. Questões confundem essas duas medidas."], ["Fontes de dados", "IBGE produz estatísticas oficiais, como pesquisas demográficas e econômicas. Banco Central divulga dados monetários e financeiros; TSE publica informações eleitorais. Verifique sempre metodologia e data."], ["Notícia e opinião", "“O índice caiu 2 pontos” é descrição verificável; “a política foi um fracasso” é juízo de valor. A alternativa correta depende do que a fonte efetivamente sustenta."], ["Treino orientado", "Escolha uma notícia atual e registre data, fonte, fato, esfera de governo, situação jurídica e números. Depois crie uma pergunta sobre o que o texto NÃO permite concluir."]]}]);

digitalModules.push(...[{"d":0,"title":"Português — classes de palavras e funções sintáticas","time":55,"parts":[["Classe não é função","Substantivo nomeia seres e conceitos; adjetivo caracteriza; advérbio modifica verbo, adjetivo ou outro advérbio. Já sujeito, objeto e adjunto são funções sintáticas. Em “O servidor atento respondeu rapidamente”, servidor é substantivo e núcleo do sujeito; atento é adjetivo e adjunto adnominal; rapidamente é advérbio e adjunto adverbial."],["Artigos e pronomes","O artigo determina substantivos: “o processo”. O pronome pode acompanhar ou substituir nomes: “este processo” (determinante demonstrativo), “ele” (substituição). Em provas, observe o referente de “este”, “esse”, “aquele” e de pronomes relativos."],["Preposição e regência","Preposições ligam termos: “necessidade de revisão”, “favorável ao pedido”. A regência é a relação exigida pelo nome ou verbo. Não basta memorizar uma preposição isolada; o sentido do verbo pode alterar a construção."],["Conjunções e sentido","“Embora” exprime concessão; “porque”, causa ou explicação conforme o contexto; “portanto”, conclusão; “caso”, condição. A troca de conectivos só preserva sentido quando a relação lógica permanece."],["Sujeito e predicado","Em “Chegaram os documentos”, o sujeito é “os documentos”, ainda que venha depois do verbo. Em “Há documentos pendentes”, haver com sentido de existir é impessoal e fica no singular. Em “Existem documentos pendentes”, existir concorda com o sujeito plural."],["Complementos verbais","“O escrevente conferiu os autos”: “os autos” é objeto direto. “O escrevente obedeceu à ordem”: “à ordem” é objeto indireto. Observe que a crase decorre da preposição a exigida por obedecer somada ao artigo a."],["Exemplo resolvido","Frase: “Os candidatos dedicados resolveram rapidamente as questões”. Sujeito: os candidatos dedicados; núcleo: candidatos; verbo: resolveram; objeto direto: as questões; adjunto adverbial: rapidamente. “Dedicados” é adjetivo com função de adjunto adnominal."],["Treino comentado","Pergunta: em “Faltam duas assinaturas”, qual é o sujeito? “Duas assinaturas”, porque é o elemento com que o verbo concorda. A frase “Falta duas assinaturas” é inadequada na norma-padrão."]]},{"d":0,"title":"Português — concordância e regência em casos difíceis","time":55,"parts":[["Concordância com porcentagem","A concordância com porcentagens depende da construção. “1% dos inscritos faltou/faltaram” admite análises normativas conforme o núcleo percentual e o especificador; em concursos, leia cuidadosamente a gramática adotada e o contexto. Evite regra simplista para todos os casos."],["Verbos impessoais","Haver no sentido de existir: “Havia muitos processos”. Fazer indicando tempo decorrido: “Faz dois anos”. Em locuções, a impessoalidade alcança o auxiliar: “Deve haver recursos”."],["Sujeito composto","Sujeito composto anteposto costuma levar verbo ao plural: “A chefia e os servidores compareceram”. Com sujeito posposto, pode haver concordância com o núcleo mais próximo em construções admitidas; atenção à norma-padrão."],["Concordância nominal","Adjetivo posposto a dois substantivos pode ir ao plural: “documentos e certidões atualizados”. “É proibida a entrada” apresenta artigo e concordância; “É proibido entrada” é construção sem determinante, sujeita à regra própria."],["Assistir e visar","Assistir no sentido de presenciar é tradicionalmente transitivo indireto: “assistir ao julgamento”. Visar no sentido de almejar pode exigir a preposição a na norma formal: “visar ao cargo”. Uso contemporâneo e tradição gramatical nem sempre coincidem; provas tendem a cobrar norma culta."],["Preferir e obedecer","Preferir X a Y: “Prefiro estudar a improvisar”, não “prefiro mais X do que Y”. Obedecer pede a: “obedecer às normas”. A crase aparece se o substantivo feminino admite artigo."],["Caso resolvido","Complete: “___ dois meses que ___ muitas reclamações”. Resposta: “Faz dois meses que há muitas reclamações”. Os dois verbos estão empregados impessoalmente."],["Fixação","Corrija: “Devem haver novas provas”. Correto: “Deve haver novas provas”. Explique: o auxiliar permanece no singular porque haver tem sentido de existir."]]},{"d":1,"title":"Direito Penal — peculato, concussão e corrupção: comparação","time":55,"parts":[["Primeiro identifique o sujeito","Crimes funcionais próprios exigem condição especial do agente. Para os efeitos penais, o conceito de funcionário público do art. 327 do CP é mais amplo que o uso cotidiano da expressão."],["Peculato — art. 312","O núcleo da modalidade básica envolve apropriar-se de dinheiro, valor ou outro bem móvel, público ou particular, de que o funcionário tem posse em razão do cargo, ou desviá-lo em proveito próprio ou alheio. O vínculo da posse com o cargo é essencial."],["Peculato-furto","O §1º do art. 312 contempla a subtração, ou concorrência para que seja subtraído, valendo-se o funcionário de facilidade proporcionada pela qualidade funcional, embora não tenha a posse do bem."],["Concussão — art. 316","O verbo central é EXIGIR vantagem indevida, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela. A exigência distingue concussão de solicitação."],["Corrupção passiva — art. 317","Os verbos são SOLICITAR, RECEBER ou ACEITAR PROMESSA de vantagem indevida, nas condições legais. Não confunda o pedido do agente público com a oferta do particular, típica de outro enquadramento."],["Prevaricação — art. 319","Retardar ou deixar de praticar indevidamente ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal. O elemento subjetivo específico é indispensável."],["Quadro mental","Peculato: apropriar/desviar bem sob posse funcional. Concussão: exigir vantagem. Corrupção passiva: solicitar/receber/aceitar promessa. Prevaricação: ato funcional indevido para interesse ou sentimento pessoal."],["Caso e resposta","Servidor exige pagamento para realizar serviço que deveria prestar. A palavra “exige” direciona, em tese, à concussão, desde que presentes os demais elementos. Se apenas solicita, analisa-se corrupção passiva. Confira sempre os tipos e a redação legal vigente."]]},{"d":2,"title":"Processo Penal — prova, contraditório e cadeia de custódia","time":55,"parts":[["Prova e investigação","Elementos informativos colhidos na investigação não se confundem integralmente com provas produzidas sob contraditório judicial. O art. 155 do CPP orienta a formação da convicção judicial e prevê ressalvas para provas cautelares, não repetíveis e antecipadas."],["Contraditório","O contraditório permite ciência e reação à prova, com modalidades de contraditório diferido quando a natureza do ato exigir. Não significa que todo ato investigativo tenha participação simultânea das partes."],["Ônus da prova","No processo penal, a acusação deve demonstrar a imputação. O princípio da presunção de inocência e o standard de prova impedem condenação fundada em mera suspeita."],["Provas ilícitas","O art. 157 do CPP trata da inadmissibilidade das provas ilícitas, assim entendidas as obtidas em violação a normas constitucionais ou legais, e disciplina consequências e exceções legais relacionadas às derivadas."],["Cadeia de custódia","A disciplina legal dos arts. 158-A e seguintes busca documentar a história cronológica do vestígio, do reconhecimento ao descarte, para permitir rastreabilidade e controle de integridade."],["Etapas","Entre as etapas previstas estão reconhecimento, isolamento, fixação, coleta, acondicionamento, transporte, recebimento, processamento, armazenamento e descarte. Uma falha exige análise jurídica concreta de seus efeitos; não se deve afirmar nulidade automática em toda hipótese."],["Exemplo resolvido","Um objeto é recolhido sem identificação do local e sem registro de quem o recebeu. Há problema de rastreabilidade que precisa ser avaliado na confiabilidade da prova e em suas consequências processuais."],["Revisão","Explique por que fotografia de vestígio, laudo pericial e depoimento testemunhal não são a mesma espécie de prova. Leia arts. 155, 157 e 158-A a 158-F do CPP em versão atualizada."]]},{"d":3,"title":"Processo Civil — recursos, decisões e efeitos","time":55,"parts":[["Sentença, decisão e despacho","O CPC diferencia pronunciamentos judiciais. Sentença encerra a fase cognitiva do procedimento comum ou extingue execução nas hipóteses legais; decisão interlocutória tem natureza decisória sem se enquadrar como sentença; despacho impulsiona o processo."],["Apelação","Em regra, cabe apelação da sentença. A interposição, os requisitos e os efeitos devem ser estudados nos dispositivos pertinentes do CPC; há hipóteses de eficácia imediata da sentença previstas em lei."],["Agravo de instrumento","Destina-se a hipóteses legais de decisões interlocutórias, com rol do art. 1.015 e interpretação jurisprudencial relevante. Não se presume cabimento contra toda decisão interlocutória."],["Embargos de declaração","Servem para esclarecer obscuridade, eliminar contradição, suprir omissão ou corrigir erro material. Não são simplesmente “recurso para tentar outra decisão” sem vício identificado."],["Efeito devolutivo","Significa devolver ao órgão julgador a apreciação da matéria impugnada dentro dos limites e regras aplicáveis. Não é sinônimo de suspensão automática da eficácia da decisão."],["Efeito suspensivo","Quando presente, impede provisoriamente a produção de certos efeitos da decisão recorrida, observadas as particularidades legais. Distinga regra geral, exceções e decisões do relator."],["Exemplo resolvido","Se a parte afirma que a sentença deixou de analisar pedido relevante, a via a considerar são embargos de declaração por omissão. Se busca impugnar o mérito da sentença, em regra examina-se apelação."],["Treino","Classifique: pronunciamento que apenas determina juntada de documento, sem decidir controvérsia: em regra despacho. Pronunciamento que resolve questão incidental: decisão interlocutória. Confira arts. 203 e 994 em diante do CPC."]]},{"d":4,"title":"Constitucional — administração pública e concursos","time":55,"parts":[["Princípios expressos","O caput do art. 37 da Constituição enumera legalidade, impessoalidade, moralidade, publicidade e eficiência: LIMPE. O rol não esgota todos os princípios aplicáveis à Administração."],["Legalidade administrativa","A atuação administrativa deve encontrar fundamento no ordenamento. Não se confunde com a liberdade geral do particular, que pode fazer o que a lei não proíbe."],["Impessoalidade e moralidade","A finalidade pública afasta favorecimento pessoal. A moralidade exige padrões jurídicos de probidade e boa-fé, não apenas ausência de crime."],["Publicidade e eficiência","Publicidade viabiliza transparência e controle, respeitados sigilo e proteção de dados. Eficiência exige boa gestão de recursos e qualidade da atuação, sem afastar a legalidade."],["Concurso público","O art. 37, II, estabelece regra de investidura em cargo ou emprego público mediante aprovação prévia em concurso, ressalvadas nomeações para cargos em comissão declarados em lei de livre nomeação e exoneração."],["Validade do concurso","O art. 37, III, prevê prazo de validade de até dois anos, prorrogável uma vez, por igual período. Não significa que todo concurso tenha necessariamente validade inicial de dois anos."],["Acumulação de cargos","A Constituição traz proibições e exceções condicionadas, inclusive compatibilidade de horários e observância do teto. Evite decorar apenas “é proibido acumular” sem as hipóteses constitucionais."],["Questão comentada","Edital fixa validade inicial de um ano. Pode haver prorrogação? Sim, uma vez, por igual período, se observadas as condições aplicáveis. O teto constitucional é de dois anos, não a duração obrigatória de todo certame."]]},{"d":5,"title":"Administrativo — anulação, revogação e convalidação","time":55,"parts":[["Três institutos","Anulação retira ato ilegal; revogação retira ato válido por conveniência e oportunidade, quando juridicamente possível; convalidação sana certos vícios corrigíveis. A distinção começa pela pergunta: o ato é ilegal ou apenas inconveniente?"],["Quem anula","A Administração pode anular seus atos ilegais, e o Judiciário pode exercer controle de legalidade quando provocado e presentes os requisitos. A autotutela não autoriza ignorar devido processo e proteção da confiança."],["Quem revoga","A revogação decorre de mérito administrativo e, em regra, é praticada pela própria Administração competente. O Judiciário não revoga ato administrativo apenas por discordar da conveniência."],["Efeitos no tempo","Tradicionalmente, anulação opera efeitos retroativos e revogação prospectivos, mas há proteção de situações consolidadas e nuances relevantes. Provas podem exigir a regra e suas ressalvas."],["Atos vinculados","Se todos os elementos e o conteúdo estão predeterminados, não há espaço para revogação por simples juízo de oportunidade. Há também atos que não podem ser revogados por terem exaurido seus efeitos."],["Convalidação","A Lei 9.784/1999, art. 55, admite convalidação de atos com defeitos sanáveis quando não acarretar lesão ao interesse público nem prejuízo a terceiros, em seu âmbito de aplicação."],["Exemplo resolvido","Uma autorização válida deixou de ser conveniente para a Administração, e a lei admite sua retirada: examine revogação. Se o ato nasceu com ilegalidade insanável: examine anulação."],["Fixação","“Revogar ato ilegal” está tecnicamente errado como regra de classificação. Ilegalidade conduz à anulação; conveniência/oportunidade, à revogação, com ressalvas legais."]]},{"d":8,"title":"Matemática — sistemas lineares e problemas de idade","time":55,"parts":[["Traduzir o enunciado","Escolha incógnitas e escreva relações antes de calcular. “A soma de dois valores é 40” vira x+y=40. “O primeiro supera o segundo em 6” vira x−y=6."],["Método da adição","No sistema x+y=40 e x−y=6, some as equações: 2x=46; x=23. Substituindo, y=17. Verifique: 23+17=40 e 23−17=6."],["Método da substituição","Se y=40−x, substitua em x−y=6: x−(40−x)=6; 2x=46; x=23. A escolha do método depende da forma do sistema."],["Problemas de idade","“Daqui a cinco anos” soma cinco a cada idade; “há cinco anos” subtrai cinco. A diferença entre idades permanece constante, enquanto a razão entre elas muda."],["Exemplo de idade","Ana tem o dobro da idade de Bia; juntas têm 36 anos. A=2B e A+B=36, logo 3B=36, B=12 e A=24. Daqui a 6 anos terão 18 e 30; Ana já não terá o dobro."],["Problemas com preços","Dois cadernos e uma caneta custam R$ 19; um caderno e duas canetas custam R$ 17. Se c é caderno e p é caneta: 2c+p=19 e c+2p=17. Da primeira p=19−2c; substituindo: c+38−4c=17, então c=7 e p=5."],["Armadilha","Se uma questão pede número de pessoas ou objetos, a solução deve respeitar números inteiros não negativos. Uma equação pode ter solução algébrica que não faz sentido no contexto."],["Pratique","Uma turma tem 30 alunos; há 4 meninas a mais que meninos. m+f=30, f=m+4. Resposta: 13 meninos e 17 meninas."]]},{"d":9,"title":"Informática — segurança, autenticação e golpes digitais","time":55,"parts":[["Confidencialidade, integridade e disponibilidade","Confidencialidade restringe acesso a autorizados; integridade preserva exatidão e impede alterações indevidas; disponibilidade assegura acesso quando necessário. Um ataque pode comprometer mais de um pilar."],["Autenticação e autorização","Autenticação verifica identidade; autorização determina permissões. Entrar com senha prova, em algum nível, quem é o usuário; não significa que possa visualizar qualquer documento."],["Múltiplos fatores","MFA combina fatores distintos: algo que você sabe, possui ou é. Duas senhas não representam necessariamente dois fatores. Aplicativos autenticadores e chaves físicas podem oferecer proteção adicional."],["Phishing","Golpistas simulam mensagens legítimas para induzir clique, entrega de credenciais ou pagamentos. Verifique domínio, remetente, contexto e canal oficial; aparência e logotipo não garantem autenticidade."],["Malware e ransomware","Malware é categoria ampla de software malicioso. Ransomware frequentemente cifra arquivos e exige resgate. Pagar não garante recuperação nem elimina comprometimento."],["Backup 3-2-1","Uma estratégia conhecida é manter três cópias, em dois tipos de mídia, com uma fora do ambiente principal. Para ataques modernos, cópias isoladas ou imutáveis e testes de restauração são especialmente importantes."],["Exemplo resolvido","Um e-mail informa que sua conta será bloqueada e exige senha por link encurtado. Sinais: urgência artificial, solicitação de credenciais e endereço não verificável. A conduta segura é abrir o serviço por canal oficial independente."],["Revisão","Explique: criptografia protege confidencialidade; hash ajuda a verificar integridade; backup apoia recuperação/disponibilidade. Nenhum desses mecanismos substitui todos os demais."]]},{"d":10,"title":"Raciocínio Lógico — condicionais e equivalências","time":55,"parts":[["Condicional","“Se P, então Q” (P→Q) só é falsa quando P é verdadeira e Q é falsa. Se P é falsa, a condicional material é verdadeira, independentemente de Q."],["Condição suficiente e necessária","Em P→Q, P é suficiente para Q; Q é necessária para P. “Se estudo, então aprendo” não permite concluir “se aprendo, então estudei”."],["Contrapositiva","P→Q é equivalente a ¬Q→¬P. Se “Se há aprovação, então houve inscrição”, segue-se “Se não houve inscrição, então não há aprovação”."],["Recíproca e inversa","A recíproca Q→P e a inversa ¬P→¬Q não são, em geral, equivalentes à original. Essa confusão é muito explorada em alternativas."],["Negação da condicional","Negar P→Q produz P∧¬Q. Negação de “Se o servidor chegou, então o sistema abriu”: “O servidor chegou e o sistema não abriu”."],["Bicondicional","P↔Q é verdadeira quando P e Q têm o mesmo valor lógico. Equivale a (P→Q)∧(Q→P). “Se e somente se” é mais forte que “se”."],["Exemplo resolvido","Frase: “Se o documento está assinado, então pode ser protocolado”. A contrapositiva é “Se não pode ser protocolado, então não está assinado”. Não confunda com “Se pode ser protocolado, então está assinado”."],["Pratique","Negue “Se chove, a sessão é cancelada”. Resposta: “Chove e a sessão não é cancelada”. A negação exige um contraexemplo concreto à implicação."]]},{"d":7,"title":"Atualidades — leitura crítica de dados e gráficos","time":55,"parts":[["Fonte e data","Antes de interpretar notícia ou gráfico, identifique órgão produtor, período, amostra e metodologia. Uma taxa sem período pode induzir conclusão falsa."],["Variação percentual","Passar de 80 para 100 representa aumento de 20 unidades e de 25% sobre a base inicial. A conta é (100−80)/80×100."],["Pontos percentuais","Uma taxa de 12% que cai para 9% diminui três pontos percentuais. A redução relativa é de 25%: (12−9)/12."],["Média e mediana","Média é soma dividida pela quantidade; mediana é valor central após ordenar. Em 2, 3, 4, 5, 100, média é 22,8 e mediana é 4: valores extremos afetam mais a média."],["Correlação e causalidade","Duas variáveis que aumentam juntas não demonstram que uma causa a outra. É preciso considerar fatores externos, desenho do estudo e mecanismo causal."],["Gráficos truncados","Eixos verticais que começam em valor alto podem ampliar visualmente pequenas diferenças. Compare números absolutos, escalas e unidades."],["Exemplo resolvido","Uma pesquisa informa queda de desemprego de 10% para 8%. Não se deve afirmar que houve “queda de 2%”: foram dois pontos percentuais, ou queda relativa de 20%."],["Prática","Ao ler qualquer manchete quantitativa, registre: quem mediu, o quê, quando, base de comparação e o que não se pode concluir."]]},{"d":6,"title":"Legislação institucional — leitura estruturada das normas do TJ-SP","time":55,"parts":[["Limite desta aula","Este módulo ensina método de interpretação normativa. Não substitui o estudo dos artigos específicos das Normas de Serviço da Corregedoria Geral da Justiça e demais atos efetivamente relacionados no edital consolidado."],["Identifique o destinatário","Cada comando tem sujeito: juiz, escrivão, escrevente, chefe de seção ou unidade. Um enunciado pode descrever corretamente a providência, mas atribuí-la à pessoa errada."],["Diferencie obrigação e faculdade","“Deverá” é comando obrigatório; “poderá” admite faculdade dentro dos limites normativos; “é vedado” proíbe. Cuidado com alternativas que trocam uma dessas expressões."],["Prazos e marcos","Anote evento inicial, duração, modo de contagem e possibilidade de prorrogação. Não misture prazos da rotina cartorária com prazos processuais previstos no CPC ou CPP."],["Exceções","Palavras como “salvo”, “exceto”, “mediante autorização” e “quando necessário” mudam completamente a regra. Crie duas fichas: regra geral e exceção."],["Documento eletrônico","Na leitura de normas digitais, distinga protocolo, juntada, conclusão, publicação, intimação e certificação. São etapas diferentes, com responsáveis e consequências distintas."],["Exemplo didático","Regra hipotética: “O responsável deverá registrar a ocorrência até o dia útil seguinte, salvo indisponibilidade”. A alternativa “poderá registrar em dois dias corridos” erra verbo, prazo e unidade de contagem."],["Roteiro de estudo","Para cada artigo oficialmente exigido, produza ficha com número, sujeito, ação, prazo, exceção e sanção. Confira o texto oficial atualizado; não use o exemplo hipotético como se fosse regra do TJ-SP."]]}]);
